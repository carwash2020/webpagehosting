<script>
  const { createClient } = supabase;
  const SUPABASE_URL = 'https://csvfqdjuobylgafgolho.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs';
  const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  // Renders the resolved content blocks stored on client_portal_contracts
  // (the same block shape tools/contract-generator.html's PDF renderer
  // consumes, minus 'signature' blocks -- signing happens through this
  // page's own pad, not embedded in the read-only text). Read-only text
  // rendering, not a PDF -- much simpler than reusing jsPDF here, and
  // this page never needed a print layout for the client to review.
  function renderBlock(block) {
    switch (block.type) {
      case 'heading':
        return `<div class="contract-block-heading">${escapeHtml(block.text)}</div>${block.sub ? `<div class="contract-block-sub">${escapeHtml(block.sub)}</div>` : ''}`;
      case 'sectionLabel':
        return `<div class="contract-block-section-label">${escapeHtml(block.text)}</div>`;
      case 'paragraph':
        return `<div class="contract-block-paragraph">${escapeHtml(block.text)}</div>`;
      case 'field':
        if (!block.value) return '';
        return `<div class="contract-block-field"><span class="field-label">${escapeHtml(block.label)}</span><span class="field-value">${escapeHtml(block.value)}</span></div>`;
      case 'totalHighlight':
        return `<div class="contract-block-total"><span>${escapeHtml(block.label)}</span><span>${escapeHtml(block.value)}</span></div>`;
      case 'footnote':
        return `<div class="contract-block-footnote">${escapeHtml(block.text)}</div>`;
      default:
        return '';
    }
  }

  function renderContractBody(blocks) {
    if (!Array.isArray(blocks)) return '';
    return blocks.map(renderBlock).join('');
  }

  function toggleContractBody(id) {
    const body = document.getElementById('contractBody-' + id);
    if (body) body.classList.toggle('is-open');
  }

  // The 2x2 facts on a pending card (v2, 2026-09-28): price, when, where
  // and payment, read from the same field / total blocks the full text
  // below shows -- nothing new is fetched or stored. A fact the contract
  // doesn't have is left out; with none, there's no grid at all.
  const CONTRACT_FACTS = [
    { label: 'Price', match: /price|rate per|labor/i, total: true },
    { label: 'When', match: /date|preferred day/i },
    { label: 'Where', match: /address/i },
    { label: 'Payment', match: /balance|deposit|billing|payment/i },
  ];
  function contractFactsHtml(blocks) {
    if (!Array.isArray(blocks)) return '';
    const facts = CONTRACT_FACTS.map((f) => {
      const hit = (f.total && blocks.find((b) => b.type === 'totalHighlight' && b.value)) ||
        blocks.find((b) => b.type === 'field' && b.value && f.match.test(b.label || ''));
      return hit ? '<div class="contract-fact"><span class="contract-fact-label">' + escapeHtml(f.label) + '</span><span class="contract-fact-value">' + escapeHtml(hit.value) + '</span></div>' : '';
    }).filter(Boolean);
    return facts.length ? '<div class="contract-facts">' + facts.join('') + '</div>' : '';
  }

  // v2 card: kicker, Anton title, status pill, the facts grid (pending
  // only), Read full contract, then the signature pad and Sign / Decline.
  // A signed or declined contract is one compact row with its date.
  function renderContractCard(c) {
    const statusClass = c.status === 'signed' ? 'is-signed' : c.status === 'declined' ? 'is-declined' : 'is-pending';
    const statusLabel = c.status === 'signed' ? 'Signed' : c.status === 'declined' ? 'Declined' : 'Pending';
    const isPending = c.status === 'pending';

    return `
      <div class="contract-card is-${c.status === 'signed' ? 'signed' : c.status === 'declined' ? 'declined' : 'pending'}" id="contract-card-${c.id}" data-contract-id="${c.id}">
        <div class="contract-card-top">
          <div class="contract-card-head">
            <div class="contract-kicker">${isPending ? 'From Triple H &middot; ' : ''}<span class="contract-meta">${formatDate(c.created_at)}</span></div>
            <div class="contract-title">${escapeHtml(c.contract_title)}</div>
          </div>
          <span class="contract-status ${statusClass}">${isPending ? 'Needs your signature' : statusLabel}</span>
        </div>
        ${isPending ? contractFactsHtml(c.blocks) : ''}
        <button type="button" class="contract-body-toggle" onclick="toggleContractBody(${c.id})">Read full contract</button>
        <div class="contract-body" id="contractBody-${c.id}">${renderContractBody(c.blocks)}</div>
        ${isPending ? `
          <div class="signature-pad-wrap">
            <div class="signature-pad-label">Sign with your finger or mouse</div>
            <canvas id="signatureCanvas-${c.id}" width="600" height="180" style="width:100%; max-width:560px; height:160px; background:#ffffff; border:1px solid var(--border); border-radius:8px; touch-action:none; cursor:crosshair; display:block;"></canvas>
            <div class="signature-pad-actions">
              <button type="button" class="secondary-btn signature-clear-btn" onclick="clearContractSignature(${c.id})">Clear</button>
              <span id="signatureStatus-${c.id}" style="color:var(--text-dim); font-size:13px;"></span>
            </div>
          </div>
          <div class="contract-error" id="contractError-${c.id}"></div>
          <div class="contract-actions">
            <button class="btn orange contract-sign-btn" onclick="respondToContract(${c.id}, 'sign', this)">Sign</button>
            <button class="btn secondary-btn contract-decline-btn" onclick="respondToContract(${c.id}, 'decline', this)">Decline</button>
          </div>
        ` : `
          <div class="responded-note">${c.status === 'signed' ? 'Signed' : 'Declined'}${c.responded_at ? ' on ' + formatDate(c.responded_at) : ''}.</div>
        `}
      </div>
    `;
  }

  let currentContracts = [];

  // The pointer-based drawing logic itself now lives in the shared
  // /signature-pad.js (2026-09-22, extracted from this page's original
  // implementation so the same proven pattern could be reused for the
  // card-authorization signature spots too) -- loading it is safe even
  // though this page deliberately loads none of the internal /tools/
  // scripts (see quotes.html/dashboard.html's own isolation-boundary
  // comment), since it's a plain root-level file, not a /tools/ one.
  // These three thin wrappers keep this page's own call sites (which
  // pass a numeric contractId, not a raw canvasId) unchanged.
  function initSignaturePad(contractId) {
    sigPadInit('signatureCanvas-' + contractId, 'signatureStatus-' + contractId);
  }
  function clearContractSignature(contractId) {
    sigPadClear('signatureCanvas-' + contractId, 'signatureStatus-' + contractId);
  }
  function getContractSignatureDataUrl(contractId) {
    return sigPadDataUrl('signatureCanvas-' + contractId);
  }

  async function renderContracts() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.replace('/portal/login.html');
      return;
    }
    document.getElementById('clientEmailDisplay').textContent = session.user.email;
    if (typeof portalSetHeaderInitials === 'function') portalSetHeaderInitials(session.user.email);
    await portalGuardWithBiometricLock(session.user.email, client);
    // Keeps the Request/Jobs unread badges on the bottom nav while
    // browsing other tabs (2026-09-22). Fire-and-forget; never throws.
    portalStartUnreadBadges(client);

    const listEl = document.getElementById('contractList');
    listEl.innerHTML = portalSkeletonCards(3);

    const { data: contracts, error } = await client
      .from('client_portal_contracts')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = `<div class="empty-state is-error"><div class="empty-state-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v6"/><circle cx="12" cy="16.75" r="0.6" fill="currentColor" stroke="none"/></svg></div><p class="empty-state-title">Couldn't load your contracts right now. Please try again in a moment.</p></div>`;
      console.error(error);
      return;
    }
    currentContracts = contracts;
    if (!contracts.length) {
      listEl.innerHTML = `<div class="empty-state is-neutral"><div class="empty-state-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h7.5L18 8v12.5H6z"/><path d="M13.5 3.5V8H18"/><path d="M9 12.5h6M9 16h6"/></svg></div><p class="empty-state-title">No contracts on file yet.</p><p class="empty-state-sub">When we send you a contract to sign, it will show up here.</p></div>`;
      return;
    }

    const pending = contracts.filter(c => c.status === 'pending');
    const responded = contracts.filter(c => c.status !== 'pending');

    let html = '';
    if (pending.length) {
      html += `<div class="contract-section-title">Needs your signature</div><div class="card-grid">` + pending.map(renderContractCard).join('') + '</div>';
    }
    if (responded.length) {
      html += `<div class="contract-section-title">Responded</div><div class="card-grid">` + responded.map(renderContractCard).join('') + '</div>';
    }
    listEl.innerHTML = html;
    pending.forEach(c => initSignaturePad(c.id));
    portalScrollToHash();
  }

  async function respondToContract(contractId, action, btnEl) {
    const { data: { session } } = await client.auth.getSession();
    if (!session) { window.location.replace('/portal/login.html'); return; }

    const errorEl = document.getElementById('contractError-' + contractId);
    errorEl.textContent = '';

    let clientSignatureDataUrl = null;
    if (action === 'sign') {
      clientSignatureDataUrl = getContractSignatureDataUrl(contractId);
      if (!clientSignatureDataUrl) {
        errorEl.textContent = 'Please draw your signature above before signing.';
        return;
      }
    }

    const verb = action === 'sign' ? 'sign' : 'decline';
    const confirmed = await portalConfirm(`Are you sure you want to ${verb} this contract?`, {
      confirmLabel: action === 'sign' ? 'Sign' : 'Decline',
      danger: action === 'decline',
    });
    if (!confirmed) return;

    const actionsContainer = btnEl ? btnEl.closest('.contract-actions') : null;
    const buttonsToDisable = actionsContainer ? actionsContainer.querySelectorAll('button') : [];
    buttonsToDisable.forEach(b => { b.disabled = true; });

    try {
      const res = await fetch(
        'https://csvfqdjuobylgafgolho.supabase.co/functions/v1/respond-to-contract',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({ contract_id: contractId, action, client_signature_data_url: clientSignatureDataUrl }),
        }
      );
      const result = await res.json();
      if (!result.ok) {
        errorEl.textContent = result.error || 'Something went wrong. Please try again.';
        buttonsToDisable.forEach(b => { b.disabled = false; });
        return;
      }
      renderContracts();
    } catch (e) {
      errorEl.textContent = "Couldn't reach the server. Please check your connection and try again.";
      buttonsToDisable.forEach(b => { b.disabled = false; });
    }
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.replace('/portal/login.html');
  });

  renderContracts();
  initPortalPullToRefresh(renderContracts);
</script>

  Works whether or not the client is signed in (client_email is best-
  effort, from the current session if one exists) since a real problem
  can happen on any page, not just Invoices.

<div class="report-bug-overlay" id="reportBugOverlay" style="display:none;">
  <div class="report-bug-modal">
    <div class="report-bug-title" id="reportBugTitle">Report a problem</div>
    <p class="report-bug-sub" id="reportBugSub">Tell us what happened. We'll take a look.</p>
    <div id="reportBugFormArea">
      <textarea id="reportBugMessage" placeholder="What went wrong?" rows="4" aria-label="Describe what went wrong"></textarea>
      <div class="report-bug-error" id="reportBugError"></div>
      <div class="report-bug-actions">
        <button class="btn secondary-btn" id="reportBugCancel" type="button">Cancel</button>
        <button class="btn orange" id="reportBugSubmit" type="button">Send</button>
      </div>
    </div>
    <div class="report-bug-success" id="reportBugSuccess" style="display:none;">Thanks, we got your report and will take a look.</div>
  </div>
</div>


<script>
  (function () {
    const link = document.getElementById('reportBugLink');
    const overlay = document.getElementById('reportBugOverlay');
    const cancelBtn = document.getElementById('reportBugCancel');
    const submitBtn = document.getElementById('reportBugSubmit');
    const messageInput = document.getElementById('reportBugMessage');
    const errorEl = document.getElementById('reportBugError');
    const formArea = document.getElementById('reportBugFormArea');
    const successEl = document.getElementById('reportBugSuccess');

    let releaseReportBugFocusTrap = null;
    function openReportBug() {
      overlay.style.display = 'flex';
      formArea.style.display = 'block';
      successEl.style.display = 'none';
      messageInput.value = '';
      errorEl.textContent = '';
      releaseReportBugFocusTrap = trapFocusWithin(overlay);
    }
    function closeReportBug() {
      overlay.style.display = 'none';
      if (releaseReportBugFocusTrap) { releaseReportBugFocusTrap(); releaseReportBugFocusTrap = null; }
    }
    link.addEventListener('click', openReportBug);
    cancelBtn.addEventListener('click', closeReportBug);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeReportBug(); });
    document.addEventListener('keydown', (e) => {
      if (overlay.style.display === 'none') return;
      if (e.key === 'Escape') closeReportBug();
    });

    submitBtn.addEventListener('click', async () => {
      const message = messageInput.value.trim();
      if (!message) { errorEl.textContent = 'Please describe the problem first.'; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      errorEl.textContent = '';
      let clientEmail = null;
      try {
        const { data } = await client.auth.getSession();
        clientEmail = data.session ? data.session.user.email : null;
      } catch (e) { /* not signed in, that's fine -- report goes in anonymous */ }
      try {
        const res = await fetch('https://csvfqdjuobylgafgolho.supabase.co/rest/v1/portal_bug_reports', {
          method: 'POST',
          headers: {
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            client_email: clientEmail,
            message: message,
            page_url: window.location.pathname,
            user_agent: navigator.userAgent,
          }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        formArea.style.display = 'none';
        successEl.style.display = 'block';
      } catch (e) {
        errorEl.textContent = "Couldn't send that. Please call us instead.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
      }
    });
  })();
</script>
