  full-repo audit): quotes already had a full async approve/decline
  flow via client_portal_quotes/respond-to-quote; the three contract
  templates in tools/contract-generator.html could only ever be signed
  in person, on the same device, via its two canvas pads. This page is
  the async counterpart -- same isolation boundary as quotes.html/
  dashboard.html/login.html (no internal /tools/ scripts loaded, only
  shared stylesheets for visual consistency). Every contract shown here
  comes from client_portal_contracts, whose RLS policy guarantees a
  signed-in client can only ever receive rows matching their own
  authenticated email -- this page doesn't add its own filtering on top,
  same reasoning as quotes.html/dashboard.html.
-->

<style>
  body { background: #0a0a0a; max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  @media (min-width: 860px) {

  .portal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .portal-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }

  .contract-status.is-signed { background: rgba(76,175,120,0.15); color: #4caf78; }

  .empty-state { text-align: center; color: var(--text-dim); padding: 60px 20px; }
  .empty-state-icon { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .empty-state-icon svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .empty-state.is-neutral .empty-state-icon { background: rgba(58,160,255,0.12); color: var(--blue-light); }

  .contract-section-title:first-child { margin-top: 0; }
  .contract-body-toggle { display: block; margin-top: 10px; font-size: 12.5px; color: var(--text-dim); text-decoration: underline; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
  .contract-body-toggle:hover { color: var(--orange-light); }
  .contract-body { margin-top: 10px; display: none; border-top: 1px solid var(--border); padding-top: 10px; }
  .contract-body.is-open { display: block; }
  .contract-block-heading { font-family:var(--font-ui); font-weight: 700; font-size: 15px; color: var(--white); margin: 12px 0 4px; }
  .contract-block-heading:first-child { margin-top: 0; }
  .contract-block-sub { color: var(--text-dim); font-size: 12.5px; margin-bottom: 8px; }

  .contract-block-field .field-value { color: var(--text); }
  .contract-block-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; color: var(--white); margin: 10px 0; padding: 8px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .contract-block-footnote { color: var(--text-dim); font-size: 11.5px; font-style: italic; margin-top: 14px; }
  .signature-pad-wrap { margin-top: 14px; }
  .signature-pad-label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  #signatureCanvas-tpl { width: 100%; max-width: 560px; height: 160px; background: #ffffff; border: 1px solid var(--border); border-radius: 8px; touch-action: none; cursor: crosshair; display: block; }
  .signature-pad-actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .contract-actions { display: flex; gap: 8px; margin-top: 12px; }
  .contract-actions button { flex: 1; justify-content: center; }
  .responded-note { color: var(--text-dim); font-size: 12.5px; margin-top: 8px; }
  .contract-error { color: #e05252; font-size: 12.5px; margin: 6px 0 0; }
</style>

<div id="contractList"></div>

<script>
  const { createClient } = supabase;
  const SUPABASE_URL = 'https://csvfqdjuobylgafgolho.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs';
  const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  // Renders the resolved content blocks stored on client_portal_contracts
  // (the same block shape tools/contract-generator.html's PDF renderer
  // consumes, minus 'signature' blocks -- signing happens through this
  // page's own pad, not embedded in the read-only text). Read-only text
  // rendering, not a PDF -- much simpler than reusing jsPDF here, and
  // this page never needed a print layout for the client to review.
  function renderBlock(block) {
    switch (block.type) {
      case 'heading':
        return `<div class="contract-block-heading">${escapeHtml(block.text)}</div>${block.sub ? `<div class="contract-block-sub">${escapeHtml(block.sub)}</div>` : ''}`;
      case 'sectionLabel':
        return `<div class="contract-block-section-label">${escapeHtml(block.text)}</div>`;
      case 'paragraph':
        return `<div class="contract-block-paragraph">${escapeHtml(block.text)}</div>`;
      case 'field':
        if (!block.value) return '';
        return `<div class="contract-block-field"><span class="field-label">${escapeHtml(block.label)}</span><span class="field-value">${escapeHtml(block.value)}</span></div>`;
      case 'totalHighlight':
        return `<div class="contract-block-total"><span>${escapeHtml(block.label)}</span><span>${escapeHtml(block.value)}</span></div>`;
      case 'footnote':
        return `<div class="contract-block-footnote">${escapeHtml(block.text)}</div>`;
      default:
        return '';
    }
  }

  function renderContractBody(blocks) {
    if (!Array.isArray(blocks)) return '';
    return blocks.map(renderBlock).join('');
  }

  function toggleContractBody(id) {
    const body = document.getElementById('contractBody-' + id);
    if (body) body.classList.toggle('is-open');
  }

  function renderContractCard(c) {
    const statusClass = c.status === 'signed' ? 'is-signed' : c.status === 'declined' ? 'is-declined' : 'is-pending';
    const statusLabel = c.status === 'signed' ? 'Signed' : c.status === 'declined' ? 'Declined' : 'Pending';
    const isPending = c.status === 'pending';

    return `
      <div class="contract-card" data-contract-id="${c.id}">
        <div class="contract-card-top">
          <div>
            <div class="contract-title">${escapeHtml(c.contract_title)}</div>
            <div class="contract-meta">${formatDate(c.created_at)}</div>
          </div>
          <span class="contract-status ${statusClass}">${statusLabel}</span>
        </div>
        <button type="button" class="contract-body-toggle" onclick="toggleContractBody(${c.id})">Read full contract</button>
        <div class="contract-body" id="contractBody-${c.id}">${renderContractBody(c.blocks)}</div>
        ${isPending ? `
          <div class="signature-pad-wrap">
            <div class="signature-pad-label">Draw your signature to sign below</div>
            <canvas id="signatureCanvas-${c.id}" width="600" height="180" style="width:100%; max-width:560px; height:160px; background:#ffffff; border:1px solid var(--border); border-radius:8px; touch-action:none; cursor:crosshair; display:block;"></canvas>
            <div class="signature-pad-actions">
              <button type="button" class="secondary-btn" onclick="clearContractSignature(${c.id})">Clear</button>
              <span id="signatureStatus-${c.id}" style="color:var(--text-dim); font-size:13px;"></span>
            </div>
          </div>
          <div class="contract-error" id="contractError-${c.id}"></div>
          <div class="contract-actions">
            <button class="btn blue" onclick="respondToContract(${c.id}, 'sign', this)">Sign</button>
            <button class="btn secondary-btn" onclick="respondToContract(${c.id}, 'decline', this)">Decline</button>
          </div>
        ` : `
          <div class="responded-note">${c.status === 'signed' ? 'Signed' : 'Declined'}${c.responded_at ? ' on ' + formatDate(c.responded_at) : ''}.</div>
        `}
      </div>
    `;
  }

  let currentContracts = [];
  const signaturePads = {};

  // Same pointer-based drawing logic as tools/contract-generator.html's
  // two in-person pads -- reimplemented here rather than shared, since
  // this page deliberately loads none of the internal /tools/ scripts
  // (same isolation boundary as quotes.html/dashboard.html).
  function initSignaturePad(contractId) {
    const canvas = document.getElementById('signatureCanvas-' + contractId);
    if (!canvas) return;
    signaturePads[contractId] = { hasDrawing: false };
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    let drawing = false;

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
    }

    canvas.addEventListener('pointerdown', (e) => {
      drawing = true;
      signaturePads[contractId].hasDrawing = true;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      const statusEl = document.getElementById('signatureStatus-' + contractId);
      if (statusEl) statusEl.textContent = 'Signature captured';
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      const p = pos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    });
    canvas.addEventListener('pointerup', () => { drawing = false; });
    canvas.addEventListener('pointercancel', () => { drawing = false; });
  }

  function clearContractSignature(contractId) {
    const canvas = document.getElementById('signatureCanvas-' + contractId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (signaturePads[contractId]) signaturePads[contractId].hasDrawing = false;
    const statusEl = document.getElementById('signatureStatus-' + contractId);
    if (statusEl) statusEl.textContent = '';
  }

  function getContractSignatureDataUrl(contractId) {
    if (!signaturePads[contractId] || !signaturePads[contractId].hasDrawing) return null;
    return document.getElementById('signatureCanvas-' + contractId).toDataURL('image/png');
  }

  async function renderContracts() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.replace('/portal/login.html');
      return;
    }
    document.getElementById('clientEmailDisplay').textContent = session.user.email;
    await portalGuardWithBiometricLock(session.user.email, client);

    const listEl = document.getElementById('contractList');
    listEl.innerHTML = portalSkeletonCards(3);

    const { data: contracts, error } = await client
      .from('client_portal_contracts')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = `<div class="empty-state is-error"><div class="empty-state-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v6"/><circle cx="12" cy="16.75" r="0.6" fill="currentColor" stroke="none"/></svg></div><p class="empty-state-title">Couldn't load your contracts right now. Please try again in a moment.</p></div>`;
      console.error(error);
      return;
    }
    currentContracts = contracts;
    if (!contracts.length) {
      listEl.innerHTML = `<div class="empty-state is-neutral"><div class="empty-state-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h7.5L18 8v12.5H6z"/><path d="M13.5 3.5V8H18"/><path d="M9 12.5h6M9 16h6"/></svg></div><p class="empty-state-title">No contracts on file yet.</p></div>`;
      return;
    }

    const pending = contracts.filter(c => c.status === 'pending');
    const responded = contracts.filter(c => c.status !== 'pending');

    let html = '';
    if (pending.length) {
      html += `<div class="contract-section-title">Needs your signature</div>` + pending.map(renderContractCard).join('');
    }
    if (responded.length) {
      html += `<div class="contract-section-title">Responded</div>` + responded.map(renderContractCard).join('');
    }
    listEl.innerHTML = html;
    pending.forEach(c => initSignaturePad(c.id));
  }

  async function respondToContract(contractId, action, btnEl) {
    const { data: { session } } = await client.auth.getSession();
    if (!session) { window.location.replace('/portal/login.html'); return; }

    const errorEl = document.getElementById('contractError-' + contractId);
    errorEl.textContent = '';

    let clientSignatureDataUrl = null;
    if (action === 'sign') {
      clientSignatureDataUrl = getContractSignatureDataUrl(contractId);
      if (!clientSignatureDataUrl) {
        errorEl.textContent = 'Please draw your signature above before signing.';
        return;
      }
    }

    const verb = action === 'sign' ? 'sign' : 'decline';
    const confirmed = await portalConfirm(`Are you sure you want to ${verb} this contract?`, {
      confirmLabel: action === 'sign' ? 'Sign' : 'Decline',
      danger: action === 'decline',
    });
    if (!confirmed) return;

    const actionsContainer = btnEl ? btnEl.closest('.contract-actions') : null;
    const buttonsToDisable = actionsContainer ? actionsContainer.querySelectorAll('button') : [];
    buttonsToDisable.forEach(b => { b.disabled = true; });

    try {
      const res = await fetch(
        'https://csvfqdjuobylgafgolho.supabase.co/functions/v1/respond-to-contract',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({ contract_id: contractId, action, client_signature_data_url: clientSignatureDataUrl }),
        }
      );
      const result = await res.json();
      if (!result.ok) {
        errorEl.textContent = result.error || 'Something went wrong. Please try again.';
        buttonsToDisable.forEach(b => { b.disabled = false; });
        return;
      }
      renderContracts();
    } catch (e) {
      errorEl.textContent = "Couldn't reach the server. Please check your connection and try again.";
      buttonsToDisable.forEach(b => { b.disabled = false; });
    }
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.replace('/portal/login.html');
  });

  renderContracts();
  initPortalPullToRefresh(renderContracts);
</script>
