<!DOCTYPE html>
<html lang="en" style="background:#0a0a0a;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your Quotes | Triple H Enterprises</title>
<!--
  Client Portal quotes page (2026-09-01), phase 2 of the full
  client-hub roadmap in docs/CLIENT-PORTAL.md. Same isolation as
  dashboard.html and login.html: no internal /tools/ scripts loaded at
  all, only shared stylesheets for visual consistency. Every quote
  shown here comes from client_portal_quotes, whose RLS policy
  guarantees a signed-in client can only ever receive rows matching
  their own authenticated email -- this page doesn't add its own
  filtering on top, same reasoning as dashboard.html.

  Deliberately does NOT include a client-facing PDF download for
  quotes in this first pass (unlike invoices/receipts) -- keeping this
  page's scope to the core review/approve/decline/ask-a-question flow.
  A quote PDF download can reuse the exact same jsPDF pattern already
  proven in dashboard.html if wanted later.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://csvfqdjuobylgafgolho.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
<!-- color-scheme (2026-09-02): tells the browser to use a DARK default
     canvas BEFORE any CSS is parsed. Without it the browser paints its
     own white default first, which showed as a white flash on every
     navigation between portal pages. The inline background on <html>
     below is not enough on its own -- that only applies once the HTML
     starts parsing, which is already too late. -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png?v=202608010300">
<link rel="manifest" href="/portal/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triple H">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=202608010300">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=202609022200">
<link rel="stylesheet" href="/tools/styles-tools.css?v=a2e87effb3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: #0a0a0a; max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  /* Widened for real desktop screens (2026-09-03), reported directly
     from actual desktop screenshots: "not good on desk top, doesnt
     even take up the full screen." 640px was chosen for mobile, where
     it effectively IS full-width -- but on a real monitor it left a
     narrow, centered column with a huge, obviously unintentional-
     looking gap on both sides. 900px is comfortable for a
     dashboard-style layout with cards and forms (unlike a plain
     text article, which reads worse past ~700-800px, form inputs and
     card grids use the extra width naturally rather than just
     stretching prose into overly long lines) without going fully
     edge-to-edge on today's larger screens, which would look just as
     unintentional in the other direction. The 860px breakpoint keeps
     tablets in portrait orientation on the mobile-tuned layout, since
     900px there would be wider than the viewport itself. */
  @media (min-width: 860px) {
    body { max-width: 900px; }
  }
  .portal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  /* min-width:0 (2026-09-02, from a direct screenshot): a flex child
     defaults to min-width:auto, which means it will NEVER shrink
     below its content's natural width -- so a long email address just
     overflowed straight through the settings/sign-out buttons next to
     it rather than truncating. min-width:0 lets it actually shrink,
     and .portal-sub below does the truncating. */
  .portal-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .portal-header-left > div { min-width: 0; }
  .portal-header img { width: 40px; height: auto; }
  .portal-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 19px; color: var(--white); }
  .portal-sub {
    color: var(--text-dim); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .portal-header-actions { display: flex; gap: 8px; align-items: center; }
  .portal-icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-panel-2); color: var(--text-dim); text-decoration: none; cursor: pointer;
  }
  .portal-icon-btn:hover { border-color: var(--orange); color: var(--orange-light); }
  .portal-icon-btn svg { width: 18px; height: 18px; }
  /* Fixed 2026-09-02, from a direct screenshot: with flex-wrap and
     flex:1 on 5 items, the 5th item (Jobs) couldn't fit on the first
     row at real phone widths, wrapped alone onto a second row, and
     then stretched to fill the FULL width by itself (a lone flex:1
     item on its own row always does) -- a huge, orphaned pill that
     looked broken rather than intentional.
     A CSS grid with exactly 5 equal columns never has this failure
     mode: every item is always on one row, at whatever width 1/5 of
     the container comes out to, right down to genuinely tiny phones.
     Narrower labels wrap to two lines inside their own cell instead
     of the layout itself breaking. */
  .portal-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 24px; }
  .portal-nav a {
    text-align: center; padding: 9px 6px; border-radius: 8px; font-size: 12.5px; font-weight: 600; line-height: 1.25;
    text-decoration: none; border: 1px solid var(--border); color: var(--text-dim);
  }
  .portal-nav a.is-active { background: var(--orange-tint-soft); border-color: var(--orange-tint-border); color: var(--orange-light); }
  .quote-card {
    background: var(--bg-panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }
  .quote-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .quote-number { font-weight: 600; color: var(--white); font-size: 15px; }
  .quote-desc { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .quote-total { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 20px; color: var(--white); }
  .quote-status { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 600; display: inline-block; }
  .quote-status.is-pending { background: rgba(255,167,38,0.15); color: #ffa726; }
  .quote-status.is-approved { background: rgba(76,175,120,0.15); color: #4caf78; }
  .quote-status.is-declined { background: rgba(224,82,82,0.15); color: #e05252; }
  .empty-state { text-align: center; color: var(--text-dim); padding: 60px 20px; }
  .quote-section-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 10px; }
  .quote-section-title:first-child { margin-top: 0; }
  .quote-actions { display: flex; gap: 8px; margin-top: 10px; }
  .quote-actions button { flex: 1; justify-content: center; }
  .quote-question-toggle { display: block; margin-top: 10px; font-size: 12.5px; color: var(--text-dim); text-decoration: underline; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
  .quote-question-toggle:hover { color: var(--orange-light); }
  .quote-question-form { margin-top: 10px; display: none; }
  .quote-question-form.is-open { display: block; }
  .quote-question-form textarea { width: 100%; padding: 10px 12px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; color: var(--white); font-size: 13.5px; font-family: inherit; box-sizing: border-box; resize: vertical; }
  .quote-question-error { color: #e05252; font-size: 12.5px; margin: 6px 0 0; }
  .quote-question-success { color: #4caf78; font-size: 13px; margin: 6px 0 0; }
  .responded-note { color: var(--text-dim); font-size: 12.5px; margin-top: 8px; }
  .schedule-toggle { display: block; margin-top: 10px; font-size: 12.5px; color: var(--text-dim); text-decoration: underline; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
  .schedule-toggle:hover { color: var(--orange-light); }
  .schedule-panel { margin-top: 10px; display: none; }
  .schedule-panel.is-open { display: block; }
  .schedule-note { color: #4caf78; font-size: 13px; margin-top: 8px; }
  .date-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
  .date-btn {
    flex: 0 0 auto; min-width: 60px; text-align: center; background: var(--bg-panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 7px; cursor: pointer;
    color: var(--text); font-family: inherit; scroll-snap-align: start;
    transition: border-color .15s ease, background .15s ease;
  }
  .date-btn .dow { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .date-btn .dom { font-size: 16px; font-weight: 700; margin-top: 2px; font-family: 'Oswald', sans-serif; }
  .date-btn.is-selected { border-color: var(--orange); background: var(--orange-tint-soft); color: var(--orange-light); }
  .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .slot-btn {
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 6px; cursor: pointer; color: var(--text); font-family: inherit; font-size: 13px;
    text-align: center; font-weight: 500; transition: border-color .15s ease, background .15s ease;
  }
  .slot-btn.is-selected { border-color: var(--orange); background: var(--orange-tint-soft); color: var(--orange-light); font-weight: 700; }
  .slots-empty { color: var(--text-dim); font-size: 13px; padding: 12px 0; text-align: center; }
  .schedule-summary { font-size: 13.5px; color: var(--text); margin: 10px 0; }
  .schedule-error { color: #e05252; font-size: 12.5px; margin: 6px 0 0; }
  .report-bug-link { display: block; margin-top: 14px; font-size: 12px; color: var(--text-dim); text-decoration: underline; cursor: pointer; text-align: center; background: none; border: none; font-family: inherit; padding: 0; }
  .report-bug-link:hover { color: var(--orange-light); }
  .report-bug-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
  .report-bug-modal { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 400px; width: 100%; }
  .report-bug-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 18px; color: var(--white); margin-bottom: 6px; }
  .report-bug-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }
  .report-bug-modal textarea { width: 100%; padding: 11px 13px; background: var(--bg-panel-2); border: 1px solid var(--border); border-radius: 8px; color: var(--white); font-size: 14px; font-family: inherit; box-sizing: border-box; resize: vertical; }
  .report-bug-error { color: #e05252; font-size: 13px; margin: 8px 0 0; min-height: 1px; }
  .report-bug-success { color: #4caf78; font-size: 14px; margin: 4px 0; line-height: 1.5; }
  .report-bug-actions { display: flex; gap: 10px; margin-top: 16px; }
  .report-bug-actions button { flex: 1; justify-content: center; }
</style>
</head>
<body>

<div class="portal-header">
  <div class="portal-header-left">
    <img src="/images/logo-signature-orange.webp?v=202608142300" alt="Triple H Enterprises">
    <div>
      <div class="portal-title">Your Quotes</div>
      <div class="portal-sub" id="clientEmailDisplay"></div>
    </div>
  </div>
  <div class="portal-header-actions">
    <a href="/portal/settings.html" class="portal-icon-btn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </a>
    <button class="secondary-btn" id="signOutBtn">Sign out</button>
  </div>
</div>

<div class="portal-nav">
  <a href="/portal/home.html">Home</a>
  <a href="/portal/work-orders.html">Request</a>
  <a href="/portal/quotes.html" class="is-active">Quotes</a>
  <a href="/portal/dashboard.html">Invoices</a>
  <a href="/portal/jobs.html">Jobs</a>
</div>

<div id="quoteList"></div>

<script>
  const { createClient } = supabase;
  const client = createClient(
    'https://csvfqdjuobylgafgolho.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs'
  );

  function formatCurrency(n) {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
  }
  function formatDate(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Matches this project's own escapeHtml() convention exactly (used
  // throughout /tools/ and portal/dashboard.html) -- reimplemented
  // here rather than shared, since this page deliberately loads none
  // of the internal scripts.
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  function renderLineItemsTable(items) {
    if (!Array.isArray(items) || !items.length) return '';
    const rows = items.map(li => `
      <tr>
        <td style="padding:4px 0; color:var(--text-dim); font-size:13px;">${escapeHtml(li.desc || '')}</td>
        <td style="padding:4px 0; text-align:center; color:var(--text-dim); font-size:13px;">${escapeHtml(String(li.qty ?? ''))}</td>
        <td style="padding:4px 0; text-align:right; color:var(--text-dim); font-size:13px;">${formatCurrency(li.amount || 0)}</td>
      </tr>
    `).join('');
    return `
      <details style="margin-top:8px;">
        <summary style="cursor:pointer; font-size:13px; color:var(--text-dim);">View details</summary>
        <table style="width:100%; margin-top:8px; border-top:1px solid var(--border); padding-top:6px;">
          <tbody>${rows}</tbody>
        </table>
      </details>
    `;
  }

  function renderQuoteCard(q) {
    const statusClass = q.status === 'approved' ? 'is-approved' : q.status === 'declined' ? 'is-declined' : 'is-pending';
    const statusLabel = q.status === 'approved' ? 'Approved' : q.status === 'declined' ? 'Declined' : 'Pending';
    const isPending = q.status === 'pending';

    return `
      <div class="quote-card">
        <div class="quote-card-top">
          <div>
            <div class="quote-number">${escapeHtml(q.quote_number)}</div>
            ${q.description ? `<div class="quote-desc">${escapeHtml(q.description)}</div>` : ''}
            <div class="quote-desc">${formatDate(q.quote_date)}</div>
          </div>
          <div style="text-align:right;">
            <div class="quote-total">${formatCurrency(q.total)}</div>
            <span class="quote-status ${statusClass}">${statusLabel}</span>
          </div>
        </div>
        ${renderLineItemsTable(q.line_items)}
        ${isPending ? `
          <div class="quote-actions">
            <button class="btn blue" onclick="respondToQuote(${q.id}, 'approve')">Approve</button>
            <button class="btn secondary-btn" onclick="respondToQuote(${q.id}, 'decline')">Decline</button>
          </div>
          <button type="button" class="quote-question-toggle" onclick="toggleQuestionForm(${q.id})">Ask a question about this quote</button>
          <div class="quote-question-form" id="questionForm-${q.id}">
            <textarea id="questionText-${q.id}" rows="3" placeholder="What would you like to ask?"></textarea>
            <div class="quote-question-error" id="questionError-${q.id}"></div>
            <div class="quote-question-success" id="questionSuccess-${q.id}" style="display:none;">Sent. We'll follow up by phone, text, or email.</div>
            <button class="btn secondary-btn" style="width:100%; justify-content:center; margin-top:8px;" onclick="submitQuestion(${q.id})">Send question</button>
          </div>
        ` : `
          <div class="responded-note">${q.status === 'approved' ? 'Approved' : 'Declined'}${q.responded_at ? ' on ' + formatDate(q.responded_at.slice(0, 10)) : ''}.</div>
          ${q.status === 'approved' ? (q.scheduled_at ? `
            <div class="responded-note" style="color:#4caf78;">Job scheduled. We'll see you then! Call or text us if you need to reschedule.</div>
          ` : `
            <button type="button" class="schedule-toggle" onclick="toggleScheduleForm(${q.id})">Schedule this job</button>
            <div class="schedule-panel" id="schedulePanel-${q.id}">
              <div class="date-row" id="dateRow-${q.id}"></div>
              <div class="slots-grid" id="slotsGrid-${q.id}"></div>
              <div class="slots-empty" id="slotsEmpty-${q.id}" style="display:none;">No open times that day. Try another.</div>
              <div class="schedule-summary" id="scheduleSummary-${q.id}" style="display:none;"></div>
              <div class="schedule-error" id="scheduleError-${q.id}"></div>
              <button class="btn blue" style="width:100%; justify-content:center; margin-top:8px; display:none;" id="scheduleConfirmBtn-${q.id}" onclick="confirmSchedule(${q.id})">Confirm this time</button>
            </div>
          `) : ''}
        `}
      </div>
    `;
  }

  let currentQuotes = [];

  async function renderQuotes() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.replace('/portal/login.html');
      return;
    }
    document.getElementById('clientEmailDisplay').textContent = session.user.email;

    // Shown immediately, before the fetch -- without this, a client
    // on a slow connection sees a completely blank area that looks
    // identical to "no quotes on file yet" (2026-09-03, found
    // proactively while reviewing the portal for other real gaps).
    const listEl = document.getElementById('quoteList');
    listEl.innerHTML = '<div class="empty-state">Loading...</div>';

    const { data: quotes, error } = await client
      .from('client_portal_quotes')
      .select('*')
      .order('quote_date', { ascending: false });

    if (error) {
      listEl.innerHTML = `<div class="empty-state">Couldn't load your quotes right now. Please try again in a moment.</div>`;
      console.error(error);
      return;
    }
    currentQuotes = quotes;
    if (!quotes.length) {
      listEl.innerHTML = `<div class="empty-state">No quotes on file yet.</div>`;
      return;
    }

    // Same reasoning as dashboard.html's Outstanding/Paid split: a
    // client's most relevant question is usually "what still needs my
    // response," not scanning past everything already settled.
    const pending = quotes.filter(q => q.status === 'pending');
    const responded = quotes.filter(q => q.status !== 'pending');

    let html = '';
    if (pending.length) {
      html += `<div class="quote-section-title">Needs your response</div>` + pending.map(renderQuoteCard).join('');
    }
    if (responded.length) {
      html += `<div class="quote-section-title">Responded</div>` + responded.map(renderQuoteCard).join('');
    }
    listEl.innerHTML = html;
  }

  function toggleQuestionForm(quoteId) {
    const form = document.getElementById('questionForm-' + quoteId);
    if (form) form.classList.toggle('is-open');
  }

  async function respondToQuote(quoteId, action) {
    const { data: { session } } = await client.auth.getSession();
    if (!session) { window.location.replace('/portal/login.html'); return; }

    const verb = action === 'approve' ? 'approve' : 'decline';
    if (!window.confirm(`Are you sure you want to ${verb} this quote?`)) return;

    try {
      const res = await fetch(
        'https://csvfqdjuobylgafgolho.supabase.co/functions/v1/respond-to-quote',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Authorization': `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({ quote_id: quoteId, action }),
        }
      );
      const result = await res.json();
      if (!result.ok) {
        alert(result.error || 'Something went wrong. Please try again.');
        return;
      }
      renderQuotes();
    } catch (e) {
      alert("Couldn't reach the server. Please check your connection and try again.");
    }
  }

  // ---------- scheduling (phase 3) ----------
  // Timezone/hours logic copied verbatim from booking.html rather than
  // shared -- this page deliberately loads none of the internal
  // scripts, same isolation reason as escapeHtml/loadImageAsDataURL
  // above, and booking.html itself has no shared module to import
  // from either (it's a standalone public page). Keep these in sync
  // manually if business hours or timezone ever change.
  const BUSINESS_TIMEZONE = 'America/Denver';
  const HOURS_BY_WEEKDAY = { 0: [14, 20], 1: [14, 22], 2: [14, 22], 3: [14, 22], 4: [14, 22], 5: [14, 22], 6: [7, 22] };
  const SLOT_INCREMENT_MINUTES = 30;
  const MIN_LEAD_HOURS = 2;
  const DAYS_AHEAD_SHOWN = 14;
  const SCHEDULE_BUFFER_MINUTES = 15;
  // A quote-scheduled job has no service picker (unlike booking.html)
  // since it's already tied to a specific, already-quoted job -- 120
  // minutes matches the most common service durations in booking.html
  // (appliance/handyman/assembly) as a reasonable generic default.
  const DEFAULT_JOB_MINUTES = 120;

  function zonedTimeToUtc(dateStr, hh, mm) {
    const timeStr = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    const naiveUtc = new Date(dateStr + 'T' + timeStr + ':00Z');
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: BUSINESS_TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    }).formatToParts(naiveUtc);
    const map = {};
    parts.forEach(p => { map[p.type] = p.value; });
    const hourFixed = map.hour === '24' ? '00' : map.hour;
    const asIfLocal = new Date(map.year + '-' + map.month + '-' + map.day + 'T' + hourFixed + ':' + map.minute + ':' + map.second + 'Z');
    const diff = naiveUtc.getTime() - asIfLocal.getTime();
    return new Date(naiveUtc.getTime() + diff);
  }
  function businessWeekday(dateStr) {
    const noonUtc = zonedTimeToUtc(dateStr, 12, 0);
    const s = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, weekday: 'short' }).format(noonUtc);
    return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(s);
  }
  function todayDateStrInBusinessTz() {
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    const map = {};
    parts.forEach(p => { map[p.type] = p.value; });
    return map.year + '-' + map.month + '-' + map.day;
  }
  function addDaysToDateStr(dateStr, days) {
    const d = new Date(dateStr + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }
  function overlaps(aStart, aEnd, bStart, bEnd) {
    return aStart < bEnd && bStart < aEnd;
  }

  // Only one scheduling panel is ever meaningfully open at a time in
  // practice, so this stays a single set of module-level variables
  // rather than per-quote state -- simpler, and matches how only one
  // question form realistically gets filled out at once too.
  let schedulingQuoteId = null;
  let selectedScheduleSlot = null;

  function toggleScheduleForm(quoteId) {
    const panel = document.getElementById('schedulePanel-' + quoteId);
    if (!panel) return;
    const opening = !panel.classList.contains('is-open');
    panel.classList.toggle('is-open');
    if (opening) {
      schedulingQuoteId = quoteId;
      renderScheduleDateRow(quoteId);
    }
  }

  function renderScheduleDateRow(quoteId) {
    const el = document.getElementById('dateRow-' + quoteId);
    if (!el) return;
    const today = todayDateStrInBusinessTz();
    let html = '';
    for (let i = 0; i < DAYS_AHEAD_SHOWN; i++) {
      const dateStr = addDaysToDateStr(today, i);
      const noonUtc = zonedTimeToUtc(dateStr, 12, 0);
      const dow = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, weekday: 'short' }).format(noonUtc);
      const dom = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, day: 'numeric' }).format(noonUtc);
      html += '<button type="button" class="date-btn" data-date="' + dateStr + '"><div class="dow">' + dow + '</div><div class="dom">' + dom + '</div></button>';
    }
    el.innerHTML = html;
    el.querySelectorAll('.date-btn').forEach(btn => {
      btn.addEventListener('click', () => selectScheduleDate(quoteId, btn.dataset.date));
    });
  }

  async function fetchBookingsForDate(dateStr) {
    const dayStartUtc = zonedTimeToUtc(dateStr, 0, 0);
    const rangeStart = new Date(dayStartUtc.getTime() - 24 * 60 * 60 * 1000).toISOString();
    const rangeEnd = new Date(dayStartUtc.getTime() + 2 * 24 * 60 * 60 * 1000).toISOString();
    const res = await fetch('https://csvfqdjuobylgafgolho.supabase.co/rest/v1/rpc/get_booking_availability', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
        Authorization: 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
      },
      body: JSON.stringify({ p_range_start: rangeStart, p_range_end: rangeEnd }),
    });
    if (!res.ok) throw new Error('availability check failed (HTTP ' + res.status + ')');
    const rows = await res.json();
    return rows.map(r => ({ start: new Date(r.start_at), end: new Date(r.end_at) }));
  }

  function computeScheduleSlots(dateStr, bookings) {
    const weekday = businessWeekday(dateStr);
    const hours = HOURS_BY_WEEKDAY[weekday];
    if (!hours) return [];
    const openHour = hours[0], closeHour = hours[1];
    const earliestAllowed = new Date(Date.now() + MIN_LEAD_HOURS * 60 * 60 * 1000);
    const bufferMs = SCHEDULE_BUFFER_MINUTES * 60000;

    const slots = [];
    for (let mins = openHour * 60; mins + DEFAULT_JOB_MINUTES <= closeHour * 60; mins += SLOT_INCREMENT_MINUTES) {
      const hh = Math.floor(mins / 60), mm = mins % 60;
      const startUtc = zonedTimeToUtc(dateStr, hh, mm);
      const endUtc = new Date(startUtc.getTime() + DEFAULT_JOB_MINUTES * 60000);
      if (startUtc < earliestAllowed) continue;
      const conflict = bookings.some(b => overlaps(startUtc, endUtc, new Date(b.start.getTime() - bufferMs), new Date(b.end.getTime() + bufferMs)));
      if (conflict) continue;
      const label = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, hour: 'numeric', minute: '2-digit' }).format(startUtc);
      slots.push({ startUtc, endUtc, label });
    }
    return slots;
  }

  async function selectScheduleDate(quoteId, dateStr) {
    document.querySelectorAll('#dateRow-' + quoteId + ' .date-btn').forEach(b => {
      b.classList.toggle('is-selected', b.dataset.date === dateStr);
    });
    const grid = document.getElementById('slotsGrid-' + quoteId);
    const emptyEl = document.getElementById('slotsEmpty-' + quoteId);
    const summaryEl = document.getElementById('scheduleSummary-' + quoteId);
    const confirmBtn = document.getElementById('scheduleConfirmBtn-' + quoteId);
    selectedScheduleSlot = null;
    summaryEl.style.display = 'none';
    confirmBtn.style.display = 'none';
    grid.innerHTML = '<p style="color:var(--text-dim); font-size:13px;">Loading times...</p>';
    emptyEl.style.display = 'none';

    let bookings;
    try {
      bookings = await fetchBookingsForDate(dateStr);
    } catch (e) {
      grid.innerHTML = '<p style="color:#ff8a80; font-size:13px; grid-column:1/-1;">Couldn\'t load available times. Try again.</p>';
      return;
    }
    const slots = computeScheduleSlots(dateStr, bookings);
    if (!slots.length) {
      grid.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    grid.innerHTML = slots.map((s, i) => '<button type="button" class="slot-btn" data-idx="' + i + '">' + s.label + '</button>').join('');
    grid.querySelectorAll('.slot-btn').forEach((btn, i) => {
      btn.addEventListener('click', () => {
        selectedScheduleSlot = slots[i];
        grid.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('is-selected'));
        btn.classList.add('is-selected');
        const dateLabel = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, weekday: 'long', month: 'long', day: 'numeric' }).format(slots[i].startUtc);
        summaryEl.textContent = dateLabel + ' at ' + slots[i].label;
        summaryEl.style.display = 'block';
        confirmBtn.style.display = 'block';
        document.getElementById('scheduleError-' + quoteId).textContent = '';
      });
    });
  }

  async function confirmSchedule(quoteId) {
    if (!selectedScheduleSlot) return;
    const { data: { session } } = await client.auth.getSession();
    if (!session) { window.location.replace('/portal/login.html'); return; }

    const errorEl = document.getElementById('scheduleError-' + quoteId);
    const confirmBtn = document.getElementById('scheduleConfirmBtn-' + quoteId);
    errorEl.textContent = '';
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Scheduling...';

    try {
      const res = await fetch(
        'https://csvfqdjuobylgafgolho.supabase.co/functions/v1/schedule-quote-job',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Authorization': `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({
            quote_id: quoteId,
            start_at: selectedScheduleSlot.startUtc.toISOString(),
            end_at: selectedScheduleSlot.endUtc.toISOString(),
          }),
        }
      );
      const result = await res.json();
      if (!result.ok) {
        errorEl.textContent = result.error || 'Something went wrong. Please try again.';
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Confirm this time';
        return;
      }
      renderQuotes();
    } catch (e) {
      errorEl.textContent = "Couldn't reach the server. Please check your connection and try again.";
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Confirm this time';
    }
  }

  async function submitQuestion(quoteId) {
    const textEl = document.getElementById('questionText-' + quoteId);
    const errorEl = document.getElementById('questionError-' + quoteId);
    const successEl = document.getElementById('questionSuccess-' + quoteId);
    const message = textEl.value.trim();
    errorEl.textContent = '';
    if (!message) { errorEl.textContent = 'Please write a question first.'; return; }

    const { data: { session } } = await client.auth.getSession();
    if (!session) { window.location.replace('/portal/login.html'); return; }

    try {
      const { error } = await client.from('quote_questions').insert({
        quote_id: quoteId,
        client_email: session.user.email,
        message,
      });
      if (error) throw error;
      textEl.value = '';
      textEl.style.display = 'none';
      successEl.style.display = 'block';
    } catch (e) {
      errorEl.textContent = "Couldn't send that. Please call or text us instead.";
    }
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.replace('/portal/login.html');
  });

  renderQuotes();
</script>

<!--

<button type="button" class="report-bug-link" id="reportBugLink">Report a problem</button>

<div class="report-bug-overlay" id="reportBugOverlay" style="display:none;">
  <div class="report-bug-modal">
    <div class="report-bug-title" id="reportBugTitle">Report a problem</div>
    <p class="report-bug-sub" id="reportBugSub">Tell us what happened. We'll take a look.</p>
    <div id="reportBugFormArea">
      <textarea id="reportBugMessage" placeholder="What went wrong?" rows="4"></textarea>
      <div class="report-bug-error" id="reportBugError"></div>
      <div class="report-bug-actions">
        <button class="btn secondary-btn" id="reportBugCancel" type="button">Cancel</button>
        <button class="btn orange" id="reportBugSubmit" type="button">Send</button>
      </div>
    </div>
    <div class="report-bug-success" id="reportBugSuccess" style="display:none;">Thanks, we got your report and will take a look.</div>
  </div>
</div>


<script>
  (function () {
    const link = document.getElementById('reportBugLink');
    const overlay = document.getElementById('reportBugOverlay');
    const cancelBtn = document.getElementById('reportBugCancel');
    const submitBtn = document.getElementById('reportBugSubmit');
    const messageInput = document.getElementById('reportBugMessage');
    const errorEl = document.getElementById('reportBugError');
    const formArea = document.getElementById('reportBugFormArea');
    const successEl = document.getElementById('reportBugSuccess');

    function openReportBug() {
      overlay.style.display = 'flex';
      formArea.style.display = 'block';
      successEl.style.display = 'none';
      messageInput.value = '';
      errorEl.textContent = '';
    }
    function closeReportBug() {
      overlay.style.display = 'none';
    }
    link.addEventListener('click', openReportBug);
    cancelBtn.addEventListener('click', closeReportBug);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeReportBug(); });

    submitBtn.addEventListener('click', async () => {
      const message = messageInput.value.trim();
      if (!message) { errorEl.textContent = 'Please describe the problem first.'; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      errorEl.textContent = '';
      let clientEmail = null;
      try {
        const { data } = await client.auth.getSession();
        clientEmail = data.session ? data.session.user.email : null;
      } catch (e) { /* not signed in, that's fine -- report goes in anonymous */ }
      try {
        const res = await fetch('https://csvfqdjuobylgafgolho.supabase.co/rest/v1/portal_bug_reports', {
          method: 'POST',
          headers: {
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            client_email: clientEmail,
            message: message,
            page_url: window.location.pathname,
            user_agent: navigator.userAgent,
          }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        formArea.style.display = 'none';
        successEl.style.display = 'block';
      } catch (e) {
        errorEl.textContent = "Couldn't send that. Please call us instead.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
      }
    });
  })();
</script>
