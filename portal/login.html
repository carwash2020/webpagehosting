<!DOCTYPE html>
<html lang="en" style="background:#0a0a0a;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="index, follow">
<title>Client Portal | Triple H Enterprises</title>
<meta name="description" content="Sign in to view and pay your Triple H Enterprises invoices online.">
<link rel="canonical" href="https://www.triplehenterprisesllc.biz/portal/login.html">
<!--
  Client Portal login (2026-08-31, rebuilt from magic-link to
  email+password the same day) -- a genuinely separate build from
  everything under /tools/. Deliberately does NOT load auth.js, sync.js,
  data-layer.js, or tools-nav-pwa.js -- all of those are built entirely
  around the internal team's login (account_roles, Owner/Developer/
  Employee, Dev Tools access) and none of it should exist on a page an
  external client can reach. Only the shared stylesheets are reused,
  for visual consistency with the rest of the brand -- no shared JS at
  all. Uses the official Supabase JS SDK for the same reason as
  before: correctly handles auth-related token parsing that isn't
  worth reimplementing by hand.

  Real design decision, not a small detail: there is no public "sign
  up" on this page at all. An account only ever gets created because
  Triple H Enterprises invoiced this client first (see send-invite
  edge function) -- a client can only ever sign in here or ask to
  reset a password they already have, never self-register.

  Indexable on purpose (2026-09-01), unlike dashboard.html and
  set-password.html, which both stay noindex: this page is just an
  empty email/password form with no client data anywhere on it, so
  there's no real exposure from letting it be found, and it's exactly
  what a client searching "Triple H client portal" or "Triple H login"
  is trying to reach. dashboard.html is meaningless without a real
  session regardless, and set-password.html is a one-time link flow,
  not something anyone should be navigating to directly from search.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://csvfqdjuobylgafgolho.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
<meta name="theme-color" content="#0a0a0a">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png?v=202608010300">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=202608010300">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=202608202000">
<link rel="stylesheet" href="/tools/styles-tools.css?v=a2e87effb3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-box { max-width: 380px; width: 100%; text-align: center; }
  .login-logo { width: 72px; height: auto; margin-bottom: 20px; }
  .login-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px; color: var(--white); margin-bottom: 6px; }
  .login-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }
  .login-field { margin-bottom: 16px; text-align: left; }
  .login-field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 5px; }
  .login-field input {
    width: 100%; padding: 11px 13px; background: var(--bg-panel-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--white); font-size: 15px; font-family: inherit; box-sizing: border-box;
  }
  .login-error { color: #e05252; font-size: 13.5px; margin: 4px 0 16px; min-height: 1px; }
  .login-success { color: #4caf78; font-size: 14px; margin: 4px 0 16px; line-height: 1.5; }
  .login-btn { width: 100%; justify-content: center; }
  .forgot-link { display: block; margin-top: 14px; font-size: 13px; color: var(--text-dim); text-decoration: none; cursor: pointer; }
  .forgot-link:hover { color: var(--orange-light); }
  .report-bug-link { display: block; margin-top: 14px; font-size: 12px; color: var(--text-dim); text-decoration: underline; cursor: pointer; text-align: center; background: none; border: none; font-family: inherit; padding: 0; }
  .report-bug-link:hover { color: var(--orange-light); }
  .report-bug-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
  .report-bug-modal { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 400px; width: 100%; }
  .report-bug-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 18px; color: var(--white); margin-bottom: 6px; }
  .report-bug-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }
  .report-bug-modal textarea { width: 100%; padding: 11px 13px; background: var(--bg-panel-2); border: 1px solid var(--border); border-radius: 8px; color: var(--white); font-size: 14px; font-family: inherit; box-sizing: border-box; resize: vertical; }
  .report-bug-error { color: #e05252; font-size: 13px; margin: 8px 0 0; min-height: 1px; }
  .report-bug-success { color: #4caf78; font-size: 14px; margin: 4px 0; line-height: 1.5; }
  .report-bug-actions { display: flex; gap: 10px; margin-top: 16px; }
  .report-bug-actions button { flex: 1; justify-content: center; }
</style>
</head>
<body>

<div class="login-box">
  <img src="/images/logo-signature-orange.webp?v=202608142300" alt="Triple H Enterprises" class="login-logo">
  <div class="login-title" id="pageTitle">Client Portal</div>
  <div class="login-sub" id="loginSub">Sign in to view and pay your invoices.</div>

  <form id="loginForm">
    <div class="login-field">
      <label for="clientEmail">Email</label>
      <input type="email" id="clientEmail" required autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="login-field" id="passwordField">
      <label for="clientPassword">Password</label>
      <input type="password" id="clientPassword" required autocomplete="current-password">
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="login-success" id="loginSuccess" style="display:none;"></div>
    <button type="submit" class="btn blue login-btn" id="loginSubmitBtn">Sign In</button>
    <a class="forgot-link" id="forgotLink">Forgot your password?</a>
  </form>
  <p style="font-size:12px; color:var(--text-dim); margin-top:20px;">By signing in you agree to Triple H Enterprises' <a href="/terms.html" style="color:var(--text-dim); text-decoration:underline;">Terms and Conditions</a>.</p>
  <button type="button" class="report-bug-link" id="reportBugLink">Report a problem</button>

<div class="report-bug-overlay" id="reportBugOverlay" style="display:none;">
  <div class="report-bug-modal">
    <div class="report-bug-title" id="reportBugTitle">Report a problem</div>
    <p class="report-bug-sub" id="reportBugSub">Tell us what happened. We'll take a look.</p>
    <div id="reportBugFormArea">
      <textarea id="reportBugMessage" placeholder="What went wrong?" rows="4"></textarea>
      <div class="report-bug-error" id="reportBugError"></div>
      <div class="report-bug-actions">
        <button class="btn secondary-btn" id="reportBugCancel" type="button">Cancel</button>
        <button class="btn orange" id="reportBugSubmit" type="button">Send</button>
      </div>
    </div>
    <div class="report-bug-success" id="reportBugSuccess" style="display:none;">Thanks, we got your report and will take a look.</div>
  </div>
</div>
</div>

<script>
  const { createClient } = supabase;
  const client = createClient(
    'https://csvfqdjuobylgafgolho.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs'
  );

  let forgotPasswordMode = false;

  client.auth.getSession().then(({ data }) => {
    if (data.session) window.location.replace('/portal/dashboard.html');
  });

  document.getElementById('forgotLink').addEventListener('click', () => {
    forgotPasswordMode = !forgotPasswordMode;
    const passwordInput = document.getElementById('clientPassword');
    document.getElementById('passwordField').style.display = forgotPasswordMode ? 'none' : 'block';
    // A hidden field that's still `required` silently blocks the
    // entire form submission via native HTML5 validation, before this
    // page's own JS ever runs -- confirmed via direct testing, not a
    // hypothetical edge case.
    passwordInput.required = !forgotPasswordMode;
    passwordInput.disabled = forgotPasswordMode;
    document.getElementById('loginSubmitBtn').textContent = forgotPasswordMode ? 'Send Reset Link' : 'Sign In';
    document.getElementById('forgotLink').textContent = forgotPasswordMode ? 'Back to sign in' : 'Forgot your password?';
    document.getElementById('loginError').textContent = '';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('clientEmail').value.trim();
    const errorEl = document.getElementById('loginError');
    const successEl = document.getElementById('loginSuccess');
    const btn = document.getElementById('loginSubmitBtn');
    errorEl.textContent = '';
    successEl.style.display = 'none';

    if (forgotPasswordMode) {
      btn.disabled = true;
      btn.textContent = 'Sending...';
      const { error } = await client.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/portal/set-password.html',
      });
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
      if (error) {
        errorEl.textContent = 'Something went wrong. ' + (error.message || 'Please try again.');
        return;
      }
      document.getElementById('loginForm').querySelectorAll('.login-field, #loginSubmitBtn, #forgotLink').forEach(el => el.style.display = 'none');
      successEl.textContent = `If an account exists for ${email}, a reset link is on its way. Check your email.`;
      successEl.style.display = 'block';
      return;
    }

    const password = document.getElementById('clientPassword').value;
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    const { error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      errorEl.textContent = 'Incorrect email or password.';
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }
    window.location.replace('/portal/dashboard.html');
  });
</script>

<script>
  (function () {
    const link = document.getElementById('reportBugLink');
    const overlay = document.getElementById('reportBugOverlay');
    const cancelBtn = document.getElementById('reportBugCancel');
    const submitBtn = document.getElementById('reportBugSubmit');
    const messageInput = document.getElementById('reportBugMessage');
    const errorEl = document.getElementById('reportBugError');
    const formArea = document.getElementById('reportBugFormArea');
    const successEl = document.getElementById('reportBugSuccess');

    function openReportBug() {
      overlay.style.display = 'flex';
      formArea.style.display = 'block';
      successEl.style.display = 'none';
      messageInput.value = '';
      errorEl.textContent = '';
    }
    function closeReportBug() {
      overlay.style.display = 'none';
    }
    link.addEventListener('click', openReportBug);
    cancelBtn.addEventListener('click', closeReportBug);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeReportBug(); });

    submitBtn.addEventListener('click', async () => {
      const message = messageInput.value.trim();
      if (!message) { errorEl.textContent = 'Please describe the problem first.'; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      errorEl.textContent = '';
      let clientEmail = null;
      try {
        const { data } = await client.auth.getSession();
        clientEmail = data.session ? data.session.user.email : null;
      } catch (e) { /* not signed in, that's fine -- report goes in anonymous */ }
      try {
        const res = await fetch('https://csvfqdjuobylgafgolho.supabase.co/rest/v1/portal_bug_reports', {
          method: 'POST',
          headers: {
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            client_email: clientEmail,
            message: message,
            page_url: window.location.pathname,
            user_agent: navigator.userAgent,
          }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        formArea.style.display = 'none';
        successEl.style.display = 'block';
      } catch (e) {
        errorEl.textContent = "Couldn't send that. Please call us instead.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
      }
    });
  })();
</script>
</body>
</html>
