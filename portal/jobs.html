  Client Portal jobs page (2026-09-02), phase 4 of the full
  client-hub roadmap in docs/CLIENT-PORTAL.md. Same isolation as
  dashboard.html/quotes.html/login.html: no internal /tools/ scripts
  loaded at all, only shared stylesheets for visual consistency.
  Every job shown here comes from client_portal_jobs, whose RLS policy
  guarantees a signed-in client can only ever receive rows matching
  their own authenticated email.

  Warranty status is computed HERE, client-side, from job_date --
  never stored or fetched as a precomputed value. This is the exact
  same 30-day-from-completion-date rule tools/job-tracker.html's own
  warrantyBadgeHtml() already uses; duplicating the FORMULA (not the
  data) keeps this page from ever showing a stale warranty status that
  drifted from a stored value nobody updated.
-->

<!-- color-scheme (2026-09-02): tells the browser to use a DARK default

     own white default first, which showed as a white flash on every
     navigation between portal pages. The inline background on <html>
     below is not enough on its own -- that only applies once the HTML
     starts parsing, which is already too late. -->

  // app-shell caching and push notification support. Registered on
  // every portal page (including login/set-password, matching the
  // manifest link's own consistent presence on every page) since

<style>
  /* Cross-document view transitions (2026-09-04), requested directly
     after a real reported bug: "when switching between pages it
     still sometimes has a white flash." The <html style="background">
     inline fix and theme-color/color-scheme meta tags already in
     place solve the CSS-level flash-of-white-before-styles-load
     problem -- but this is a multi-page app (every portal page is a
     separate document), and "sometimes" points at something more
     fundamental: on a slower connection, the browser shows its own
     blank interstitial while waiting for the next page's bytes to
     arrive, before ANY of that CSS has even been parsed yet. This is
     the real, current web-platform fix for exactly that: opting
     into cross-document view transitions keeps the OLD page's
     visual snapshot on screen, cross-fading to the new one once
     it's ready, instead of a blank gap in between. Supported in
     Chrome/Edge 126+ and Safari 18.2+ (both well-established by
     now); browsers without support just navigate exactly as before
     -- this is pure progressive enhancement, never a requirement.
     Both the origin and destination page must opt in for a
     transition between them to happen at all, so this needs adding
     to every portal page, not just one. */
  @view-transition {
    navigation: auto;
  }
</style>

<style>
  body { background: #0a0a0a; max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  /* Widened for real desktop screens (2026-09-03), reported directly
     from actual desktop screenshots: "not good on desk top, doesnt
     even take up the full screen." 640px was chosen for mobile, where
     it effectively IS full-width -- but on a real monitor it left a
     narrow, centered column with a huge, obviously unintentional-
     looking gap on both sides. 900px is comfortable for a
     dashboard-style layout with cards and forms (unlike a plain
     text article, which reads worse past ~700-800px, form inputs and
     card grids use the extra width naturally rather than just
     stretching prose into overly long lines) without going fully
     edge-to-edge on today's larger screens, which would look just as
     unintentional in the other direction. The 860px breakpoint keeps
     tablets in portrait orientation on the mobile-tuned layout, since
     900px there would be wider than the viewport itself. */
  @media (min-width: 860px) {
    body { max-width: 900px; }
  }
  .portal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  /* min-width:0 (2026-09-02, from a direct screenshot): a flex child
     defaults to min-width:auto, which means it will NEVER shrink
     below its content's natural width -- so a long email address just
     overflowed straight through the settings/sign-out buttons next to
     it rather than truncating. min-width:0 lets it actually shrink,
     and .portal-sub below does the truncating. */
  .portal-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .portal-header-left > div { min-width: 0; }
  .portal-header img { width: 40px; height: auto; }
  .portal-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 19px; color: var(--white); }
  .portal-sub {
    color: var(--text-dim); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .portal-header-actions { display: flex; gap: 8px; align-items: center; }
  .portal-icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-panel-2); color: var(--text-dim); text-decoration: none; cursor: pointer;

  .portal-icon-btn:hover { border-color: var(--orange); color: var(--orange-light); }
  .portal-icon-btn svg { width: 18px; height: 18px; }
  /* Fixed 2026-09-02, from a direct screenshot: with flex-wrap and
     flex:1 on 5 items, the 5th item (Jobs) couldn't fit on the first
     row at real phone widths, wrapped alone onto a second row, and
     then stretched to fill the FULL width by itself (a lone flex:1
     item on its own row always does) -- a huge, orphaned pill that
     looked broken rather than intentional.
     A CSS grid with exactly 5 equal columns never has this failure
     mode: every item is always on one row, at whatever width 1/5 of
     the container comes out to, right down to genuinely tiny phones.
     Narrower labels wrap to two lines inside their own cell instead
     of the layout itself breaking. */
  .portal-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 24px; }
  .portal-nav a {
    text-align: center; padding: 9px 6px; border-radius: 8px; font-size: 12.5px; font-weight: 600; line-height: 1.25;

    text-decoration: none; padding: 6px 12px; border: 1px solid var(--orange-tint-border); border-radius: 8px; background: var(--orange-tint-soft);

<script>
  const { createClient } = supabase;
  // Named as constants (2026-09-04) -- same fix as portal/quotes.html:
  // previously only ever existed as raw literal strings inline in
  // createClient() below. Needed now that the shared
  // fetchBookingsForDate() (business-hours.js) takes these explicitly
  // as parameters rather than assuming they exist as globals.
  const SUPABASE_URL = 'https://csvfqdjuobylgafgolho.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs';
  const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // The exact same formula as tools/job-tracker.html's own
  // templateDueInfo() -- computed fresh every render from
  // interval_months/last_created_date, never stored, so this can
  // never show a stale due status that drifted from a stored value
  // nobody updated. See portal/jobs.html's own warrantyBadgeHtml()
  // above for the same reasoning applied to warranty status.
  function checkupDueInfo(c) {
    if (!c.last_created_date) return { isDue: true, label: 'Due now' };
    const last = new Date(c.last_created_date + 'T00:00:00');
    const next = new Date(last);
    next.setMonth(next.getMonth() + (c.interval_months || 1));
    const today = new Date(new Date().toDateString());
    if (next <= today) return { isDue: true, label: 'Due now' };
    const days = Math.round((next - today) / (24 * 60 * 60 * 1000));
    return { isDue: false, label: 'Next due in ' + days + ' day' + (days === 1 ? '' : 's') };
  }

  function renderCheckupBanner(c) {
    const due = checkupDueInfo(c);
    return `
      <div class="checkup-banner ${due.isDue ? '' : 'is-not-due'}">
        <div style="width:100%;">
          <div class="checkup-title">${escapeHtml(c.title)}</div>
          <div class="checkup-due-label">${escapeHtml(due.label)}</div>
          ${due.isDue ? `
            <button type="button" class="schedule-toggle" onclick="toggleCheckupSchedule(${c.id})">Schedule this visit</button>
            <div class="schedule-panel" id="checkupSchedulePanel-${c.id}">
              <div class="date-row" id="checkupDateRow-${c.id}"></div>
              <div class="slots-grid" id="checkupSlotsGrid-${c.id}"></div>
              <div class="slots-empty" id="checkupSlotsEmpty-${c.id}" style="display:none;">No open times that day. Try another.</div>
              <div class="schedule-summary" id="checkupScheduleSummary-${c.id}" style="display:none;"></div>
              <div class="schedule-error" id="checkupScheduleError-${c.id}"></div>
              <button class="btn blue" style="width:100%; justify-content:center; margin-top:8px; display:none;" id="checkupScheduleConfirmBtn-${c.id}" onclick="confirmCheckupSchedule(${c.id})">Confirm this time</button>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }

  async function renderCheckups() {
    const { data: checkups, error } = await client
      .from('client_portal_checkups')
      .select('*');
    const listEl = document.getElementById('checkupList');
    if (error || !checkups || !checkups.length) {
      listEl.innerHTML = '';
      return;
    }
    listEl.innerHTML =
      '<div class="checkup-note">Suggested based on your service history.</div>' +
      checkups.map(renderCheckupBanner).join('');
  }

  // ---------- scheduling from a check-up reminder ----------
  // SLOT_INCREMENT_MINUTES, MIN_LEAD_HOURS, SCHEDULE_BUFFER_MINUTES,
  // overlaps(), fetchBookingsForDate(), and computeSlotsForDate() come
  // from the shared /business-hours.js (2026-09-04) -- found during a
  // full portal audit still locally redeclared here as a FOURTH
  // independent copy, on top of booking.html and portal/quotes.html's
  // own (already-fixed) copies. This one was a genuinely serious bug,
  // not just drift risk: this page loads business-hours.js via a real
  // <script src>, which already declares these same const names at
  // the top level -- classic (non-module) <script> tags on one page
  // share a single lexical environment for top-level const/let, so
  // redeclaring the same name in a second script tag is a real
  // SyntaxError ("Identifier has already been declared"), not merely
  // a silent shadow. That would have broken this entire inline
  // script block, and everything on this page depending on it, the
  // moment a client loaded this page for real.
  //
  // No specific service tied to a check-up reminder (unlike a quote,
  // which at least has a job description) -- 120 minutes matches the
  // same generic default used for quote-scheduled jobs.
  const DEFAULT_VISIT_MINUTES = 120;

  function toggleCheckupSchedule(checkupId) {
    const panel = document.getElementById('checkupSchedulePanel-' + checkupId);
    if (!panel) return;
    const opening = !panel.classList.contains('is-open');
    panel.classList.toggle('is-open');
    if (opening) renderCheckupDateRow(checkupId);
  }

  function renderCheckupDateRow(checkupId) {
    const el = document.getElementById('checkupDateRow-' + checkupId);
    if (!el) return;
    const today = todayDateStrInBusinessTz();
    let html = '';
    for (let i = 0; i < DAYS_AHEAD_SHOWN; i++) {
      const dateStr = addDaysToDateStr(today, i);
      const noonUtc = zonedTimeToUtc(dateStr, 12, 0);
      const dow = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, weekday: 'short' }).format(noonUtc);
      const dom = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, day: 'numeric' }).format(noonUtc);
      html += '<button type="button" class="date-btn" data-date="' + dateStr + '"><div class="dow">' + dow + '</div><div class="dom">' + dom + '</div></button>';
    }
    el.innerHTML = html;
    el.querySelectorAll('.date-btn').forEach(btn => {
      btn.addEventListener('click', () => selectCheckupDate(checkupId, btn.dataset.date));
    });
  }

  let selectedCheckupSlot = null;

  async function selectCheckupDate(checkupId, dateStr) {
    document.querySelectorAll('#checkupDateRow-' + checkupId + ' .date-btn').forEach(b => {
      b.classList.toggle('is-selected', b.dataset.date === dateStr);
    });
    const grid = document.getElementById('checkupSlotsGrid-' + checkupId);
    const emptyEl = document.getElementById('checkupSlotsEmpty-' + checkupId);
    const summaryEl = document.getElementById('checkupScheduleSummary-' + checkupId);
    const confirmBtn = document.getElementById('checkupScheduleConfirmBtn-' + checkupId);
    selectedCheckupSlot = null;
    summaryEl.style.display = 'none';
    confirmBtn.style.display = 'none';
    grid.innerHTML = '<p style="color:var(--text-dim); font-size:13px;">Loading times...</p>';
    emptyEl.style.display = 'none';

    let bookings;
    try {
      bookings = await fetchBookingsForDate(SUPABASE_URL, SUPABASE_ANON_KEY, dateStr);
    } catch (e) {
      grid.innerHTML = '<p style="color:#ff8a80; font-size:13px; grid-column:1/-1;">Couldn\'t load available times. Try again.</p>';
      return;
    }
    const slots = computeSlotsForDate(dateStr, DEFAULT_VISIT_MINUTES, bookings);
    if (!slots.length) {
      grid.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    grid.innerHTML = slots.map((s, i) => '<button type="button" class="slot-btn" data-idx="' + i + '">' + s.label + '</button>').join('');
    grid.querySelectorAll('.slot-btn').forEach((btn, i) => {
      btn.addEventListener('click', () => {
        selectedCheckupSlot = slots[i];
        grid.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('is-selected'));
        btn.classList.add('is-selected');
        const dateLabel = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, weekday: 'long', month: 'long', day: 'numeric' }).format(slots[i].startUtc);
        summaryEl.textContent = dateLabel + ' at ' + slots[i].label;
        summaryEl.style.display = 'block';
        confirmBtn.style.display = 'block';
        document.getElementById('checkupScheduleError-' + checkupId).textContent = '';
      });
    });
  }

  function formatDate(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  // The exact same formula as tools/job-tracker.html's
  // warrantyBadgeHtml() -- 30 days from job_date, computed fresh every
  // render rather than stored, so it's never stale.
  // Warranty overview (2026-09-03), requested directly: "Warranty
  // overview" -- extracted from warrantyBadgeHtml's own inline math
  // so both the per-job badge and the new summary compute the exact
  // same number the exact same way, rather than two copies that could
  // drift.
  function warrantyDaysLeft(jobDate) {
    const completionDate = new Date(jobDate + 'T00:00:00');
    if (isNaN(completionDate.getTime())) return null;
    const today = new Date(new Date().toDateString());
    const daysSince = Math.round((today - completionDate) / (24 * 60 * 60 * 1000));
    const daysLeft = 30 - daysSince;
    return daysLeft;
  }

  function warrantyBadgeHtml(jobDate) {
    const daysLeft = warrantyDaysLeft(jobDate);
    if (daysLeft === null) return '';
    if (daysLeft >= 0) {
      return `<span class="job-warranty is-active" title="30-day labor warranty, based on this job's date">Warranty: ${daysLeft} day${daysLeft === 1 ? '' : 's'} left</span>`;
    }
    return `<span class="job-warranty is-expired" title="30-day labor warranty, based on this job's date">Warranty expired</span>`;
  }

  // Sourced from the SAME jobs array renderJobs() already fetched --
  // no separate query needed just to compute a summary of data
  // already in hand.
  function renderWarrantyOverview(jobs) {
    const el = document.getElementById('warrantyOverview');
    const covered = jobs
      .map(j => ({ job: j, daysLeft: warrantyDaysLeft(j.job_date) }))
      .filter(x => x.daysLeft !== null && x.daysLeft >= 0)
      .sort((a, b) => a.daysLeft - b.daysLeft);

    if (!covered.length) { el.innerHTML = ''; return; }

    el.innerHTML =
      '<div class="warranty-overview">' +
      '<div class="warranty-overview-title">' + covered.length + ' job' + (covered.length === 1 ? '' : 's') + ' still under warranty</div>' +
      covered.map(x =>
        '<div class="warranty-overview-row"><span>' + escapeHtml(x.job.title) + '</span>' +
        '<span class="warranty-overview-days">' + x.daysLeft + ' day' + (x.daysLeft === 1 ? '' : 's') + ' left</span></div>'
      ).join('') +
      '</div>';
  }

  function renderJobCard(j) {
    const hasPhotos = Array.isArray(j.photo_storage_paths) && j.photo_storage_paths.length > 0;
    return `
      <div class="job-card">
        <div class="job-card-top">
          <div>
            <div class="job-title">${escapeHtml(j.title)}</div>
            <div class="job-date">${formatDate(j.job_date)}</div>
          </div>
          ${warrantyBadgeHtml(j.job_date)}
        </div>
        ${j.linked_invoice_number ? `<a class="job-receipt-link" href="/portal/dashboard.html?invoice=${encodeURIComponent(j.linked_invoice_number)}">View Receipt</a>` : ''}
        ${hasPhotos ? `<div class="job-photos" id="jobPhotos-${j.id}"><p style="color:var(--text-dim); font-size:12px;">Loading photos...</p></div>` : ''}
      </div>
    `;
  }

  // Photos load AFTER the cards render, one call per job that actually
  // has any -- get_job_photo_urls signs each path fresh (they expire),
  // and does its own ownership check server-side, so this never trusts
  // a stored public URL or signs anything with the client's own token.
  // See get-job-photo-urls and sql/portal/add_job_photo_paths_column.sql
  // for why that matters (the job-photos bucket's own RLS is looser
  // than it should be for a client to sign its own paths directly).
  async function loadJobPhotos(jobId) {
    const container = document.getElementById('jobPhotos-' + jobId);
    if (!container) return;
    const { data: { session } } = await client.auth.getSession();
    if (!session) return;
    try {
      const res = await fetch(
        'https://csvfqdjuobylgafgolho.supabase.co/functions/v1/get-job-photo-urls',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Authorization': `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({ job_id: jobId }),
        }
      );
      const result = await res.json();
      if (!result.ok || !result.urls.length) { container.innerHTML = ''; return; }
      container.innerHTML = result.urls.map(url =>
        `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="Job photo" loading="lazy"></a>`
      ).join('');
    } catch (e) {
      container.innerHTML = '';
    }
  }

  async function renderJobs() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.replace('/portal/login.html');
      return;
    }
    document.getElementById('clientEmailDisplay').textContent = session.user.email;

    // Shown immediately, before the fetch (2026-09-03) -- same
    // reasoning as quotes.html's identical fix, found the same pass:
    // without this, a client on a slow connection sees a blank area
    // indistinguishable from "no jobs on file."
    const listEl = document.getElementById('jobList');
    listEl.innerHTML = '<div class="empty-state">Loading...</div>';

    const { data: jobs, error } = await client
      .from('client_portal_jobs')
      .select('*')
      .order('job_date', { ascending: false });

    if (error) {
      listEl.innerHTML = `<div class="empty-state">Couldn't load your job history right now. Please try again in a moment.</div>`;
      console.error(error);
      return;
    }
    if (!jobs.length) {
      listEl.innerHTML = `<div class="empty-state">No completed jobs on file yet.</div>`;
      return;
    }
    renderWarrantyOverview(jobs);
    listEl.innerHTML = jobs.map(renderJobCard).join('');
    jobs.forEach(j => {
      if (Array.isArray(j.photo_storage_paths) && j.photo_storage_paths.length) loadJobPhotos(j.id);
    });
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.replace('/portal/login.html');
  });

  renderJobs().then(renderCheckups);
</script>

<!--
  Report a problem (2026-09-02) -- extended from dashboard.html, the
  only page that originally had it, to every signed-in portal page.
  Works whether or not the client is signed in (client_email is best-
  effort, from the current session if one exists) since a real problem
  can happen on any page, not just Invoices.
-->
<button type="button" class="report-bug-link" id="reportBugLink">Report a problem</button>

<div class="report-bug-overlay" id="reportBugOverlay" style="display:none;">
  <div class="report-bug-modal">
    <div class="report-bug-title" id="reportBugTitle">Report a problem</div>
    <p class="report-bug-sub" id="reportBugSub">Tell us what happened. We'll take a look.</p>
    <div id="reportBugFormArea">
      <textarea id="reportBugMessage" placeholder="What went wrong?" rows="4"></textarea>
      <div class="report-bug-error" id="reportBugError"></div>
      <div class="report-bug-actions">
        <button class="btn secondary-btn" id="reportBugCancel" type="button">Cancel</button>
        <button class="btn orange" id="reportBugSubmit" type="button">Send</button>
      </div>
    </div>
    <div class="report-bug-success" id="reportBugSuccess" style="display:none;">Thanks, we got your report and will take a look.</div>
  </div>
</div>


<script>
  (function () {
    const link = document.getElementById('reportBugLink');
    const overlay = document.getElementById('reportBugOverlay');
    const cancelBtn = document.getElementById('reportBugCancel');
    const submitBtn = document.getElementById('reportBugSubmit');
    const messageInput = document.getElementById('reportBugMessage');
    const errorEl = document.getElementById('reportBugError');
    const formArea = document.getElementById('reportBugFormArea');
    const successEl = document.getElementById('reportBugSuccess');

    function openReportBug() {
      overlay.style.display = 'flex';
      formArea.style.display = 'block';
      successEl.style.display = 'none';
      messageInput.value = '';
      errorEl.textContent = '';
    }
    function closeReportBug() {
      overlay.style.display = 'none';
    }
    link.addEventListener('click', openReportBug);
    cancelBtn.addEventListener('click', closeReportBug);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeReportBug(); });

    submitBtn.addEventListener('click', async () => {
      const message = messageInput.value.trim();
      if (!message) { errorEl.textContent = 'Please describe the problem first.'; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      errorEl.textContent = '';
      let clientEmail = null;
      try {
        const { data } = await client.auth.getSession();
        clientEmail = data.session ? data.session.user.email : null;
      } catch (e) { /* not signed in, that's fine -- report goes in anonymous */ }
      try {
        const res = await fetch('https://csvfqdjuobylgafgolho.supabase.co/rest/v1/portal_bug_reports', {
          method: 'POST',
          headers: {
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            client_email: clientEmail,
            message: message,
            page_url: window.location.pathname,
            user_agent: navigator.userAgent,
          }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        formArea.style.display = 'none';
        successEl.style.display = 'block';
      } catch (e) {
        errorEl.textContent = "Couldn't send that. Please call us instead.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
      }
    });
  })();
</script>
