<script>
  const { createClient } = supabase;
  const client = createClient(

  // The exact same formula as tools/job-tracker.html's own
  // templateDueInfo() -- computed fresh every render from
  // interval_months/last_created_date, never stored, so this can
  // never show a stale due status that drifted from a stored value
  // nobody updated. See portal/jobs.html's own warrantyBadgeHtml()
  // above for the same reasoning applied to warranty status.
  function checkupDueInfo(c) {
    if (!c.last_created_date) return { isDue: true, label: 'Due now' };
    const last = new Date(c.last_created_date + 'T00:00:00');
    const next = new Date(last);
    next.setMonth(next.getMonth() + (c.interval_months || 1));
    const today = new Date(new Date().toDateString());
    if (next <= today) return { isDue: true, label: 'Due now' };
    const days = Math.round((next - today) / (24 * 60 * 60 * 1000));
    return { isDue: false, label: 'Next due in ' + days + ' day' + (days === 1 ? '' : 's') };
  }

  function renderCheckupBanner(c) {
    const due = checkupDueInfo(c);
    return `
      <div class="checkup-banner ${due.isDue ? '' : 'is-not-due'}">
        <div style="width:100%;">
          <div class="checkup-title">${escapeHtml(c.title)}</div>

          ${due.isDue ? `

            <div class="schedule-panel" id="checkupSchedulePanel-${c.id}">

              <div class="slots-empty" id="checkupSlotsEmpty-${c.id}" style="display:none;">No open times that day. Try another.</div>
              <div class="schedule-summary" id="checkupScheduleSummary-${c.id}" style="display:none;"></div>
              <div class="schedule-error" id="checkupScheduleError-${c.id}"></div>
              <button class="btn blue" style="width:100%; justify-content:center; margin-top:8px; display:none;" id="checkupScheduleConfirmBtn-${c.id}" onclick="confirmCheckupSchedule(${c.id})">Confirm this time</button>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }

  async function renderCheckups() {
    const { data: checkups, error } = await client
      .from('client_portal_checkups')
      .select('*');
    const listEl = document.getElementById('checkupList');
    if (error || !checkups || !checkups.length) {
      listEl.innerHTML = '';
      return;
    }
    listEl.innerHTML =
      '<div class="checkup-note">Suggested based on your service history.</div>' +
      checkups.map(renderCheckupBanner).join('');
  }

  // ---------- scheduling from a check-up reminder ----------
  // Same timezone/business-hours logic as portal/quotes.html's own
  // scheduling flow, copied verbatim rather than shared -- neither
  // page loads the internal scripts, and booking.html (the original
  // source of this logic) has no shared module of its own either.
  // Kept in sync manually if business hours or timezone ever change.
  const BUSINESS_TIMEZONE = 'America/Denver';
  const HOURS_BY_WEEKDAY = { 0: [14, 20], 1: [14, 22], 2: [14, 22], 3: [14, 22], 4: [14, 22], 5: [14, 22], 6: [7, 22] };
  const SLOT_INCREMENT_MINUTES = 30;
  const MIN_LEAD_HOURS = 2;
  const DAYS_AHEAD_SHOWN = 14;
  const SCHEDULE_BUFFER_MINUTES = 15;
  // No specific service tied to a check-up reminder (unlike a quote,
  // which at least has a job description) -- 120 minutes matches the
  // same generic default used for quote-scheduled jobs.
  const DEFAULT_VISIT_MINUTES = 120;

  function zonedTimeToUtc(dateStr, hh, mm) {
    const timeStr = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    const naiveUtc = new Date(dateStr + 'T' + timeStr + ':00Z');
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: BUSINESS_TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    }).formatToParts(naiveUtc);
    const map = {};
    parts.forEach(p => { map[p.type] = p.value; });
    const hourFixed = map.hour === '24' ? '00' : map.hour;
    const asIfLocal = new Date(map.year + '-' + map.month + '-' + map.day + 'T' + hourFixed + ':' + map.minute + ':' + map.second + 'Z');
    const diff = naiveUtc.getTime() - asIfLocal.getTime();
    return new Date(naiveUtc.getTime() + diff);
  }
  function businessWeekday(dateStr) {
    const noonUtc = zonedTimeToUtc(dateStr, 12, 0);
    const s = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, weekday: 'short' }).format(noonUtc);
    return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(s);
  }
  function todayDateStrInBusinessTz() {
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    const map = {};
    parts.forEach(p => { map[p.type] = p.value; });
    return map.year + '-' + map.month + '-' + map.day;
  }
  function addDaysToDateStr(dateStr, days) {
    const d = new Date(dateStr + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }
  function overlaps(aStart, aEnd, bStart, bEnd) {
    return aStart < bEnd && bStart < aEnd;
  }

  function toggleCheckupSchedule(checkupId) {
    const panel = document.getElementById('checkupSchedulePanel-' + checkupId);
    if (!panel) return;
    const opening = !panel.classList.contains('is-open');
    panel.classList.toggle('is-open');
    if (opening) renderCheckupDateRow(checkupId);
  }

  function renderCheckupDateRow(checkupId) {
    const el = document.getElementById('checkupDateRow-' + checkupId);
    if (!el) return;
    const today = todayDateStrInBusinessTz();
    let html = '';
    for (let i = 0; i < DAYS_AHEAD_SHOWN; i++) {
      const dateStr = addDaysToDateStr(today, i);
      const noonUtc = zonedTimeToUtc(dateStr, 12, 0);
      const dow = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, weekday: 'short' }).format(noonUtc);
      const dom = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, day: 'numeric' }).format(noonUtc);
      html += '<button type="button" class="date-btn" data-date="' + dateStr + '"><div class="dow">' + dow + '</div><div class="dom">' + dom + '</div></button>';
    }
    el.innerHTML = html;
    el.querySelectorAll('.date-btn').forEach(btn => {
      btn.addEventListener('click', () => selectCheckupDate(checkupId, btn.dataset.date));
    });
  }

  async function fetchBookingsForDate(dateStr) {
    const dayStartUtc = zonedTimeToUtc(dateStr, 0, 0);
    const rangeStart = new Date(dayStartUtc.getTime() - 24 * 60 * 60 * 1000).toISOString();
    const rangeEnd = new Date(dayStartUtc.getTime() + 2 * 24 * 60 * 60 * 1000).toISOString();
    const res = await fetch('https://csvfqdjuobylgafgolho.supabase.co/rest/v1/rpc/get_booking_availability', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
        Authorization: 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
      },
      body: JSON.stringify({ p_range_start: rangeStart, p_range_end: rangeEnd }),
    });
    if (!res.ok) throw new Error('availability check failed (HTTP ' + res.status + ')');
    const rows = await res.json();
    return rows.map(r => ({ start: new Date(r.start_at), end: new Date(r.end_at) }));
  }

  function computeCheckupSlots(dateStr, bookings) {
    const weekday = businessWeekday(dateStr);
    const hours = HOURS_BY_WEEKDAY[weekday];
    if (!hours) return [];
    const openHour = hours[0], closeHour = hours[1];
    const earliestAllowed = new Date(Date.now() + MIN_LEAD_HOURS * 60 * 60 * 1000);
    const bufferMs = SCHEDULE_BUFFER_MINUTES * 60000;

    const slots = [];
    for (let mins = openHour * 60; mins + DEFAULT_VISIT_MINUTES <= closeHour * 60; mins += SLOT_INCREMENT_MINUTES) {
      const hh = Math.floor(mins / 60), mm = mins % 60;
      const startUtc = zonedTimeToUtc(dateStr, hh, mm);
      const endUtc = new Date(startUtc.getTime() + DEFAULT_VISIT_MINUTES * 60000);
      if (startUtc < earliestAllowed) continue;
      const conflict = bookings.some(b => overlaps(startUtc, endUtc, new Date(b.start.getTime() - bufferMs), new Date(b.end.getTime() + bufferMs)));
      if (conflict) continue;
      const label = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, hour: 'numeric', minute: '2-digit' }).format(startUtc);
      slots.push({ startUtc, endUtc, label });
    }
    return slots;
  }

  let selectedCheckupSlot = null;

  async function selectCheckupDate(checkupId, dateStr) {
    document.querySelectorAll('#checkupDateRow-' + checkupId + ' .date-btn').forEach(b => {
      b.classList.toggle('is-selected', b.dataset.date === dateStr);
    });
    const grid = document.getElementById('checkupSlotsGrid-' + checkupId);
    const emptyEl = document.getElementById('checkupSlotsEmpty-' + checkupId);
    const summaryEl = document.getElementById('checkupScheduleSummary-' + checkupId);
    const confirmBtn = document.getElementById('checkupScheduleConfirmBtn-' + checkupId);
    selectedCheckupSlot = null;
    summaryEl.style.display = 'none';
    confirmBtn.style.display = 'none';
    grid.innerHTML = '<p style="color:var(--text-dim); font-size:13px;">Loading times...</p>';
    emptyEl.style.display = 'none';

    let bookings;
    try {
      bookings = await fetchBookingsForDate(dateStr);
    } catch (e) {
      grid.innerHTML = '<p style="color:#ff8a80; font-size:13px; grid-column:1/-1;">Couldn\'t load available times. Try again.</p>';
      return;
    }
    const slots = computeCheckupSlots(dateStr, bookings);
    if (!slots.length) {
      grid.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    grid.innerHTML = slots.map((s, i) => '<button type="button" class="slot-btn" data-idx="' + i + '">' + s.label + '</button>').join('');
    grid.querySelectorAll('.slot-btn').forEach((btn, i) => {
      btn.addEventListener('click', () => {
        selectedCheckupSlot = slots[i];
        grid.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('is-selected'));
        btn.classList.add('is-selected');
        const dateLabel = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, weekday: 'long', month: 'long', day: 'numeric' }).format(slots[i].startUtc);
        summaryEl.textContent = dateLabel + ' at ' + slots[i].label;
        summaryEl.style.display = 'block';
        confirmBtn.style.display = 'block';
        document.getElementById('checkupScheduleError-' + checkupId).textContent = '';
      });
    });
  }

  async function confirmCheckupSchedule(checkupId) {
    if (!selectedCheckupSlot) return;
    const { data: { session } } = await client.auth.getSession();
    if (!session) { window.location.replace('/portal/login.html'); return; }

    const errorEl = document.getElementById('checkupScheduleError-' + checkupId);
    const confirmBtn = document.getElementById('checkupScheduleConfirmBtn-' + checkupId);
    errorEl.textContent = '';
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Scheduling...';

    try {
      const res = await fetch(
        'https://csvfqdjuobylgafgolho.supabase.co/functions/v1/schedule-checkup-visit',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Authorization': `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({
            checkup_id: checkupId,
            start_at: selectedCheckupSlot.startUtc.toISOString(),
            end_at: selectedCheckupSlot.endUtc.toISOString(),
          }),
        }
      );
      const result = await res.json();
      if (!result.ok) {
        errorEl.textContent = result.error || 'Something went wrong. Please try again.';
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Confirm this time';
        return;
      }
      const panel = document.getElementById('checkupSchedulePanel-' + checkupId);
      panel.innerHTML = '<div class="checkup-due-label" style="color:#4caf78;">Requested. We\'ll confirm shortly.</div>';
    } catch (e) {
      errorEl.textContent = "Couldn't reach the server. Please check your connection and try again.";
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Confirm this time';
    }
  }

  function formatDate(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  // The exact same formula as tools/job-tracker.html's
  // warrantyBadgeHtml() -- 30 days from job_date, computed fresh every
  // render rather than stored, so it's never stale.
  function warrantyBadgeHtml(jobDate) {
    const completionDate = new Date(jobDate + 'T00:00:00');
    if (isNaN(completionDate.getTime())) return '';
    const today = new Date(new Date().toDateString());
    const daysSince = Math.round((today - completionDate) / (24 * 60 * 60 * 1000));
    const daysLeft = 30 - daysSince;
    if (daysLeft >= 0) {
      return `<span class="job-warranty is-active" title="30-day labor warranty, based on this job's date">Warranty: ${daysLeft} day${daysLeft === 1 ? '' : 's'} left</span>`;
    }
    return `<span class="job-warranty is-expired" title="30-day labor warranty, based on this job's date">Warranty expired</span>`;
  }

  function renderJobCard(j) {
    const hasPhotos = Array.isArray(j.photo_storage_paths) && j.photo_storage_paths.length > 0;
    return `
      <div class="job-card">
        <div class="job-card-top">
          <div>
            <div class="job-title">${escapeHtml(j.title)}</div>
            <div class="job-date">${formatDate(j.job_date)}</div>
          </div>
          ${warrantyBadgeHtml(j.job_date)}
        </div>
        ${hasPhotos ? `<div class="job-photos" id="jobPhotos-${j.id}"><p style="color:var(--text-dim); font-size:12px;">Loading photos...</p></div>` : ''}
      </div>
    `;
  }

  // Photos load AFTER the cards render, one call per job that actually
  // has any -- get_job_photo_urls signs each path fresh (they expire),
  // and does its own ownership check server-side, so this never trusts
  // a stored public URL or signs anything with the client's own token.
  // See get-job-photo-urls and sql/portal/add_job_photo_paths_column.sql
  // for why that matters (the job-photos bucket's own RLS is looser
  // than it should be for a client to sign its own paths directly).
  async function loadJobPhotos(jobId) {
    const container = document.getElementById('jobPhotos-' + jobId);
    if (!container) return;
    const { data: { session } } = await client.auth.getSession();
    if (!session) return;
    try {
      const res = await fetch(
        'https://csvfqdjuobylgafgolho.supabase.co/functions/v1/get-job-photo-urls',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Authorization': `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({ job_id: jobId }),
        }
      );
      const result = await res.json();
      if (!result.ok || !result.urls.length) { container.innerHTML = ''; return; }
      container.innerHTML = result.urls.map(url =>
        `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="Job photo" loading="lazy"></a>`
      ).join('');
    } catch (e) {
      container.innerHTML = '';
    }
  }

  async function renderJobs() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.replace('/portal/login.html');
      return;
    }
    document.getElementById('clientEmailDisplay').textContent = session.user.email;

    const { data: jobs, error } = await client
      .from('client_portal_jobs')
      .select('*')
      .order('job_date', { ascending: false });

    const listEl = document.getElementById('jobList');
    if (error) {
      listEl.innerHTML = `<div class="empty-state">Couldn't load your job history right now. Please try again in a moment.</div>`;
      console.error(error);
      return;
    }
    if (!jobs.length) {
      listEl.innerHTML = `<div class="empty-state">No completed jobs on file yet.</div>`;
      return;
    }
    listEl.innerHTML = jobs.map(renderJobCard).join('');
    jobs.forEach(j => {
      if (Array.isArray(j.photo_storage_paths) && j.photo_storage_paths.length) loadJobPhotos(j.id);
    });
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.replace('/portal/login.html');
  });

  renderJobs().then(renderCheckups);
</script>

<!--
  Report a problem (2026-09-02) -- extended from dashboard.html, the
  only page that originally had it, to every signed-in portal page.
  Works whether or not the client is signed in (client_email is best-
  effort, from the current session if one exists) since a real problem
  can happen on any page, not just Invoices.
-->
<button type="button" class="report-bug-link" id="reportBugLink">Report a problem</button>

<div class="report-bug-overlay" id="reportBugOverlay" style="display:none;">
  <div class="report-bug-modal">
    <div class="report-bug-title" id="reportBugTitle">Report a problem</div>
    <p class="report-bug-sub" id="reportBugSub">Tell us what happened. We'll take a look.</p>
    <div id="reportBugFormArea">
      <textarea id="reportBugMessage" placeholder="What went wrong?" rows="4"></textarea>
      <div class="report-bug-error" id="reportBugError"></div>
      <div class="report-bug-actions">
        <button class="btn secondary-btn" id="reportBugCancel" type="button">Cancel</button>
        <button class="btn orange" id="reportBugSubmit" type="button">Send</button>
      </div>
    </div>
    <div class="report-bug-success" id="reportBugSuccess" style="display:none;">Thanks, we got your report and will take a look.</div>
  </div>
</div>


<script>
  (function () {
    const link = document.getElementById('reportBugLink');
    const overlay = document.getElementById('reportBugOverlay');
    const cancelBtn = document.getElementById('reportBugCancel');
    const submitBtn = document.getElementById('reportBugSubmit');
    const messageInput = document.getElementById('reportBugMessage');
    const errorEl = document.getElementById('reportBugError');
    const formArea = document.getElementById('reportBugFormArea');
    const successEl = document.getElementById('reportBugSuccess');

    function openReportBug() {
      overlay.style.display = 'flex';
      formArea.style.display = 'block';
      successEl.style.display = 'none';
      messageInput.value = '';
      errorEl.textContent = '';
    }
    function closeReportBug() {
      overlay.style.display = 'none';
    }
    link.addEventListener('click', openReportBug);
    cancelBtn.addEventListener('click', closeReportBug);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeReportBug(); });

    submitBtn.addEventListener('click', async () => {
      const message = messageInput.value.trim();
      if (!message) { errorEl.textContent = 'Please describe the problem first.'; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      errorEl.textContent = '';
      let clientEmail = null;
      try {
        const { data } = await client.auth.getSession();
        clientEmail = data.session ? data.session.user.email : null;
      } catch (e) { /* not signed in, that's fine -- report goes in anonymous */ }
      try {
        const res = await fetch('https://csvfqdjuobylgafgolho.supabase.co/rest/v1/portal_bug_reports', {
          method: 'POST',
          headers: {
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            client_email: clientEmail,
            message: message,
            page_url: window.location.pathname,
            user_agent: navigator.userAgent,
          }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        formArea.style.display = 'none';
        successEl.style.display = 'block';
      } catch (e) {
        errorEl.textContent = "Couldn't send that. Please call us instead.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
      }
    });
  })();
</script>
