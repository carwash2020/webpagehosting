  Client Portal dashboard (2026-08-31) -- same isolation as login.html:
  no internal /tools/ scripts loaded at all, only shared stylesheets
  for visual consistency. Every invoice shown here comes from
  client_portal_invoices, whose RLS policy (verified directly against
  the live table before this page existed) guarantees a signed-in
  client can only ever receive rows matching their own authenticated
  email -- this page doesn't add its own filtering on top, and
  deliberately doesn't need to, since the database itself is the real
  boundary, not this page's own query logic.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://csvfqdjuobylgafgolho.supabase.co https://api.stripe.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
<!-- color-scheme (2026-09-02): tells the browser to use a DARK default
     canvas BEFORE any CSS is parsed. Without it the browser paints its
     own white default first, which showed as a white flash on every
     navigation between portal pages. The inline background on <html>
     below is not enough on its own -- that only applies once the HTML
     starts parsing, which is already too late. -->

  // app-shell caching and push notification support. Registered on
  // every portal page (including login/set-password, matching the
  // manifest link's own consistent presence on every page) since
  // installability and offline support are useful before a session
  // even exists, not just after signing in.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/portal/service-worker.js', { scope: '/portal/' }).catch(() => {});
  }
</script>

<style>
  /* Cross-document view transitions (2026-09-04), requested directly
     after a real reported bug: "when switching between pages it
     still sometimes has a white flash." The <html style="background">
     inline fix and theme-color/color-scheme meta tags already in
     place solve the CSS-level flash-of-white-before-styles-load
     problem -- but this is a multi-page app (every portal page is a
     separate document), and "sometimes" points at something more
     fundamental: on a slower connection, the browser shows its own
     blank interstitial while waiting for the next page's bytes to
     arrive, before ANY of that CSS has even been parsed yet. This is
     the real, current web-platform fix for exactly that: opting
     into cross-document view transitions keeps the OLD page's
     visual snapshot on screen, cross-fading to the new one once
     it's ready, instead of a blank gap in between. Supported in
     Chrome/Edge 126+ and Safari 18.2+ (both well-established by
     now); browsers without support just navigate exactly as before
     -- this is pure progressive enhancement, never a requirement.
     Both the origin and destination page must opt in for a
     transition between them to happen at all, so this needs adding
     to every portal page, not just one. */
  @view-transition {
    navigation: auto;
  }
</style>

<style>
  body { background: #0a0a0a; max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  /* Widened for real desktop screens (2026-09-03), reported directly
     from actual desktop screenshots: "not good on desk top, doesnt
     even take up the full screen." 640px was chosen for mobile, where
     it effectively IS full-width -- but on a real monitor it left a
     narrow, centered column with a huge, obviously unintentional-
     looking gap on both sides. 900px is comfortable for a
     dashboard-style layout with cards and forms (unlike a plain
     text article, which reads worse past ~700-800px, form inputs and
     card grids use the extra width naturally rather than just
     stretching prose into overly long lines) without going fully
     edge-to-edge on today's larger screens, which would look just as
     unintentional in the other direction. The 860px breakpoint keeps
     tablets in portrait orientation on the mobile-tuned layout, since
     900px there would be wider than the viewport itself. */
  @media (min-width: 860px) {
    body { max-width: 900px; }
  }
  .portal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  /* min-width:0 (2026-09-02, from a direct screenshot): a flex child
     defaults to min-width:auto, which means it will NEVER shrink
     below its content's natural width -- so a long email address just
     overflowed straight through the settings/sign-out buttons next to
     it rather than truncating. min-width:0 lets it actually shrink,
     and .portal-sub below does the truncating. */
  .portal-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .portal-header-left > div { min-width: 0; }
  .portal-header img { width: 40px; height: auto; }
  .portal-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 19px; color: var(--white); }
  .portal-sub {
    color: var(--text-dim); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .portal-header-actions { display: flex; gap: 8px; align-items: center; }
  .portal-icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-panel-2); color: var(--text-dim); text-decoration: none; cursor: pointer;
  }
  .portal-icon-btn:hover { border-color: var(--orange); color: var(--orange-light); }
  .portal-icon-btn svg { width: 18px; height: 18px; }
  /* Fixed 2026-09-02, from a direct screenshot: with flex-wrap and
     flex:1 on 5 items, the 5th item (Jobs) couldn't fit on the first
     row at real phone widths, wrapped alone onto a second row, and
     then stretched to fill the FULL width by itself (a lone flex:1
     item on its own row always does) -- a huge, orphaned pill that
     looked broken rather than intentional.
     A CSS grid with exactly 5 equal columns never has this failure
     mode: every item is always on one row, at whatever width 1/5 of
     the container comes out to, right down to genuinely tiny phones.
     Narrower labels wrap to two lines inside their own cell instead
     of the layout itself breaking. */
  .invoice-card {
    background: var(--bg-panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }
  .invoice-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .invoice-number { font-weight: 600; color: var(--white); font-size: 15px; }
  .invoice-desc { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .invoice-total { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 20px; color: var(--white); }
  .invoice-status { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 600; display: inline-block; }
  .invoice-status.is-paid { background: rgba(76,175,120,0.15); color: #4caf78; }
  .invoice-status.is-unpaid { background: rgba(255,167,38,0.15); color: #ffa726; }
  .empty-state { text-align: center; color: var(--text-dim); padding: 60px 20px; }
  /* Signature capture before saving a new card (2026-09-03). */
  .pay-auth-box {
    background: var(--orange-tint-soft); border: 1px solid var(--orange-tint-border); border-radius: 8px;
    padding: 14px 16px;
  }
  .pay-auth-text { font-size: 13px; line-height: 1.5; color: var(--white); margin: 0 0 12px; }
  .pay-auth-text span { font-weight: 700; border-bottom: 1px dashed var(--orange-light); }
  .pay-auth-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
  #paySignerName { width: 100%; box-sizing: border-box; padding: 10px 12px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; color: var(--white); font-size: 15px; font-family: inherit; }
  .invoice-section-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 10px; }
  .invoice-section-title:first-child { margin-top: 0; }
  .payment-modal-overlay {
    position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .payment-modal-overlay.is-open { display: flex; }
  /* Scrolls internally, capped below the visible viewport height minus
     the overlay's own padding (2026-09-02, requested directly: "the
     background would move but the stripe box would not" while typing
     a card number). A real, well-documented iOS Safari bug: a
     `position: fixed` element is positioned against the LAYOUT
     viewport, which does not reliably shrink when the on-screen
     keyboard opens -- so the page behind it visually scrolls to bring
     the focused Stripe input into view, while this fixed modal stays
     pinned to where the old, keyboard-less viewport used to be.
     max-height + overflow-y: auto is what actually fixes it: once the
     modal can scroll ITSELF, the browser's normal
     scroll-input-into-view behavior operates on the modal's own
     scroll container instead of trying to reposition the fixed
     element, so the Stripe field the client is actively typing into
     stays visible without the modal appearing to detach from the
     page. */
  .payment-modal { background: var(--bg-panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 440px; width: 100%; max-height: calc(100vh - 40px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  /* Progressive enhancement, same rule: 100vh itself can be stale on
     iOS (it reflects the layout viewport, not what's actually visible
     once the keyboard is up). 100dvh is the dynamic-viewport unit that
     tracks the REAL visible area and updates live as the keyboard
     opens/closes -- browsers that don't support dvh simply skip this
     line and keep the vh-based value set above, so this is safe to
     add with no fallback branching needed. */
  @supports (max-height: 100dvh) {
    .payment-modal { max-height: calc(100dvh - 40px); }
  }
  .payment-modal-close { float: right; background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }
  .report-bug-link { display: block; margin-top: 14px; font-size: 12px; color: var(--text-dim); text-decoration: underline; cursor: pointer; text-align: center; background: none; border: none; font-family: inherit; padding: 0; }
  .report-bug-link:hover { color: var(--orange-light); }
  .report-bug-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
  .report-bug-modal { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 400px; width: 100%; }
  .report-bug-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 18px; color: var(--white); margin-bottom: 6px; }
  .report-bug-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }
  .report-bug-modal textarea { width: 100%; padding: 11px 13px; background: var(--bg-panel-2); border: 1px solid var(--border); border-radius: 8px; color: var(--white); font-size: 14px; font-family: inherit; box-sizing: border-box; resize: vertical; }
  .report-bug-error { color: #e05252; font-size: 13px; margin: 8px 0 0; min-height: 1px; }
  .report-bug-success { color: #4caf78; font-size: 14px; margin: 4px 0; line-height: 1.5; }
  .report-bug-actions { display: flex; gap: 10px; margin-top: 16px; }
  .report-bug-actions button { flex: 1; justify-content: center; }
</style>
</head>

<script>
  const { createClient } = supabase;
  const client = createClient(
    'https://csvfqdjuobylgafgolho.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs'
  );

  function formatCurrency(n) {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
  }
  function formatDate(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderLineItemsTable(items) {
    if (!Array.isArray(items) || !items.length) return '';
    const rows = items.map(li => `
      <tr>
        <td style="padding:4px 0; color:var(--text-dim); font-size:13px;">${escapeHtml(li.desc || '')}</td>
        <td style="padding:4px 0; text-align:center; color:var(--text-dim); font-size:13px;">${escapeHtml(String(li.qty ?? ''))}</td>
        <td style="padding:4px 0; text-align:right; color:var(--text-dim); font-size:13px;">${formatCurrency(li.amount || 0)}</td>
      </tr>
    `).join('');
    return `
      <details style="margin-top:8px;">
        <summary style="cursor:pointer; font-size:13px; color:var(--text-dim);">View details</summary>
        <table style="width:100%; margin-top:8px; border-top:1px solid var(--border); padding-top:6px;">
          <tbody>${rows}</tbody>
        </table>
      </details>
    `;
  }

  function renderInvoiceCard(inv) {
    return `
      <div class="invoice-card">
        <div class="invoice-card-top">
          <div>
            <div class="invoice-number">${escapeHtml(inv.invoice_number)}</div>
            ${inv.description ? `<div class="invoice-desc">${escapeHtml(inv.description)}</div>` : ''}
            <div class="invoice-desc">${formatDate(inv.invoice_date)}</div>
          </div>
          <div style="text-align:right;">
            <div class="invoice-total">${formatCurrency(inv.total)}</div>
            <span class="invoice-status ${inv.paid ? 'is-paid' : 'is-unpaid'}">${inv.paid ? 'Paid' : 'Unpaid'}</span>
            ${inv.paid && inv.paid_at ? `<div class="invoice-desc" style="margin-top:4px;">${formatDate(inv.paid_at.slice(0, 10))}</div>` : ''}
          </div>
        </div>
        ${renderLineItemsTable(inv.line_items)}
        <div style="display:flex; gap:8px; margin-top:8px;">
          ${!inv.paid ? `<button class="btn blue" style="flex:1; justify-content:center;" onclick="startPayment(${inv.id})">Pay now</button>` : ''}
          <button class="btn secondary-btn" style="${inv.paid ? 'width:100%;' : 'flex:1;'} justify-content:center;" onclick="downloadInvoicePDF(${inv.id})">${inv.paid ? 'Download Receipt' : 'Download PDF'}</button>
        </div>
      </div>
    `;
  }

  let currentInvoices = [];

  async function renderInvoices() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.replace('/portal/login.html');
      return;
    }
    document.getElementById('clientEmailDisplay').textContent = session.user.email;

    const { data: invoices, error } = await client
      .from('client_portal_invoices')
      .select('*')
      .order('invoice_date', { ascending: false });

    const listEl = document.getElementById('invoiceList');
    if (error) {
      listEl.innerHTML = `<div class="empty-state">Couldn't load your invoices right now. Please try again in a moment.</div>`;
      console.error(error);
      return;
    }
    currentInvoices = invoices;
    if (!invoices.length) {
      listEl.innerHTML = `<div class="empty-state">No invoices on file yet.</div>`;
      return;
    }

    // Auto-download when arriving via a real link (2026-09-03) --
    // Jobs' own "View Receipt" button, item 6 of a roadmap. Only
    // fires once per page load (the param is stripped from the URL
    // right after) so refreshing the page doesn't re-trigger a
    // download every time. A missing/unmatched invoice_number (the
    // job's own linked invoice never made it to the portal, for
    // instance) fails silently here -- a dead link is a much smaller
    // problem than an error message for something the client never
    // asked for directly.
    const requestedInvoiceNumber = new URLSearchParams(window.location.search).get('invoice');
    if (requestedInvoiceNumber) {
      history.replaceState(null, '', window.location.pathname);
      const match = invoices.find(inv => inv.invoice_number === requestedInvoiceNumber);
      if (match) downloadInvoicePDF(match.id);
    }

    // Split into two real sections rather than one mixed list --
    // requested directly, since a client's most relevant question is
    // usually "what do I still owe," not scanning past everything
    // already settled to find it.
    const outstanding = invoices.filter(inv => !inv.paid);
    const paid = invoices.filter(inv => inv.paid);

    let html = '';
    if (outstanding.length) {
      html += `<div class="invoice-section-title">Outstanding</div>`;
      // Only worth offering once there's actually more than one to
      // combine -- a single outstanding invoice already has its own
      // "Pay now" button right on the card, so a second button doing
      // the exact same thing would just be visual noise.
      if (outstanding.length > 1) {
        const outstandingTotal = outstanding.reduce((sum, inv) => sum + Number(inv.total || 0), 0);
        html += `<button class="btn orange" style="width:100%; justify-content:center; margin-bottom:12px;" onclick="startBulkPayment([${outstanding.map(inv => inv.id).join(',')}])">Pay All Outstanding (${formatCurrency(outstandingTotal)})</button>`;
      }
      html += outstanding.map(renderInvoiceCard).join('');
    }
    if (paid.length) {
      html += `<div class="invoice-section-title">Paid</div>` + paid.map(renderInvoiceCard).join('');
    }
    if (!outstanding.length && !paid.length) {
      html = `<div class="empty-state">No invoices on file yet.</div>`;
    }
    listEl.innerHTML = html;
  }

  // Matches this project's own escapeHtml() convention exactly (used
  // throughout /tools/) -- reimplemented here rather than shared,
  // since this page deliberately loads none of the internal scripts.
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  // Same self-contained image-to-dataURL helper used by
  // tools/invoice-generator.html, reimplemented here rather than
  // shared for the same isolation reason as escapeHtml above.
  function loadImageAsDataURL(src, timeoutMs = 3000) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('Image load timed out')), timeoutMs);
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        clearTimeout(timer);
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = () => { clearTimeout(timer); reject(new Error('Image failed to load')); };
      img.src = src;
    });
  }

  // Client-facing invoice PDF -- deliberately a simpler render than
  // tools/invoice-generator.html's, not a port of it. That tool's PDF
  // draws from fields this table doesn't have at all (per-unit price,
  // a taxable flag per line, a discount amount/label, payment terms,
  // a job description, a billing address) -- client_portal_invoices
  // only ever stores invoice_number/date/description/total/paid and a
  // line_items array of {desc, qty, amount}. This renders exactly
  // what a client can actually see on the dashboard already, formatted
  // as a keepable PDF, rather than inventing data that was never
  // synced to this table.
  async function downloadInvoicePDF(invoiceId) {
    const inv = currentInvoices.find(i => i.id === invoiceId);
    if (!inv) return;
    if (!window.jspdf) { alert('Still finishing loading. Give it a second and try again.'); return; }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const pageW = doc.internal.pageSize.getWidth();

    const NAVY = [26, 26, 26];
    const ORANGE = [224, 123, 30];
    const ORANGE_DARK = [179, 95, 19];
    const GRAY = [90, 90, 90];
    const LIGHTGRAY = [236, 236, 236];
    const GREEN = [76, 175, 120];

    doc.setFillColor(...NAVY);
    doc.rect(0, 0, pageW, 100, 'F');

    try {
      const logoData = await loadImageAsDataURL('/images/logo-signature-orange.webp');
      doc.addImage(logoData, 'PNG', 40, 15, 65, 60);
    } catch (e) { /* logo optional if it fails to load */ }

    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(255, 255, 255);
    doc.text('TRIPLE H', 118, 45);
    doc.setTextColor(...ORANGE);
    doc.text('ENTERPRISES', 118 + doc.getTextWidth('TRIPLE H ') + 4, 45);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(207, 207, 207);
    doc.text('Honesty.  Hustle.  Helpfulness.', 118, 62);

    doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...ORANGE);
    doc.text(inv.paid ? 'RECEIPT' : 'INVOICE', pageW - 40, 30, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(255, 255, 255);
    doc.text('(435) 414-1667', pageW - 40, 46, { align: 'right' });
    doc.text('steve@triplehenterprisesllc.biz', pageW - 40, 58, { align: 'right' });
    doc.text('www.triplehenterprisesllc.biz', pageW - 40, 70, { align: 'right' });

    // Receipt makeover (2026-09-02), requested directly. A genuine
    // visual seal rather than just swapping label text, the way the
    // rest of this function differentiated paid vs. unpaid before --
    // a rotated circular "PAID" stamp is the real, recognizable visual
    // convention for a receipt, not something colored text alone
    // conveys. Drawn AFTER the line-item table below rather than here
    // in the header, so it never collides with the BILL TO/JOB text
    // that follows -- jsPDF has no z-order/layering control, so
    // draw order IS paint order, and placing it here would have it
    // painted first and then covered by everything after it.

    let y = 130;
    // PAID stamp seal (2026-09-02), requested directly: "receipts
    // could also do a makeover." A rotated circular stamp is the real,
    // recognizable visual marker of a receipt -- swapped label text
    // and a color change (the only difference before this) doesn't
    // read as a genuinely different kind of document the way an
    // actual stamp does. Fixed position in the right-hand margin next
    // to BILL TO, chosen specifically because that space is otherwise
    // empty in this layout -- jsPDF has no z-order control, so
    // placement has to avoid painting over anything, not just
    // conceptually sit "behind" it.
    if (inv.paid) {
      const stampCX = pageW - 95, stampCY = 195, stampR = 46;
      doc.setDrawColor(...GREEN); doc.setLineWidth(2.5);
      doc.circle(stampCX, stampCY, stampR, 'S');
      doc.setLineWidth(1);
      doc.circle(stampCX, stampCY, stampR - 7, 'S');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.setTextColor(...GREEN);
      doc.text('PAID', stampCX, stampCY + 3, { align: 'center', angle: 12 });
      doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(...GREEN);
      doc.text('THANK YOU', stampCX, stampCY + 16, { align: 'center', angle: 12 });
    }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...GRAY);
    doc.text('INVOICE #', 40, y);
    doc.text('DATE', 40 + 150, y);
    doc.text('STATUS', 40 + 300, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(20, 20, 20);
    doc.text(inv.invoice_number, 40, y + 14);
    doc.text(formatDate(inv.invoice_date), 40 + 150, y + 14);
    if (inv.paid) { doc.setTextColor(...GREEN); doc.setFont('helvetica', 'bold'); }
    else { doc.setTextColor(...ORANGE); doc.setFont('helvetica', 'bold'); }
    doc.text(inv.paid ? 'PAID' : 'UNPAID', 40 + 300, y + 14);

    y += 40;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...ORANGE_DARK);
    doc.text('BILL TO', 40, y);
    y += 16;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(20, 20, 20);
    doc.text(inv.client_name || inv.client_email, 40, y);
    y += 14;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...GRAY);
    doc.text(inv.client_email, 40, y);
    y += 26;

    if (inv.description) {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...ORANGE_DARK);
      doc.text('JOB', 40, y);
      y += 16;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(20, 20, 20);
      const jobLines = doc.splitTextToSize(inv.description, pageW - 80);
      doc.text(jobLines, 40, y);
      y += jobLines.length * 13 + 12;
    }

    const items = Array.isArray(inv.line_items) ? inv.line_items : [];
    const tableW = pageW - 80;

    function drawTableHeaderBand(atY) {
      doc.setFillColor(...NAVY);
      doc.rect(40, atY - 14, tableW, 20, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(255, 255, 255);
      doc.text('DESCRIPTION', 46, atY);
      doc.text('QTY', 40 + tableW * 0.78, atY, { align: 'center' });
      doc.text('AMOUNT', pageW - 46, atY, { align: 'right' });
    }

    if (items.length) {
      drawTableHeaderBand(y);
      y += 8;
      const pageH = doc.internal.pageSize.getHeight();
      const tableBottom = pageH - 140;
      let stripe = false;
      items.forEach(item => {
        const rowH = 22;
        if (y + rowH > tableBottom) {
          doc.addPage();
          y = 60;
          drawTableHeaderBand(y);
          y += 8;
          stripe = false;
        }
        if (stripe) { doc.setFillColor(...LIGHTGRAY); doc.rect(40, y, tableW, rowH, 'F'); }
        stripe = !stripe;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(20, 20, 20);
        doc.text(String(item.desc || ''), 46, y + 14);
        doc.text(String(item.qty ?? ''), 40 + tableW * 0.78, y + 14, { align: 'center' });
        doc.text('$' + Number(item.amount || 0).toFixed(2), pageW - 46, y + 14, { align: 'right' });
        y += rowH;
      });
      doc.setDrawColor(200, 200, 200);
      doc.line(40, y, pageW - 40, y);
      y += 24;
    } else {
      y += 10;
    }

    doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(20, 20, 20);
    doc.text(inv.paid ? 'TOTAL PAID' : 'TOTAL DUE', pageW - 220, y);
    doc.setTextColor(...(inv.paid ? GREEN : ORANGE));
    doc.text('$' + Number(inv.total || 0).toFixed(2), pageW - 40, y, { align: 'right' });

    y += 30;
    // Payment Details box (2026-09-02), requested directly as part of
    // the receipt makeover -- was plain running text (a single small
    // gray line), which read like a footnote rather than a real part
    // of the receipt. A bordered box with a section label matches the
    // visual weight already given to BILL TO and JOB above it, so the
    // receipt's payment confirmation reads as a real section rather
    // than an afterthought.
    if (inv.paid && inv.paid_at) {
      const boxW = pageW - 80, boxH = inv.stripe_payment_intent_id ? 62 : 44;
      doc.setDrawColor(...GREEN); doc.setFillColor(247, 252, 249); doc.setLineWidth(1);
      doc.roundedRect(40, y, boxW, boxH, 4, 4, 'FD');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...GREEN);
      doc.text('PAYMENT DETAILS', 52, y + 18);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(20, 20, 20);
      doc.text('Paid ' + formatDate(inv.paid_at.slice(0, 10)) + ' via ' + (inv.stripe_payment_intent_id ? 'card (Stripe)' : 'cash or check') + '.', 52, y + 34);
      if (inv.stripe_payment_intent_id) {
        doc.setFontSize(8); doc.setTextColor(...GRAY);
        doc.text('Payment reference: ' + inv.stripe_payment_intent_id, 52, y + 48);
      }
      y += boxH + 20;
      doc.setFont('helvetica', 'italic'); doc.setFontSize(10.5); doc.setTextColor(...ORANGE_DARK);
      doc.text('Thank you for your business!', 40, y);
    } else if (!inv.paid) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...GRAY);
      doc.text('Questions about this invoice? Call (435) 414-1667 or email steve@triplehenterprisesllc.biz.', 40, y);
    }

    doc.save((inv.paid ? 'Receipt-' : 'Invoice-') + inv.invoice_number + '.pdf');
  }

  // Stripe LIVE publishable key (switched 2026-09-02, after a real
  // test-mode payment was confirmed end to end: card entered in the
  // portal -> PaymentIntent created -> webhook fired -> invoice marked
  // paid). Publishable keys are designed to be public and live in
  // browser code -- this is not a secret, unlike STRIPE_SECRET_KEY,
  // which only ever exists as a Supabase edge-function secret and
  // never appears in this repo.
  //
  // MODES MUST MATCH: this key and the STRIPE_SECRET_KEY /
  // STRIPE_WEBHOOK_SIGNING_SECRET in Supabase must all be live-mode
  // together. A live publishable key against a test-mode secret (or
  // vice versa) fails LOUDLY at Stripe.js confirm time -- a clear
  // error, never a silent wrong charge -- so a brief mismatch during
  // cutover is safe, just visibly broken until both sides agree.
  const STRIPE_PUBLISHABLE_KEY = 'pk_live_51TxzzNLJyq7HLm12tpc3XfPvsQK1vN7qHJ5KhvYhhi2YSFtPOqNXMTr2bTm7ADjwxtbUl2UmXg9kHGfzKve1izn700mFVhdVRo';
  let stripeInstance = null;
  let elementsInstance = null;

  async function startPayment(invoiceId, signerName) {
    document.getElementById('paymentModal').classList.add('is-open');
    document.getElementById('paymentModalBody').innerHTML = '<div class="empty-state">Loading...</div>';

    const { data: { session } } = await client.auth.getSession();
    const res = await fetch(
      'https://csvfqdjuobylgafgolho.supabase.co/functions/v1/create-payment-intent',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ invoice_id: invoiceId, signer_name: signerName || undefined }),
      }
    );
    const result = await res.json();
    if (!result.ok) {
      // Signature capture (2026-09-03), requested directly: "we also
      // need to collect signitures when we collect and create
      // accounts within stripe incase we ever have to handle a
      // dispute." A needs_signature response isn't a real error --
      // it's this client's first time saving a card, and the server
      // wants an authorization on file before it does. Shown here,
      // then this exact same function is called again with the name
      // that was typed.
      if (result.needs_signature) {
        renderPaymentSignatureStep(invoiceId);
        return;
      }
      document.getElementById('paymentModalBody').innerHTML = `<div class="empty-state">${escapeHtml(result.error || 'Something went wrong.')}</div>`;
      return;
    }
    mountPaymentUI(result.client_secret);
  }

  function renderPaymentSignatureStep(invoiceId) {
    const inv = currentInvoices.find(i => i.id === invoiceId);
    const amountLabel = inv ? '$' + Number(inv.total).toFixed(2) : 'the invoice total';
    document.getElementById('paymentModalBody').innerHTML =
      '<div class="pay-auth-box">' +
      '<p class="pay-auth-text">I, <span id="paySignerNamePreview">_____________</span>, authorize Triple H Enterprises to charge ' + amountLabel + ' for this invoice, and to securely save this card on file for future charges I separately approve.</p>' +
      '<label for="paySignerName" class="pay-auth-label">Type your full legal name to continue</label>' +
      '<input type="text" id="paySignerName" placeholder="Full name" oninput="document.getElementById(\'paySignerNamePreview\').textContent = this.value.trim() || \'_____________\';">' +
      '</div>' +
      '<button class="btn blue" id="payAuthContinueBtn" style="width:100%; justify-content:center; margin-top:14px;" onclick="submitPaymentSignature(' + invoiceId + ')">Continue to Payment</button>';
  }

  function submitPaymentSignature(invoiceId) {
    const signerName = (document.getElementById('paySignerName')?.value || '').trim();
    if (!signerName) {
      alert('Please type your full name to continue.');
      return;
    }
    startPayment(invoiceId, signerName);
  }

  // Pay All Outstanding (2026-09-02) -- combines every unpaid invoice
  // into ONE PaymentIntent via create-bulk-payment-intent, then reuses
  // the exact same Stripe Elements mount/confirm flow as a single-
  // invoice payment. Deliberately a separate function rather than
  // overloading startPayment(invoiceId) with an array-or-number
  // parameter -- the two call sites (one card's "Pay now" button vs.
  // the top-of-page "Pay All Outstanding" button) are different enough
  // UI contexts that keeping them as two clearly-named functions reads
  // better than one function branching on its argument's type.
  async function startBulkPayment(invoiceIds, signerName) {
    document.getElementById('paymentModal').classList.add('is-open');
    document.getElementById('paymentModalBody').innerHTML = '<div class="empty-state">Loading...</div>';

    const { data: { session } } = await client.auth.getSession();
    const res = await fetch(
      'https://csvfqdjuobylgafgolho.supabase.co/functions/v1/create-bulk-payment-intent',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ invoice_ids: invoiceIds, signer_name: signerName || undefined }),
      }
    );
    const result = await res.json();
    if (!result.ok) {
      // Signature capture (2026-09-04), found during a functional
      // audit: bulk payments never attached a Stripe Customer or
      // saved the card used, unlike single-invoice payments -- a
      // real inconsistency, not an intentional difference. Now
      // mirrors startPayment()'s own needs_signature handling exactly.
      if (result.needs_signature) {
        renderBulkPaymentSignatureStep(invoiceIds);
        return;
      }
      document.getElementById('paymentModalBody').innerHTML = `<div class="empty-state">${escapeHtml(result.error || 'Something went wrong.')}</div>`;
      return;
    }
    mountPaymentUI(result.client_secret);
  }

  function renderBulkPaymentSignatureStep(invoiceIds) {
    const total = currentInvoices
      .filter(inv => invoiceIds.includes(inv.id))
      .reduce((sum, inv) => sum + Number(inv.total), 0);
    const amountLabel = '$' + total.toFixed(2);
    document.getElementById('paymentModalBody').innerHTML =
      '<div class="pay-auth-box">' +
      '<p class="pay-auth-text">I, <span id="bulkPaySignerNamePreview">_____________</span>, authorize Triple H Enterprises to charge ' + amountLabel + ' for ' + invoiceIds.length + ' outstanding invoices, and to securely save this card on file for future charges I separately approve.</p>' +
      '<label for="bulkPaySignerName" class="pay-auth-label">Type your full legal name to continue</label>' +
      '<input type="text" id="bulkPaySignerName" placeholder="Full name" oninput="document.getElementById(\'bulkPaySignerNamePreview\').textContent = this.value.trim() || \'_____________\';">' +
      '</div>' +
      '<button class="btn blue" id="bulkPayAuthContinueBtn" style="width:100%; justify-content:center; margin-top:14px;" onclick="submitBulkPaymentSignature([' + invoiceIds.join(',') + '])">Continue to Payment</button>';
  }

  function submitBulkPaymentSignature(invoiceIds) {
    const signerName = (document.getElementById('bulkPaySignerName')?.value || '').trim();
    if (!signerName) {
      alert('Please type your full name to continue.');
      return;
    }
    startBulkPayment(invoiceIds, signerName);
  }

  // Shared by startPayment() and startBulkPayment() -- everything past
  // "we have a client_secret" is identical regardless of whether it
  // covers one invoice or several: mount Stripe Elements, wire the Pay
  // button, and re-render on success. The webhook (stripe-webhook)
  // is what actually knows how many invoices this PaymentIntent covers.
  function mountPaymentUI(clientSecret) {
    if (!stripeInstance) stripeInstance = Stripe(STRIPE_PUBLISHABLE_KEY);
    elementsInstance = stripeInstance.elements({ clientSecret });
    document.getElementById('paymentModalBody').innerHTML = `
      <div id="paymentElement"></div>
      <div class="login-error" id="paymentError"></div>
      <button class="btn blue" id="paymentSubmitBtn" style="width:100%; justify-content:center; margin-top:14px;">Pay</button>
    `;
    const paymentElement = elementsInstance.create('payment');
    paymentElement.mount('#paymentElement');

    document.getElementById('paymentSubmitBtn').addEventListener('click', async () => {
      const btn = document.getElementById('paymentSubmitBtn');
      const errorEl = document.getElementById('paymentError');
      btn.disabled = true;
      btn.textContent = 'Processing...';
      errorEl.textContent = '';

      // redirect: 'if_required' keeps the client on this same page for
      // the common case (a card payment that completes immediately) --
      // matches the embedded, seamless experience this was built for.
      // Stripe only redirects at all if the specific payment method
      // genuinely requires it (some bank-redirect methods, certain 3D
      // Secure flows).
      const { error, paymentIntent } = await stripeInstance.confirmPayment({
        elements: elementsInstance,
        redirect: 'if_required',
      });

      if (error) {
        errorEl.textContent = error.message || 'Payment failed. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Pay';
        return;
      }
      if (paymentIntent && paymentIntent.status === 'succeeded') {
        document.getElementById('paymentModalBody').innerHTML = '<div class="empty-state" style="color:#4caf78;">Payment received. Thank you!</div>';
        setTimeout(() => {
          document.getElementById('paymentModal').classList.remove('is-open');
          renderInvoices(); // reflects the new paid status once the webhook (usually near-instant) has processed it
        }, 1800);
      }
    });
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.replace('/portal/login.html');
  });

  renderInvoices();
  initPortalPullToRefresh(renderInvoices);
</script>

<script>
  (function () {
    const link = document.getElementById('reportBugLink');
    const overlay = document.getElementById('reportBugOverlay');
    const cancelBtn = document.getElementById('reportBugCancel');
    const submitBtn = document.getElementById('reportBugSubmit');
    const messageInput = document.getElementById('reportBugMessage');
    const errorEl = document.getElementById('reportBugError');
    const formArea = document.getElementById('reportBugFormArea');
    const successEl = document.getElementById('reportBugSuccess');

    function openReportBug() {
      overlay.style.display = 'flex';
      formArea.style.display = 'block';
      successEl.style.display = 'none';
      messageInput.value = '';
      errorEl.textContent = '';
    }
    function closeReportBug() {
      overlay.style.display = 'none';
    }
    link.addEventListener('click', openReportBug);
    cancelBtn.addEventListener('click', closeReportBug);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeReportBug(); });

    submitBtn.addEventListener('click', async () => {
      const message = messageInput.value.trim();
      if (!message) { errorEl.textContent = 'Please describe the problem first.'; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      errorEl.textContent = '';
      let clientEmail = null;
      try {
        const { data } = await client.auth.getSession();
        clientEmail = data.session ? data.session.user.email : null;
      } catch (e) { /* not signed in, that's fine -- report goes in anonymous */ }
      try {
        const res = await fetch('https://csvfqdjuobylgafgolho.supabase.co/rest/v1/portal_bug_reports', {
          method: 'POST',
          headers: {
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            client_email: clientEmail,
            message: message,
            page_url: window.location.pathname,
            user_agent: navigator.userAgent,
          }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        formArea.style.display = 'none';
        successEl.style.display = 'block';
      } catch (e) {
        errorEl.textContent = "Couldn't send that. Please call us instead.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
      }
    });
  })();
</script>
