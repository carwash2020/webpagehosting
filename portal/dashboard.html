<!DOCTYPE html>
<html lang="en" style="background:#0a0a0a;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your Invoices | Triple H Enterprises</title>
<!--
  Client Portal dashboard (2026-08-31) -- same isolation as login.html:
  no internal /tools/ scripts loaded at all, only shared stylesheets
  for visual consistency. Every invoice shown here comes from
  client_portal_invoices, whose RLS policy (verified directly against
  the live table before this page existed) guarantees a signed-in
  client can only ever receive rows matching their own authenticated
  email -- this page doesn't add its own filtering on top, and
  deliberately doesn't need to, since the database itself is the real
  boundary, not this page's own query logic.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://csvfqdjuobylgafgolho.supabase.co https://api.stripe.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=202608202000">
<link rel="stylesheet" href="/tools/styles-tools.css?v=a2e87effb3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  .portal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .portal-header-left { display: flex; align-items: center; gap: 12px; }
  .portal-header img { width: 40px; height: auto; }
  .portal-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 19px; color: var(--white); }
  .portal-sub { color: var(--text-dim); font-size: 13px; }
  .invoice-card {
    background: var(--bg-panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }
  .invoice-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .invoice-number { font-weight: 600; color: var(--white); font-size: 15px; }
  .invoice-desc { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .invoice-total { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 20px; color: var(--white); }
  .invoice-status { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 600; display: inline-block; }
  .invoice-status.is-paid { background: rgba(76,175,120,0.15); color: #4caf78; }
  .invoice-status.is-unpaid { background: rgba(255,167,38,0.15); color: #ffa726; }
  .empty-state { text-align: center; color: var(--text-dim); padding: 60px 20px; }
</style>
</head>
<body>

<div class="portal-header">
  <div class="portal-header-left">
    <img src="/images/logo-signature-orange.webp?v=202608142300" alt="Triple H Enterprises">
    <div>
      <div class="portal-title">Your Invoices</div>
      <div class="portal-sub" id="clientEmailDisplay"></div>
    </div>
  </div>
  <button class="secondary-btn" id="signOutBtn">Sign out</button>
</div>

<div id="invoiceList"></div>

<script>
  const { createClient } = supabase;
  const client = createClient(
    'https://csvfqdjuobylgafgolho.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs'
  );

  function formatCurrency(n) {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
  }
  function formatDate(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  async function renderInvoices() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.replace('/portal/login.html');
      return;
    }
    document.getElementById('clientEmailDisplay').textContent = session.user.email;

    const { data: invoices, error } = await client
      .from('client_portal_invoices')
      .select('*')
      .order('invoice_date', { ascending: false });

    const listEl = document.getElementById('invoiceList');
    if (error) {
      listEl.innerHTML = `<div class="empty-state">Couldn't load your invoices right now -- please try again in a moment.</div>`;
      console.error(error);
      return;
    }
    if (!invoices.length) {
      listEl.innerHTML = `<div class="empty-state">No invoices on file yet.</div>`;
      return;
    }

    listEl.innerHTML = invoices.map(inv => `
      <div class="invoice-card">
        <div class="invoice-card-top">
          <div>
            <div class="invoice-number">${escapeHtml(inv.invoice_number)}</div>
            ${inv.description ? `<div class="invoice-desc">${escapeHtml(inv.description)}</div>` : ''}
            <div class="invoice-desc">${formatDate(inv.invoice_date)}</div>
          </div>
          <div style="text-align:right;">
            <div class="invoice-total">${formatCurrency(inv.total)}</div>
            <span class="invoice-status ${inv.paid ? 'is-paid' : 'is-unpaid'}">${inv.paid ? 'Paid' : 'Unpaid'}</span>
          </div>
        </div>
        ${!inv.paid ? `<button class="btn blue" style="width:100%; justify-content:center; margin-top:8px;" onclick="startPayment(${inv.id})">Pay now</button>` : ''}
      </div>
    `).join('');
  }

  // Matches this project's own escapeHtml() convention exactly (used
  // throughout /tools/) -- reimplemented here rather than shared,
  // since this page deliberately loads none of the internal scripts.
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  function startPayment(invoiceId) {
    // Wired up in the next step -- the actual Stripe Elements payment
    // flow, built and tested against Stripe's test mode.
    alert('Payment flow coming next.');
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.replace('/portal/login.html');
  });

  renderInvoices();
</script>

</body>
</html>
