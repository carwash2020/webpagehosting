# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: carwash2020/Triple-H-Enterprise-Webpage
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/3a3a5da4-1c7f-46c5-93ba-cd5e8de44eca/pkce
  auth_token_endpoint: /sites/3a3a5da4-1c7f-46c5-93ba-cd5e8de44eca/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://www.triplehenterprisesllc.biz

# If you use the CMS to upload a brand new photo (not just edit an
# existing one), this is where the file itself gets saved.
media_folder: "images/gallery"
public_folder: "images/gallery"

collections:
  - name: "gallery"
    label: "Photo Gallery"
    files:
      - name: "gallery_data"
        label: "Gallery Photos"
        file: "data/gallery.json"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            summary: "{{fields.category}} ({{fields.images}} photos)"
            fields:
              - label: "Category Name"
                name: "category"
                widget: "string"
                hint: "Shown as a heading above this group of photos, e.g. \"Flooring — Finished\""
              - label: "Photos in this category"
                name: "images"
                widget: "list"
                summary: "{{fields.caption}}"
                fields:
                  - label: "Photo"
                    name: "src"
                    widget: "image"
                    hint: "Click to upload a new photo, or leave as-is to keep the current one"
                  - label: "Caption (shown under the photo)"
                    name: "caption"
                    widget: "string"
                  - label: "Alt text (for accessibility / SEO — usually same as caption)"
                    name: "alt"
                    widget: "string"
