<style>
  :root{
    --bg:#0a0a0a;
    --bg-panel:#141414;
    --bg-panel-2:#1a1a1a;
    --border:#2a2a2a;
    --text:#e8e8e8;
    --text-dim:#9a9a9a;
    --orange:#ff8000;
    --orange-dark:#c96400;
    --orange-light:#ffb347;
    --orange-tint-soft: rgba(255,128,0,0.08);
    --orange-tint-border: rgba(255,128,0,0.32);
    --radius:12px;
    --hex: polygon(25% 6%, 75% 6%, 97% 50%, 75% 94%, 25% 94%, 3% 50%);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter', sans-serif; line-height:1.5;
    padding-bottom:80px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  .wrap{max-width:600px; margin:0 auto; padding:0 20px;}
  header.site-header{ padding:22px 0; border-bottom:1px solid var(--border); margin-bottom:40px; }
  header.site-header .wrap{display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--text);}
  .brand img{width:38px; height:auto;}
  .brand-name{font-family:'Oswald', sans-serif; font-weight:700; letter-spacing:1.5px; font-size:14px;}
  .phone-link{display:flex; align-items:center; gap:8px; color:var(--orange-light); text-decoration:none; font-weight:600; font-size:14.5px; white-space:nowrap; padding:8px 10px; border-radius:8px; transition:background .15s ease;}
  .phone-link:hover{background:var(--orange-tint-soft);}
  .phone-link:focus-visible, a:focus-visible, button:focus-visible{outline:2px solid var(--orange-light); outline-offset:2px;}
  .phone-link svg{width:16px; height:16px; flex-shrink:0;}

  h1{font-family:'Oswald', sans-serif; font-size:28px; letter-spacing:0.3px; margin:0 0 24px; font-weight:700;}

  .hex-icon{
    width:44px; height:44px; flex-shrink:0; position:relative;
    background:var(--orange-tint-soft); border:1px solid var(--orange-tint-border);
    clip-path:var(--hex); display:flex; align-items:center; justify-content:center;
  }
  .hex-icon svg{width:20px; height:20px; color:var(--orange-light); stroke-width:2;}
  .hex-icon.is-muted{background:var(--bg-panel-2); border-color:var(--border);}
  .hex-icon.is-muted svg{color:var(--text-dim);}

  .booking-card{
    background:var(--bg-panel-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; margin-bottom:22px; display:flex; gap:16px; align-items:flex-start;
  }
  .booking-card .svc{font-weight:700; font-size:16.5px; margin-bottom:4px;}
  .booking-card .when{color:var(--text-dim); font-size:14.5px;}

  .state-msg{text-align:center; padding:36px 20px 8px; color:var(--text-dim);}
  .state-msg.is-error{color:#ff8a80;}
  .state-msg .checkmark{
    width:64px; height:64px; clip-path:var(--hex); background:var(--orange); color:#1a1a1a;
    display:flex; align-items:center; justify-content:center; margin:0 auto 18px; font-size:27px; font-weight:700;
    animation:popIn .4s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes popIn{from{opacity:0; transform:scale(.5);} to{opacity:1; transform:scale(1);}}
  .state-msg .hex-icon{margin:0 auto 18px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:15px 24px; border-radius:10px; font-family:'Oswald', sans-serif; font-weight:600;
    letter-spacing:1px; text-transform:uppercase; font-size:13.5px; border:2px solid transparent;
    cursor:pointer; width:100%; margin-top:16px; text-decoration:none;
    transition:background .15s ease, border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .btn.danger{background:transparent; border-color:#e05252; color:#e05252;}
  .btn.danger:hover{background:rgba(224,82,82,0.1);}
  .btn.danger:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  .btn.orange{background:var(--orange); color:#1a1a1a; box-shadow:0 6px 18px -8px rgba(255,128,0,.55);}
  .btn.orange:hover{background:var(--orange-dark); transform:translateY(-1px);}
  .btn.ghost{background:transparent; border-color:var(--border); color:var(--text-dim);}
  .btn.ghost:hover{border-color:var(--orange-tint-border); color:var(--text);}

  #confirmStep{display:none;}
  #confirmStep.is-active{display:block; animation:stepIn .25s ease both;}
  #rescheduleStep{display:none;}
  #rescheduleStep.is-active{display:block; animation:stepIn .25s ease both;}
  @keyframes stepIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .date-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin:18px 0; -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity;}
  .date-btn{
    flex:0 0 auto; min-width:66px; text-align:center; background:var(--bg-panel-2);
    border:1px solid var(--border); border-radius:10px; padding:11px 8px; cursor:pointer;
    color:var(--text); font-family:inherit; scroll-snap-align:start;
    transition:border-color .15s ease, transform .15s ease;
  }
  .date-btn:hover{border-color:var(--orange-tint-border); transform:translateY(-2px);}
  .date-btn .dow{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px;}
  .date-btn .dom{font-size:18px; font-weight:700; margin-top:2px; font-family:'Oswald', sans-serif;}
  .date-btn.is-selected{border-color:var(--orange); background:var(--orange-tint-soft); color:var(--orange-light);}

  .slots-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px; margin-bottom:8px;}
  .slot-btn{
    background:var(--bg-panel-2); border:1px solid var(--border); border-radius:10px;
    padding:12px 6px; cursor:pointer; color:var(--text); font-family:inherit; font-size:13.5px;
    text-align:center; font-weight:500; transition:border-color .15s ease, transform .15s ease;
  }
  .slot-btn:hover{border-color:var(--orange-tint-border); transform:translateY(-2px);}
  .slot-btn.is-selected{border-color:var(--orange); background:var(--orange-tint-soft); color:var(--orange-light); font-weight:700;}
  .slots-empty{color:var(--text-dim); font-size:14px; padding:20px 0; text-align:center;}

  .btn-retry{
    display:inline-flex; align-items:center; gap:8px; margin:12px auto 0; grid-column:1/-1; justify-self:center;
    background:transparent; border:1.5px solid var(--orange-tint-border); color:var(--orange-light);
    font-family:'Oswald', sans-serif; font-weight:600; letter-spacing:0.5px; font-size:13px;
    padding:10px 20px; border-radius:8px; cursor:pointer; transition:background .15s ease, border-color .15s ease;
  }
  .btn-retry:hover{background:var(--orange-tint-soft); border-color:var(--orange);}
  .btn-retry svg{width:15px; height:15px;}

  @media (max-width: 480px){
    .brand-name{display:none;}
    h1{font-size:24px;}
    .slots-grid{grid-template-columns:repeat(auto-fill, minmax(84px, 1fr));}
  }
</style>

<script>
(function () {
  const SUPABASE_URL = 'https://csvfqdjuobylgafgolho.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs';
  const BUSINESS_TIMEZONE = 'America/Denver';

  // Same icon set as booking.html, matched here by label since
  // get_booking_by_cancel_token only returns service_label, not
  // service_key -- safe because the label is always one of these
  // exact, fixed strings, since booking.html's own form is the only
  // way a th_bookings row is ever created.
  const SERVICE_ICONS = {
    'Inspection': '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    'Plumbing Fixes & Leaks': '<path d="M12 2c-3 4-6 7-6 11a6 6 0 0 0 12 0c0-4-3-7-6-11z"/>',
    'Appliance Repair': '<rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><circle cx="12" cy="15" r="3"/>',
    'General Handyman Repairs': '<path d="M14.7 6.3a4 4 0 1 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.8 2.8-2.1-2.1z"/>',
    'Assembly & Installation': '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    'Drywall & Painting': '<path d="M3 21l4.5-1.5L21 6a2.1 2.1 0 0 0-3-3L4.5 16.5 3 21z"/>',
  };
  const DEFAULT_ICON = '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>';

  function svgIcon(pathContent) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + pathContent + '</svg>';
  }

  function serviceHexIcon(label) {
    return '<div class="hex-icon">' + svgIcon(SERVICE_ICONS[label] || DEFAULT_ICON) + '</div>';
  }

  function escapeHtml(value) {
    const s = value === null || value === undefined ? '' : String(value);
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function getTokenFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('token');
  }

  async function callRpc(fnName, args) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fnName, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
      },
      body: JSON.stringify(args),
    });
    if (!res.ok) return null;
    return res.json();
  }

  function renderState(html) {
    document.getElementById('content').innerHTML = html;
  }

  function renderNoToken() {
    renderState(
      '<div class="state-msg is-error">' +
      '<div class="hex-icon is-muted">' + svgIcon('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>') + '</div>' +
      '<p>This link is missing some information. If you followed a link from your confirmation email, try copying the full link into your browser, or call us and we\'ll take care of it.</p></div>'
    );
  }

  function renderNotFound() {
    renderState(
      '<div class="state-msg is-error">' +
      '<div class="hex-icon is-muted">' + svgIcon('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>') + '</div>' +
      '<p>We couldn\'t find a booking for this link. If you think this is a mistake, give us a call and we\'ll sort it out.</p></div>'
    );
  }

  function formatWhen(startAtStr, endAtStr) {
    const start = new Date(startAtStr);
    const end = new Date(endAtStr);
    const dateLabel = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, weekday: 'long', month: 'long', day: 'numeric' }).format(start);
    const timeFmt = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, hour: 'numeric', minute: '2-digit' });
    return dateLabel + ' at ' + timeFmt.format(start) + ' \u2013 ' + timeFmt.format(end);
  }

  // --- reschedule: slot computation, matching booking.html exactly ---------

  const HOURS_BY_WEEKDAY = { 0: [14, 20], 1: [14, 22], 2: [14, 22], 3: [14, 22], 4: [14, 22], 5: [14, 22], 6: [7, 22] };
  const SLOT_INCREMENT_MINUTES = 30;
  const MIN_LEAD_HOURS = 2;
  const SCHEDULE_BUFFER_MINUTES = 15;
  const DAYS_AHEAD_SHOWN = 14;

  function zonedTimeToUtc(dateStr, hh, mm) {
    const timeStr = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    const naiveUtc = new Date(dateStr + 'T' + timeStr + ':00Z');
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: BUSINESS_TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    }).formatToParts(naiveUtc);
    const map = {};
    parts.forEach(function (p) { map[p.type] = p.value; });
    const hourFixed = map.hour === '24' ? '00' : map.hour;
    const asIfLocal = new Date(map.year + '-' + map.month + '-' + map.day + 'T' + hourFixed + ':' + map.minute + ':' + map.second + 'Z');
    const diff = naiveUtc.getTime() - asIfLocal.getTime();
    return new Date(naiveUtc.getTime() + diff);
  }

  function businessWeekday(dateStr) {
    const noonUtc = zonedTimeToUtc(dateStr, 12, 0);
    const s = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, weekday: 'short' }).format(noonUtc);
    return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(s);
  }

  function todayDateStrInBusinessTz() {
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    const map = {};
    parts.forEach(function (p) { map[p.type] = p.value; });
    return map.year + '-' + map.month + '-' + map.day;
  }

  function addDaysToDateStr(dateStr, days) {
    const d = new Date(dateStr + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }

  function overlaps(aStart, aEnd, bStart, bEnd) {
    return aStart < bEnd && bStart < aEnd;
  }

  function computeSlotsForDate(dateStr, durationMinutes, bookings) {
    const weekday = businessWeekday(dateStr);
    const hours = HOURS_BY_WEEKDAY[weekday];
    if (!hours) return [];
    const openHour = hours[0], closeHour = hours[1];
    const now = new Date();
    const earliestAllowed = new Date(now.getTime() + MIN_LEAD_HOURS * 60 * 60 * 1000);
    const bufferMs = SCHEDULE_BUFFER_MINUTES * 60000;

    const slots = [];
    for (let mins = openHour * 60; mins + durationMinutes <= closeHour * 60; mins += SLOT_INCREMENT_MINUTES) {
      const hh = Math.floor(mins / 60), mm = mins % 60;
      const startUtc = zonedTimeToUtc(dateStr, hh, mm);
      const endUtc = new Date(startUtc.getTime() + durationMinutes * 60000);
      if (startUtc < earliestAllowed) continue;
      const conflict = bookings.some(function (b) {
        return overlaps(startUtc, endUtc, new Date(b.start.getTime() - bufferMs), new Date(b.end.getTime() + bufferMs));
      });
      if (conflict) continue;
      const label = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, hour: 'numeric', minute: '2-digit' }).format(startUtc);
      slots.push({ startUtc: startUtc, endUtc: endUtc, label: label });
    }
    return slots;
  }

  async function fetchBookingsForDate(dateStr, excludeStartIso) {
    const dayStartUtc = zonedTimeToUtc(dateStr, 0, 0);
    const rangeStart = new Date(dayStartUtc.getTime() - 24 * 60 * 60 * 1000).toISOString();
    const rangeEnd = new Date(dayStartUtc.getTime() + 2 * 24 * 60 * 60 * 1000).toISOString();
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_booking_availability', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ p_range_start: rangeStart, p_range_end: rangeEnd }),
    });
    if (!res.ok) throw new Error('availability check failed (HTTP ' + res.status + ')');
    const rows = await res.json();
    return rows
      .filter(function (r) { return r.start_at !== excludeStartIso; })
      .map(function (r) { return { start: new Date(r.start_at), end: new Date(r.end_at) }; });
  }

  function renderBooking(booking, token) {
    if (booking.status === 'cancelled') {
      renderState(
        '<div class="booking-card">' + serviceHexIcon(booking.service_label) + '<div><div class="svc">' + escapeHtml(booking.service_label) + '</div>' +
        '<div class="when">' + formatWhen(booking.start_at, booking.end_at) + '</div></div></div>' +
        '<div class="state-msg"><div class="hex-icon is-muted">' + svgIcon('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>') + '</div><p>This booking has already been cancelled.</p></div>' +
        '<a href="/booking.html" class="btn orange">Book a new appointment</a>'
      );
      return;
    }

    if (new Date(booking.end_at) < new Date()) {
      renderState(
        '<div class="booking-card">' + serviceHexIcon(booking.service_label) + '<div><div class="svc">' + escapeHtml(booking.service_label) + '</div>' +
        '<div class="when">' + formatWhen(booking.start_at, booking.end_at) + '</div></div></div>' +
        '<div class="state-msg"><div class="hex-icon is-muted">' + svgIcon('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>') + '</div><p>This appointment has already happened.</p></div>' +
        '<a href="/booking.html" class="btn orange">Book a new appointment</a>'
      );
      return;
    }

    renderState(
      '<div class="booking-card">' + serviceHexIcon(booking.service_label) + '<div><div class="svc">' + escapeHtml(booking.service_label) + '</div>' +
      '<div class="when" id="currentWhen">' + formatWhen(booking.start_at, booking.end_at) + '</div></div></div>' +
      '<button type="button" class="btn orange" id="startRescheduleBtn">Reschedule</button>' +
      '<button type="button" class="btn danger" id="startCancelBtn">Cancel this booking</button>' +
      '<div id="rescheduleStep">' +
      '  <label style="display:block; font-size:13px; color:var(--text-dim); margin:20px 0 6px;">Choose a new date</label>' +
      '  <div class="date-row" id="dateRow"></div>' +
      '  <label style="display:block; font-size:13px; color:var(--text-dim); margin:0 0 6px;">Choose a new time</label>' +
      '  <div class="slots-grid" id="slotsGrid"></div>' +
      '  <div class="slots-empty" id="slotsEmpty" style="display:none;">No open times this day. Try another date.</div>' +
      '  <button type="button" class="btn ghost" id="cancelRescheduleBtn">Never mind</button>' +
      '</div>' +
      '<div id="confirmStep">' +
      '  <p style="text-align:center; color:var(--text-dim); font-size:14.5px; margin-top:20px;">Are you sure? This can\'t be undone. You\'ll need to book a new time if you change your mind.</p>' +
      '  <button type="button" class="btn danger" id="confirmCancelBtn">Yes, cancel it</button>' +
      '  <button type="button" class="btn ghost" id="backOutBtn">Never mind, keep it</button>' +
      '</div>'
    );

    const durationMinutes = Math.round((new Date(booking.end_at) - new Date(booking.start_at)) / 60000);
    let selectedSlot = null;

    function renderDateRow() {
      const el = document.getElementById('dateRow');
      const today = todayDateStrInBusinessTz();
      let html = '';
      for (let i = 0; i < DAYS_AHEAD_SHOWN; i++) {
        const dateStr = addDaysToDateStr(today, i);
        const noonUtc = zonedTimeToUtc(dateStr, 12, 0);
        const dow = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, weekday: 'short' }).format(noonUtc);
        const dom = new Intl.DateTimeFormat('en-US', { timeZone: BUSINESS_TIMEZONE, day: 'numeric' }).format(noonUtc);
        html += '<button type="button" class="date-btn" data-date="' + dateStr + '"><div class="dow">' + dow + '</div><div class="dom">' + dom + '</div></button>';
      }
      el.innerHTML = html;
      el.querySelectorAll('.date-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { selectDate(btn.dataset.date); });
      });
    }

    async function selectDate(dateStr) {
      selectedSlot = null;
      document.querySelectorAll('.date-btn').forEach(function (b) { b.classList.toggle('is-selected', b.dataset.date === dateStr); });
      const grid = document.getElementById('slotsGrid');
      const emptyEl = document.getElementById('slotsEmpty');
      grid.innerHTML = '<p style="color:var(--text-dim); font-size:13px;">Loading times...</p>';
      emptyEl.style.display = 'none';

      let existingBookings;
      try {
        existingBookings = await fetchBookingsForDate(dateStr, booking.start_at);
      } catch (e) {
        grid.innerHTML =
          '<p style="color:#ff8a80; font-size:13.5px; text-align:center; grid-column:1/-1;">Couldn\'t load available times. Check your connection and try again.</p>' +
          '<button type="button" class="btn-retry" id="retryDateBtn">' + svgIcon('<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>') + 'Try again</button>';
        document.getElementById('retryDateBtn').addEventListener('click', function () { selectDate(dateStr); });
        return;
      }
      const slots = computeSlotsForDate(dateStr, durationMinutes, existingBookings);

      if (slots.length === 0) {
        grid.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
      }
      grid.innerHTML = slots.map(function (s, i) { return '<button type="button" class="slot-btn" data-idx="' + i + '">' + s.label + '</button>'; }).join('');
      grid.querySelectorAll('.slot-btn').forEach(function (btn, i) {
        btn.addEventListener('click', async function () {
          selectedSlot = slots[i];
          grid.querySelectorAll('.slot-btn').forEach(function (b) { b.classList.remove('is-selected'); });
          btn.classList.add('is-selected');

          btn.disabled = true;
          const result = await callRpc('reschedule_booking_by_token', { p_token: token, p_new_start: selectedSlot.startUtc.toISOString() });
          const row = result && result[0];
          if (row && row.ok) {
            renderState(
              '<div class="state-msg"><div class="checkmark" aria-hidden="true">&#10003;</div><p>Your booking has been rescheduled.</p></div>' +
              '<div class="booking-card">' + serviceHexIcon(booking.service_label) + '<div><div class="svc">' + escapeHtml(booking.service_label) + '</div>' +
              '<div class="when">' + formatWhen(selectedSlot.startUtc.toISOString(), selectedSlot.endUtc.toISOString()) + '</div></div></div>'
            );
          } else if (row && row.message === 'slot-taken') {
            btn.disabled = false;
            await selectDate(dateStr);
            document.getElementById('slotsEmpty').insertAdjacentHTML('beforebegin', '<p class="slots-empty" style="color:#ff8a80;">That time was just taken. Please pick another.</p>');
          } else {
            btn.disabled = false;
            alert('Something went wrong. Please call us at (435) 414-1667.');
          }
        });
      });
    }

    document.getElementById('startRescheduleBtn').addEventListener('click', function () {
      document.getElementById('startRescheduleBtn').style.display = 'none';
      document.getElementById('startCancelBtn').style.display = 'none';
      document.getElementById('rescheduleStep').classList.add('is-active');
      renderDateRow();
      selectDate(todayDateStrInBusinessTz());
    });
    document.getElementById('cancelRescheduleBtn').addEventListener('click', function () {
      document.getElementById('rescheduleStep').classList.remove('is-active');
      document.getElementById('startRescheduleBtn').style.display = '';
      document.getElementById('startCancelBtn').style.display = '';
    });

    document.getElementById('startCancelBtn').addEventListener('click', function () {
      document.getElementById('startCancelBtn').style.display = 'none';
      document.getElementById('startRescheduleBtn').style.display = 'none';
      document.getElementById('confirmStep').classList.add('is-active');
    });
    document.getElementById('backOutBtn').addEventListener('click', function () {
      document.getElementById('confirmStep').classList.remove('is-active');
      document.getElementById('startCancelBtn').style.display = '';
      document.getElementById('startRescheduleBtn').style.display = '';
    });
    document.getElementById('confirmCancelBtn').addEventListener('click', async function () {
      const btn = document.getElementById('confirmCancelBtn');
      btn.disabled = true;
      btn.textContent = 'Cancelling...';
      const result = await callRpc('cancel_booking_by_token', { p_token: token });
      const row = result && result[0];
      if (row && row.ok) {
        renderState(
          '<div class="state-msg"><div class="checkmark" aria-hidden="true">&#10003;</div><p>Your booking has been cancelled.</p></div>' +
          '<a href="/booking.html" class="btn orange">Book a new appointment</a>'
        );
      } else if (row && row.message === 'already-cancelled') {
        renderState('<div class="state-msg"><p>This booking was already cancelled.</p></div><a href="/booking.html" class="btn orange">Book a new appointment</a>');
      } else {
        renderState('<div class="state-msg is-error"><p>Something went wrong cancelling this booking. Please call us at (435) 414-1667.</p></div>');
      }
    });
  }

  async function init() {
    const token = getTokenFromUrl();
    if (!token) { renderNoToken(); return; }

    const result = await callRpc('get_booking_by_cancel_token', { p_token: token });
    if (!result || !result.length) { renderNotFound(); return; }
    renderBooking(result[0], token);
  }

  init();
})();
</script>
