<!DOCTYPE html>
<!-- background-color, not the background shorthand (2026-09-06): the
     shorthand also resets background-image, which silently cancelled the
     ambient gradient tools/styles-tools.css defines on this element --
     rendered fine in isolation and never caught by any test, but never
     actually visible on a real tool page. Fixed here rather than dropping
     the inline value: it still paints dark before CSS parses, which is
     the whole reason it exists (see color-scheme below on pages that have
     it) -- it just no longer overrides a property it never meant to touch.
     Portal pages carry the identical inline value for the same FOUC
     reason, but their own ambient gradient lives on body.portal-page, not
     html, so it was never at risk from this -- fixed for consistency and
     to remove the same latent hazard before anything ever puts a
     background-image on html here too. -->
<!-- Retired 2026-09-21: POS is now the "Quick charge" tab inside the
     Invoice Generator (/tools/invoice-generator.html#pos) -- same
     permission (can_manage_invoices), same charge flow and saved-card
     lookup, same Income entry, one fewer page in the nav. This stub
     keeps old bookmarks and any stale link working -- same pattern as
     calendar.html / job-cost-lookup.html / expense-logger.html /
     contact-card.html. -->
<html lang="en" style="background-color:#0a0a0a;">
<head>
<script src="/tools/auth.js?v=266d22bc09"></script>
<script>
  // Security gate -- redirect to login before this page's own content
  // is meaningfully usable. See auth.js for why this exists (a small,
  // role-based multi-user system now -- account_roles/role_definitions,
  // not a single shared account).
  requireAuth();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>POS | Triple H Enterprises (Internal Tool)</title>
<meta http-equiv="refresh" content="0; url=/tools/invoice-generator.html#pos">
<link rel="canonical" href="/tools/invoice-generator.html#pos">
<script>location.replace('/tools/invoice-generator.html#pos');</script>
</head>
<body>
<p>POS now lives on the <a href="/tools/invoice-generator.html#pos">Invoice Generator</a> page, as the "Quick charge" tab next to Invoice and Quote / Estimate.</p>
</body>
</html>
