<!-- background-color, not the background shorthand (2026-09-06): the
     shorthand also resets background-image, which silently cancelled the
     ambient gradient tools/styles-tools.css defines on this element --
     rendered fine in isolation and never caught by any test, but never
     actually visible on a real tool page. Fixed here rather than dropping
     the inline value: it still paints dark before CSS parses, which is
     the whole reason it exists (see color-scheme below on pages that have
     it) -- it just no longer overrides a property it never meant to touch.
     Portal pages carry the identical inline value for the same FOUC
     reason, but their own ambient gradient lives on body.portal-page, not
     html, so it was never at risk from this -- fixed for consistency and
     to remove the same latent hazard before anything ever puts a
     background-image on html here too. -->

<style>
  /* Cross-document view transitions (2026-09-21) -- same pattern
     already proven in portal/*.html: keeps the old page's visual
     snapshot on screen while the next page loads instead of a
     blank flash, and (since tools-nav-pwa.js's sidebar/bottom-nav
     markup is byte-identical across every tools/ page and carries
     a matching view-transition-name in styles-tools.css) the shell
     itself reads as staying in place rather than crossfading.
     Supported in Chrome/Edge 126+ and Safari 18.2+; unsupported
     browsers just navigate exactly as before -- pure progressive
     enhancement. Both the origin and destination page must opt in
     for a transition to happen, so this needs adding to every
     tools/ page, not just one. */
  @view-transition {
    navigation: auto;
  }
  body { max-width: 720px; margin: 0 auto; }
  .realtime-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-dim); }
  .realtime-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  .realtime-dot.is-live { background: #4caf50; }
  .realtime-dot.is-connecting { background: var(--orange-light); }
  .realtime-dot.is-error { background: #e05252; }
  .hub-sub { margin: 4px 0 0; }
  /* Desktop layout (2026-08-20), requested directly: efficient on
     phone stays exactly as it was (nothing below 1024px changes at
     all) -- this only widens the container on a real desktop-size
     screen. */
  @media (min-width: 1024px) { body { max-width: var(--tool-maxw-narrow); margin-left: calc(240px + max(0px, (100vw - 240px - var(--tool-maxw-narrow)) / 2)); padding-top: 75px; } }

  .job-hero {
    background: linear-gradient(180deg, var(--bg-panel-3), var(--bg-panel-2));
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px 20px; margin-bottom: 18px;
  }
  .job-hero-title { font-family:var(--font-display); font-size: 22px; color: var(--white); letter-spacing: .3px; }
  .job-hero-meta { color: var(--text-dim); font-size: 13.5px; margin-top: 6px; line-height: 1.6; }
  .job-hero-meta a { color: var(--orange-light); text-decoration: none; }
  .job-hero-badges { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .job-hero-actions { margin-top: 14px; }
  /* The job's next steps, one tap each (2026-09-22, Workspace rework
     part 3) -- same labelled round buttons as a client's page. */
  .job-quick-actions { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; margin-top: 16px; }
  .job-quick-action {
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px;
    border-radius: 12px; background: var(--bg-panel-2); border: 1px solid var(--border);
    color: var(--text); text-decoration: none; font-family: var(--font-ui); font-size: 12.5px; font-weight: 600;

  .job-quick-action .th-icon { width: 20px; height: 20px; margin-right: 0; color: var(--orange-light); }
  .job-quick-action:hover, .job-quick-action:focus-visible { border-color: var(--orange-light); }
  .job-quick-action:active { transform: scale(.97); }
  .job-hero-actions .primary-btn:disabled { opacity: .6; cursor: default; }
  /* Real, small gap found and fixed (2026-09-07): job-tracker.html's own
     card already shows a job's 30-day labor warranty countdown once
     it's Done, but this dedicated detail page for that exact same job
     never did -- despite being the single most complete, natural place
     to check a job's current status. Same classes/logic as
     job-tracker.html's warrantyBadgeHtml(), not a separate rule. */
  /* Priority / status badges (2026-09-22): this page rendered them with
     only the warranty colours below, so "high" and "Not Started" showed
     as plain words. Same look as Job Tracker's cards. */
  .badge { font-size: 10.5px; padding: 3px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
  .badge-high { background: rgba(224,82,82,0.15); color: #e05252; }
  .badge-medium { background: rgba(224,123,30,0.15); color: var(--orange-light); }
  .badge-low { background: rgba(58,160,255,0.15); color: var(--blue-light); }
  .badge-status { background: var(--bg-panel-2); color: var(--text-dim); }
  .badge-status.status-in-progress { background: rgba(58,160,255,0.1); color: var(--blue-light); }
  .badge-status.status-done { background: rgba(76,175,80,0.12); color: #6fcf97; }
  .badge-warranty.is-active { background: rgba(76,175,80,0.15); color: #4caf50; }
  .badge-warranty.is-expired { background: var(--bg-panel-2); color: var(--text-dim); }
  .job-stat-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .job-stat { flex: 1; min-width: 100px; background: var(--bg-panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .job-stat-value { font-family:var(--font-ui); font-weight: 700; font-size: 20px; color: var(--white); }
  .job-stat-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

  .job-record-row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 13.5px;
  }
  .job-record-row:last-child { border-bottom: none; }
  .job-record-title { color: var(--white); }
  .job-record-meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .job-record-amount { color: var(--orange-light); font-weight: 600; flex-shrink: 0; }

  .job-photo-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .job-photo-thumb { width: 96px; height: 96px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; }
  .job-photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* The job's tracker (2026-09-22, Workspace rework part 5): five hex dots
     on one line, filled up to where the job is, a ring on the next step,
     and the whole track turns green once it's paid. */
  .job-track {
    list-style: none; margin: 18px 0 0; padding: 0;
    display: grid; grid-template-columns: repeat(var(--steps, 5), minmax(0, 1fr));
    position: relative;
  }
  .job-track:has(> :nth-child(3):last-child) { --steps: 3; }
  .job-track-step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; }
  .job-track-step + .job-track-step::before {
    content: ''; position: absolute; top: 8px; right: 50%; width: 100%; height: 2px;
    background: var(--border); z-index: 0;
  }
  .job-track-step.is-reached + .job-track-step.is-reached::before,
  .job-track-step.is-reached + .job-track-step.is-current::before { background: linear-gradient(90deg, var(--orange), var(--orange-light)); }
  .job-track-dot {
    position: relative; z-index: 1; width: 18px; height: 18px; clip-path: var(--hex);
    background: var(--bg-panel-2); box-shadow: inset 0 0 0 2px var(--border);
  }
  .job-track-step.is-reached .job-track-dot { background: linear-gradient(165deg, var(--orange-light), var(--orange) 70%); box-shadow: none; }
  .job-track-step.is-current .job-track-dot { background: var(--bg-panel); box-shadow: inset 0 0 0 3px var(--orange-light); animation: jobTrackPulse 1.8s ease-in-out infinite; }
  .job-track-label { font-family: var(--font-ui); font-size: 11.5px; font-weight: 600; letter-spacing: .3px; color: var(--text-dim); white-space: nowrap; }
  .job-track-step.is-reached .job-track-label { color: var(--text); }
  .job-track-step.is-current .job-track-label { color: var(--orange-light); }
  .job-track.is-complete .job-track-step .job-track-dot { background: linear-gradient(165deg, #8fe0a8, #4caf78 70%); }
  .job-track.is-complete .job-track-step + .job-track-step::before { background: #4caf78; }
  @keyframes jobTrackPulse { 50% { transform: scale(1.18); } }
  @media (prefers-reduced-motion: reduce) { .job-track-step.is-current .job-track-dot { animation: none; } }

  .job-next {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-top: 14px; padding: 12px 14px; border-radius: 12px;
    background: var(--bg-panel-2); border: 1px solid var(--border);
  }
  .job-next-text { color: var(--text-dim); font-size: 13.5px; line-height: 1.5; }
  .job-next-text strong { color: var(--white); }
  .job-next.is-todo { border-color: var(--orange-tint-border); background: var(--orange-tint-soft); }
  .job-next.is-late { border-color: rgba(224,82,82,.45); background: rgba(224,82,82,.08); }
  .job-next.is-late .job-next-text strong { color: #e05252; }
  .job-next.is-paid .job-next-text strong { color: #6fcf97; }
  .job-next-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .job-next-btn { text-decoration: none; display: inline-flex; align-items: center; min-height: 40px; padding: 8px 16px; width: auto; }

  /* The job's clock (2026-09-23, Workspace rework part 9). */
  .job-clock {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-top: 12px; padding: 12px 14px; border-radius: 12px;
    background: var(--bg-panel-2); border: 1px solid var(--border);
  }
  .job-clock-info { min-width: 0; flex: 1 1 200px; }
  .job-clock-sub { color: var(--text-dim); font-size: 13.5px; line-height: 1.5; }
  .job-clock-sub strong { color: var(--white); }
  .job-clock-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 18px; width: auto; }
  .job-clock-btn .th-icon { width: 14px; height: 14px; margin: 0; }
  .job-clock.is-running { border-color: var(--orange-dark); background: var(--orange-tint-soft); }
  .job-clock-face { display: flex; align-items: center; gap: 10px; }
  .job-clock-time { font-size: 34px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--white); }
  .job-clock-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--orange); animation: th-clock-pulse 1.6s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) { .job-clock-dot { animation: none; } }
</style>

<body>

<!-- Bug fix (2026-09-22): jobDetailView (the whole page, including the
     header) stays display:none until the async job lookup resolves, and
     jobNotFound only appears if that lookup comes back empty -- so on a
     slow or currently-unreachable connection (initSyncOnLoad() can take
     several real seconds to give up and reject, confirmed with a real
     headless Chromium with the network fully blocked), there was nothing
     on screen at all: no header, no message, no spinner. This standalone
     loading state is visible from the very first paint and is the only
     thing this fix adds -- it does not change when jobDetailView/
     jobNotFound themselves show or hide (detail-pages-realtime.test.js
     pins that toggle for the live-deletion case), it just covers the gap
     before either of them has been decided. -->
<div id="jobLoadingState" style="text-align:center; padding:60px 20px; color:var(--text-dim); font-size:14px;">Loading job&hellip;</div>

<div id="jobDetailView" style="display:none;">
  <div class="hub-header">
    <div class="hub-header-left">
      <img src="/images/logo-signature-orange.webp?v=202608142300" alt="Triple H Enterprises">
      <span class="hub-title">Job</span>
    </div>
    <div class="hub-header-right">
      <a href="/tools/job-tracker.html" class="help-btn" aria-label="Back to Job Tracker" title="Back to Job Tracker" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">&#8617;</a>
    </div>
  </div>
  <p class="hub-sub"><span class="realtime-badge" id="realtimeBadge" onclick="retryLiveSync()" title="Live sync" style="margin-left:0;"><span class="realtime-dot" id="realtimeDot"></span><span id="realtimeText">Live sync: connecting...</span></span></p>

  <div id="jobContent"></div>
</div>

<div id="jobNotFound" style="display:none; text-align:center; padding:60px 20px;">
  <div style="color:var(--text-dim); font-size:14px; margin-bottom:16px;">Job not found. It may have been deleted, or the link is out of date.</div>
  <a href="/tools/job-tracker.html" class="secondary-btn" style="text-decoration:none;">Back to Job Tracker</a>
</div>

<script>
  const STATUS_LABEL = { 'not-started': 'Not Started', 'in-progress': 'In Progress', 'done': 'Done' };
  let currentJobId = null;
  let currentJobPhotos = [];

  document.addEventListener('DOMContentLoaded', async () => {
    if (typeof initSyncOnLoad === 'function') { try { await initSyncOnLoad(); } catch (e) { /* renders with whatever local data exists */ } }

    currentJobId = new URLSearchParams(window.location.search).get('id');
    const bundle = (currentJobId && typeof thGetJobBundle === 'function') ? thGetJobBundle(currentJobId) : null;
    document.getElementById('jobLoadingState').style.display = 'none';

    // Wired up BEFORE the not-found check below (2026-08-27, real gap
    // found and fixed, same as client-detail.html) -- a user landing
    // here for a job that just hasn't synced to this device yet would
    // otherwise never get pull-to-refresh at all, right when they'd
    // most want to retry. onJobRealtimeChange already re-checks the
    // bundle and switches views correctly either way.
    if (typeof setupPullToRefresh === 'function') setupPullToRefresh(onJobRealtimeChange);

    if (!bundle) {
      document.getElementById('jobNotFound').style.display = '';
      return;
    }
    document.getElementById('jobDetailView').style.display = '';
    renderJobDetail(bundle);
    loadPhotosReadOnly(currentJobId);

    if (typeof startRealtimeSync === 'function') {
      startRealtimeSync(onJobRealtimeChange, updateRealtimeBadge);
    }
    window.addEventListener('th-clock-change', onJobRealtimeChange);
    window.addEventListener('th-invoice-reminded', onJobRealtimeChange);
    window.addEventListener('th-job-texted', onJobRealtimeChange);
  });

  function updateRealtimeBadge(status) {
    const dot = document.getElementById('realtimeDot');
    const text = document.getElementById('realtimeText');
    const badge = document.getElementById('realtimeBadge');
    if (!dot || !text) return;
    dot.className = 'realtime-dot';
    if (status === 'SUBSCRIBED') {
      dot.classList.add('is-live');
      text.textContent = 'Live sync active';
    } else if (status === 'unavailable') {
      dot.classList.add('is-error');
      text.textContent = 'Live sync unavailable';
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED' || status === 'timeout') {
      dot.classList.add('is-error');
      text.textContent = 'Live sync disconnected';
    } else {
      dot.classList.add('is-connecting');
      text.textContent = 'Live sync: connecting...';
    }
    if (badge) badge.classList.toggle('is-retryable', dot.classList.contains('is-error'));
  }

  // Re-checks this specific job against the freshly-pulled data on any
  // remote change -- not just re-rendering blindly, since the one
  // genuinely new scenario live sync introduces here is the job having
  // been deleted by someone else while this page was open. Photos
  // aren't re-fetched here: th_job_photos isn't part of workspace_sync
  // at all, so a workspace_sync change event says nothing about
  // whether photos changed.
  function onJobRealtimeChange() {
    const bundle = (currentJobId && typeof thGetJobBundle === 'function') ? thGetJobBundle(currentJobId) : null;
    if (!bundle) {
      document.getElementById('jobDetailView').style.display = 'none';
      document.getElementById('jobNotFound').style.display = '';
      return;
    }
    renderJobDetail(bundle);
  }

  // Identical logic to job-tracker.html's own warrantyBadgeHtml() --
  // same 30-day-from-job.date rule, not a second, potentially-drifting
  // copy of the business rule itself.
  function warrantyBadgeHtml(job) {
    if (job.status !== 'done' || !job.date) return '';
    const completionDate = new Date(job.date + 'T00:00:00');
    if (isNaN(completionDate.getTime())) return '';
    const today = new Date(new Date().toDateString());
    const daysSince = Math.round((today - completionDate) / (24 * 60 * 60 * 1000));
    const daysLeft = 30 - daysSince;
    if (daysLeft >= 0) {
      return '<span class="badge badge-warranty is-active" title="30-day labor warranty, based on this job\'s date">Warranty: ' + daysLeft + ' day' + (daysLeft === 1 ? '' : 's') + ' left</span>';
    }
    return '<span class="badge badge-warranty is-expired" title="30-day labor warranty, based on this job\'s date">Warranty expired</span>';
  }

  function renderJobDetail(bundle) {
    const j = bundle.job;
    document.title = j.title + ' | Triple H Enterprises (Internal Tool)';

    const dateDisplay = j.date ? new Date(j.date + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : 'No date set';
    const metaParts = [dateDisplay];
    if (j.address) metaParts.push(escapeHtml(j.address));

    let clientLine = '';
    if (bundle.client) {
      clientLine = '<a href="/tools/client-detail.html?id=' + encodeURIComponent(bundle.client.id) + '">' + escapeHtml(bundle.client.name) + '</a>';
    } else if (j.client) {
      clientLine = escapeHtml(j.client); // no registry match yet -- plain text rather than a broken link
    }
    if (clientLine) metaParts.push(clientLine);
    if (j.phone) metaParts.push('<a href="tel:' + escapeAttr(j.phone) + '">' + escapeHtml(j.phone) + '</a>');

    const marginHtml = bundle.margin.hasInvoice
      ? (bundle.margin.margin >= 0 ? '+' : '') + money(bundle.margin.margin)
      : '\u2014';

    // Call / Text / Directions / Invoice / Expense -- each one appears only
    // when it can do something (a phone, an address, the permission).
    const phoneDigits = j.phone ? String(j.phone).replace(/[^\d+]/g, '') : '';
    const allowed = (fn) => typeof window[fn] !== 'function' || window[fn]() || !(typeof getCurrentUserRole === 'function' && getCurrentUserRole());
    const quick = [];
    if (phoneDigits) {
      quick.push(['tel:' + phoneDigits, 'phone', 'Call']);
      quick.push(['sms:' + phoneDigits, 'message', 'Text']);
    }
    if (j.address) quick.push(['https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(j.address), 'navigate', 'Directions', true]);
    if (allowed('canManageInvoices')) quick.push(['/tools/invoice-generator.html?jobRef=' + encodeURIComponent(j.id), 'receipt', 'Invoice']);
    if (allowed('canViewFinance')) quick.push(['/tools/finance.html?job=' + encodeURIComponent(j.id) + '#expenses', 'camera', 'Expense']);
    const attr = typeof escapeAttr === 'function' ? escapeAttr : escapeHtml;
    const quickHtml = quick.length
      ? '<div class="job-quick-actions">' + quick.map(([href, icon, label, external]) =>
          // Text opens the client text sheet (2026-09-23, rework part 12);
          // its sms: href is the fallback where the sheet can't open.
          '<a class="job-quick-action" href="' + attr(href) + '"' + (external ? ' target="_blank" rel="noopener"' : '') + (label === 'Text' ? ' data-text-job="' + attr(j.id) + '"' : '') + '>' +
            '<svg class="th-icon" aria-hidden="true"><use href="#icon-' + icon + '" xlink:href="#icon-' + icon + '"></use></svg>' + label + '</a>'
        ).join('') + '</div>'
      : '';

    let html = '<div class="job-hero">' +
      '<div class="job-hero-title">' + escapeHtml(j.title) + '</div>' +
      '<div class="job-hero-meta">' + metaParts.join(' &middot; ') + '</div>' +
      '<div class="job-hero-badges">' +
        '<span class="badge badge-' + escapeHtml(j.priority || 'medium') + '">' + escapeHtml(j.priority || 'medium') + '</span>' +
        '<span class="badge badge-status status-' + escapeHtml(j.status || 'not-started') + '">' + (STATUS_LABEL[j.status] || j.status || 'Not Started') + '</span>' +
        warrantyBadgeHtml(j) +
      '</div>' +
      jobTrackHtml(bundle, allowed) +
      jobClockHtml(j) +
      quickHtml +
      '<div class="job-stat-row">' +
        '<div class="job-stat"><div class="job-stat-value">' + money(bundle.margin.revenue) + '</div><div class="job-stat-label">Revenue</div></div>' +
        '<div class="job-stat"><div class="job-stat-value">' + money(bundle.margin.cost) + '</div><div class="job-stat-label">Cost</div></div>' +
        '<div class="job-stat"><div class="job-stat-value">' + marginHtml + '</div><div class="job-stat-label">Margin</div></div>' +
      '</div>' +
      // U16 fix (High-Impact Upgrades, 2026-09-07): "a leave-behind job
      // sheet... essentially nobody in this trade does this." Only
      // offered once a job is Done -- a sheet summarizing work not yet
      // finished doesn't make sense, and warrantyBadgeHtml() above
      // already gates the warranty line the same way.
      (j.status === 'done'
        ? '<div class="job-hero-actions"><button type="button" class="primary-btn" id="generateJobSheetBtn" onclick="generateJobSheet()">Generate Job Sheet</button></div>'
        : '') +
    '</div>';

    if (j.notes) {
      html += '<div class="section-block"><div class="section-heading is-static"><span>Notes</span></div><div style="color:var(--text);font-size:13.5px;line-height:1.6;">' + escapeHtml(j.notes) + '</div></div>';
    }

    html += jobTimeSectionHtml(j);

    html += renderRecordSection('Invoices', bundle.linkedInvoices.map(i => ({
      title: 'Invoice ' + (i.invoiceNumber || ''), meta: (i.date || '') + ' \u00b7 ' + invoiceStatusWord(i),
      amount: money(i.total || 0), href: '/tools/invoice-generator.html?search=' + encodeURIComponent(j.client || '') + '#recent',
    })), 'No invoice linked to this job yet.');

    html += renderRecordSection('Quotes', bundle.linkedQuotes.map(q => ({
      title: 'Quote ' + (q.quoteNumber || ''), meta: q.date || '',
      amount: money(q.total || 0), href: '/tools/invoice-generator.html?search=' + encodeURIComponent(j.client || '') + '#recent',
    })), 'No quote linked to this job yet.');

    // Real bug (2026-09-22): expenses are logged as { desc, vendor, type }
    // (finance.html addEntry), never description/category, so every row
    // here read just "Expense".
    html += renderRecordSection('Expenses', bundle.linkedExpenses.map(e => ({
      title: e.desc || e.vendor || (e.type === 'mileage' ? 'Mileage' : 'Expense'), meta: [e.date, e.desc && e.vendor ? e.vendor : '', e.type === 'mileage' && e.miles ? e.miles + ' mi' : ''].filter(Boolean).join(' \u00b7 '),
      amount: money(e.amount || 0), href: '/tools/finance.html#expenses',
    })), 'No expenses logged against this job yet.', '/tools/finance.html?job=' + j.id + '#expenses');

    html += '<div class="section-block"><div class="section-heading is-static"><span>Photos</span></div><div class="job-photo-grid" id="jobPhotosGrid"><div class="empty-state-small"><svg class="th-icon" aria-hidden="true"><use href="#icon-camera" xlink:href="#icon-camera"></use></svg>Loading...</div></div></div>';

    // Real bug (2026-09-23): a re-render (live sync, or now the clock's
    // Start / Stop) rebuilt the Photos grid as "Loading..." and nothing
    // loaded it again. The grid already loaded is carried across.
    const oldGrid = document.getElementById('jobPhotosGrid');
    const loadedPhotos = oldGrid && oldGrid.dataset.loaded ? oldGrid.innerHTML : null;
    document.getElementById('jobContent').innerHTML = html;
    if (loadedPhotos !== null) {
      const grid = document.getElementById('jobPhotosGrid');
      grid.innerHTML = loadedPhotos;
      grid.dataset.loaded = '1';
    }
    syncJobClockTick();
  }

  // Paid / Part paid / Unpaid from paidAmount first, the same rule as every
  // other money view (thInvoicePaidAmount); `paid` alone was wrong for any
  // invoice with a partial payment, or marked unpaid again on the Dashboard.
  function invoiceStatusWord(inv) {
    if (typeof thInvoiceBalance !== 'function') return inv.paid ? 'Paid' : 'Unpaid';
    if (thInvoiceBalance(inv) <= 0 && (Number(inv.total) || 0) > 0) return 'Paid';
    if (thInvoicePaidAmount(inv) > 0) return 'Part paid';
    return typeof thInvoiceIsOverdue === 'function' && thInvoiceIsOverdue(inv) ? 'Overdue' : 'Unpaid';
  }

  // The job's clock (2026-09-23, Workspace rework part 9). Start it when
  // the work starts; Stop saves the time onto the job (hoursWorked, plus a
  // visit in timeLog), which is what the invoice's Labor line is filled
  // from. This is the one write the page makes itself, through the same
  // data-layer.js helpers as the shell's On the clock bar.
  function jobClockHtml(j) {
    if (typeof thJobClockSince !== 'function' || typeof thStartClock !== 'function') return '';
    const since = thJobClockSince(j);
    const logged = Number(j.hoursWorked) || 0;
    const icon = (name) => '<svg class="th-icon" aria-hidden="true"><use href="#icon-' + name + '" xlink:href="#icon-' + name + '"></use></svg>';
    if (since !== null) {
      const started = new Date(since).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      return '<div class="job-clock is-running" data-since="' + escapeHtml(j.clockSince) + '">' +
        '<div class="job-clock-info">' +
          '<div class="job-clock-face"><span class="job-clock-dot" aria-hidden="true"></span><span class="job-clock-time">' + thFormatClock(thJobClockElapsedMs(j)) + '</span></div>' +
          '<div class="job-clock-sub">On the clock since ' + started + (logged ? ' &middot; ' + thClockHoursLabel(logged) + ' before this' : '') + '</div>' +
        '</div>' +
        '<button type="button" class="primary-btn job-clock-btn" onclick="stopJobClockHere()">' + icon('stop') + 'Stop</button>' +
      '</div>';
    }
    if (j.status === 'done') return '';
    return '<div class="job-clock">' +
      '<div class="job-clock-info"><div class="job-clock-sub">' +
        (logged ? '<strong>' + thClockHoursLabel(logged) + '</strong> logged so far.' : 'Time it as you work, and the invoice&rsquo;s labor line fills itself in.') +
      '</div></div>' +
      '<button type="button" class="secondary-btn job-clock-btn" onclick="startJobClockHere()">' + icon('play') + 'Start the clock</button>' +
    '</div>';
  }
  // Ticks only while this job's clock is on screen and running.
  let jobClockTick = null;
  function syncJobClockTick() {
    const running = !!document.querySelector('.job-clock.is-running');
    if (running && !jobClockTick) {
      jobClockTick = setInterval(() => {
        const face = document.querySelector('.job-clock.is-running');
        if (!face) { syncJobClockTick(); return; }
        if (document.visibilityState === 'hidden') return;
        face.querySelector('.job-clock-time').textContent = thFormatClock(Date.now() - new Date(face.dataset.since).getTime());
      }, 1000);
    } else if (!running && jobClockTick) {
      clearInterval(jobClockTick);
      jobClockTick = null;
    }
  }
  function startJobClockHere() {
    if (currentJobId !== null) thStartClock(currentJobId);
  }
  function stopJobClockHere() {
    if (currentJobId !== null) thStopClock(currentJobId);
  }
  // Each visit the clock timed: its day, from-to, and hours.
  function jobTimeSectionHtml(j) {
    const log = (Array.isArray(j.timeLog) ? j.timeLog : []).filter(v => v && v.start && v.end);
    if (!log.length) return '';
    const day = (d) => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const time = (d) => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const rows = log.slice().reverse().map(v => {
      const a = new Date(v.start), b = new Date(v.end);
      return '<div class="job-record-row">' +
        '<div><div class="job-record-title">' + escapeHtml(day(a)) + '</div><div class="job-record-meta">' + escapeHtml(time(a) + ' – ' + time(b)) + '</div></div>' +
        '<div class="job-record-amount">' + thClockHoursLabel(v.hours) + '</div>' +
      '</div>';
    }).join('');
    const total = log.reduce((sum, v) => sum + (Number(v.hours) || 0), 0);
    return '<div class="section-block"><div class="section-heading is-static"><span>Time (' + log.length + ' visit' + (log.length === 1 ? '' : 's') + ' &middot; ' + thClockHoursLabel(total) + ')</span></div>' + rows + '</div>';
  }

  // The job's tracker (2026-09-22, Workspace rework part 5): Booked ->
  // Working -> Done -> Invoiced -> Paid, from thJobSteps(), then one line
  // saying what happens next with the button for it. This page stays
  // read-only; every button is a link into the page that owns the write.
  function jobTrackHtml(bundle, allowed) {
    if (!bundle.money || typeof thJobSteps !== 'function') return '';
    const j = bundle.job;
    const m = bundle.money;
    const track = thJobSteps(j, m);
    const allDone = track.current === null;
    const steps = track.steps.map(st => {
      const cls = st.reached ? ' is-reached' : (st.key === track.current ? ' is-current' : '');
      return '<li class="job-track-step' + cls + '"' + (st.key === track.current ? ' aria-current="step"' : '') + '>' +
        '<span class="job-track-dot" aria-hidden="true"></span><span class="job-track-label">' + st.label + '</span></li>';
    }).join('');
    const attr = typeof escapeAttr === 'function' ? escapeAttr : escapeHtml;
    const btn = (href, label, cls) => '<a class="' + (cls || 'primary-btn') + ' job-next-btn" href="' + attr(href) + '">' + label + '</a>';
    const invoicesHref = '/tools/invoice-generator.html?search=' + encodeURIComponent(j.client || '') + '#recent';
    let text = '', actions = '', tone = '';
    if (m.stage === 'booked') {
      const when = j.date ? new Date(j.date + 'T00:00:00') : null;
      const days = when && !isNaN(when.getTime()) ? Math.round((when - new Date(new Date().toDateString())) / 86400000) : null;
      const long = days === null ? '' : escapeHtml(when.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }));
      if (days === null) text = 'Booked, no date set yet.';
      else if (days === 0) text = '<strong>Booked for today.</strong>';
      else if (days === 1) text = 'Booked for tomorrow.';
      else if (days < 0) { tone = ' is-todo'; text = '<strong>Booked for ' + long + '</strong> and not started yet.'; }
      else text = 'Booked for ' + long + '.';
    } else if (m.stage === 'working') {
      text = 'In progress.';
    } else if (m.stage === 'to-invoice') {
      tone = ' is-todo';
      text = '<strong>Done, not invoiced yet.</strong> Bill it while the work is fresh.';
      if (allowed('canManageInvoices')) actions += btn('/tools/invoice-generator.html?jobRef=' + encodeURIComponent(j.id), 'Create invoice');
      if (allowed('canViewFinance')) actions += btn('/tools/finance.html?job=' + encodeURIComponent(j.id) + '#income', 'Paid another way', 'secondary-btn');
    } else if (m.stage === 'no-charge') {
      text = 'Done. Marked as no charge.';
    } else if (m.stage === 'invoiced' || m.stage === 'overdue') {
      const open = m.invoices.filter(inv => thInvoiceBalance(inv) > 0)
        .map(inv => ({ inv, due: thInvoiceDueDate(inv) }))
        .sort((a, b) => (a.due ? a.due.getTime() : Infinity) - (b.due ? b.due.getTime() : Infinity))[0];
      let dueText = '';
      if (open && open.due) {
        const days = Math.round((open.due - new Date(new Date().toDateString())) / 86400000);
        dueText = days < 0 ? (-days) + ' day' + (days === -1 ? '' : 's') + ' overdue' : days === 0 ? 'due today' : 'due ' + open.due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }
      tone = m.stage === 'overdue' ? ' is-late' : '';
      const reminded = open && typeof thInvoiceRemindedLabel === 'function' ? thInvoiceRemindedLabel(open.inv) : '';
      text = '<strong>' + money(m.balance) + ' owed</strong>' + (dueText ? ' &middot; ' + dueText : '') + (reminded ? ' &middot; ' + reminded.toLowerCase() : '') + '.';
      // Send a reminder (2026-09-23, rework part 10) opens the shell's
      // reminder sheet for the invoice that's due first.
      const canRemind = open && typeof thOpenReminderSheet === 'function' && typeof thInvoiceNeedsReminder === 'function' && thInvoiceNeedsReminder(open.inv);
      if (allowed('canManageInvoices') && canRemind) {
        actions += '<button type="button" class="primary-btn job-next-btn" data-remind-invoice="' + attr(open.inv.id) + '">Send a reminder</button>';
        actions += btn(invoicesHref, 'See invoice', 'secondary-btn');
      } else if (allowed('canManageInvoices')) {
        actions += btn(invoicesHref, m.stage === 'overdue' ? 'Follow up' : 'See invoice', m.stage === 'overdue' ? 'primary-btn' : 'secondary-btn');
      }
    } else if (m.stage === 'paid') {
      tone = ' is-paid';
      text = '<strong>Paid in full</strong>' + (m.billed ? ' &middot; ' + money(m.billed) : '') + '.';
    }
    return '<ol class="job-track' + (allDone ? ' is-complete' : '') + '" aria-label="Where this job is">' + steps + '</ol>' +
      '<div class="job-next' + tone + '"><div class="job-next-text">' + text + '</div>' + (actions ? '<div class="job-next-actions">' + actions + '</div>' : '') + '</div>';
  }

  function renderRecordSection(label, rows, emptyText, addHref) {
    let inner;
    if (rows.length === 0) {
      inner = '<div class="empty-state-small"><svg class="th-icon" aria-hidden="true"><use href="#icon-inbox" xlink:href="#icon-inbox"></use></svg>' + escapeHtml(emptyText) + '</div>';
    } else {
      inner = rows.map(r =>
        '<a class="job-record-row" href="' + r.href + '" style="text-decoration:none; color:inherit;">' +
          '<div><div class="job-record-title">' + escapeHtml(r.title) + '</div><div class="job-record-meta">' + escapeHtml(r.meta) + '</div></div>' +
          '<div class="job-record-amount">' + r.amount + '</div>' +
        '</a>'
      ).join('');
    }
    // Item #2 fix (2026-08-20): an optional "add new" link next to the
    // section heading -- deliberately opt-in (only Expenses uses it
    // below) rather than a change to every section's behavior, matching
    // this page's existing read-only design intent for Invoices/Quotes/
    // Photos (see the comment on loadPhotosReadOnly below for the same
    // reasoning). Directly addresses the concrete friction found while
    // investigating the Job Tracker/Finance split: logging a new
    // expense against a job you're already looking at required leaving
    // this page, landing on Finance, and re-picking the job from a
    // dropdown that has to load fresh.
    const addLink = addHref
      ? '<a href="' + addHref + '" class="help-btn" aria-label="Log an expense for this job" title="Log an expense for this job" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; margin-left:8px;">+</a>'
      : '';
    return '<div class="section-block"><div class="section-heading is-static"><span>' + label + ' (' + rows.length + ')</span>' + addLink + '</div>' + inner + '</div>';
  }

  // Read-only: view + lightbox only. Starring for the website gallery and
  // deleting a photo both still happen from Job Tracker's own Photos
  // section, which already does that well -- duplicating those actions
  // here isn't worth the added surface area for this first version.
  async function loadPhotosReadOnly(jobId) {
    await fillPhotosReadOnly(jobId);
    const grid = document.getElementById('jobPhotosGrid'); // looked up again: a re-render may have replaced it meanwhile
    if (grid) grid.dataset.loaded = '1';
  }
  async function fillPhotosReadOnly(jobId) {
    const grid = document.getElementById('jobPhotosGrid');
    if (typeof fetchJobPhotos !== 'function') { grid.innerHTML = ''; return; }
    const result = await fetchJobPhotos(jobId);
    if (!result.ok) {
      grid.innerHTML = '<div class="empty-state-small is-warning"><svg class="th-icon" aria-hidden="true"><use href="#icon-warning" xlink:href="#icon-warning"></use></svg>Couldn\'t load photos.</div>';
      return;
    }
    if (result.photos.length === 0) {
      grid.innerHTML = '<div class="empty-state-small"><svg class="th-icon" aria-hidden="true"><use href="#icon-camera" xlink:href="#icon-camera"></use></svg>No photos on this job yet.</div>';
      return;
    }
    const signedUrls = await getSignedJobPhotoUrls(result.photos.map(p => p.storage_path));
    currentJobPhotos = result.photos.map(p => ({ url: signedUrls[p.storage_path] || '', label: 'Photo' }));
    grid.innerHTML = result.photos.map((p, i) =>
      '<div class="job-photo-thumb" onclick="openPhotoLightbox(currentJobPhotos, ' + i + ')"><img src="' + (signedUrls[p.storage_path] || '') + '" alt="Job photo" loading="lazy"></div>'
    ).join('');
  }

  // ---------------------------------------------------------------------------
  // U16 fix (High-Impact Upgrades, 2026-09-07): "A leave-behind job sheet...
  // essentially nobody in this trade does this. It converts a repair into
  // evidence of competence." Generates a one-page PDF from data already
  // captured -- nothing new to enter -- and hands it over via the OS share
  // sheet (the same sharePdfOrDownload() helper the invoice/estimate PDFs
  // already use), so it can be texted, AirDropped, or emailed straight from
  // the driveway without needing an SMS provider wired in.
  //
  // PDF_COLORS/drawPdfHeader/loadImageAsDataURL are local copies of
  // invoice-generator.html's own helpers of the same name, not an import --
  // this project's PDF generators don't share a JS file yet (that
  // consolidation is its own separate, later item), so matching the same
  // values here is what keeps the two documents looking related.
  // ---------------------------------------------------------------------------
  // PDF_COLORS and drawPdfHeader now live in the shared
  // /js/pdf-layout.js (U15/W18, 2026-09-08; moved from /tools/ 2026-09-24) -- the same masthead
  // invoice-generator.html and contract-generator.html use.
  //
  // The photo loader below stays local: it needs JPEG-with-quality for
  // photographic job photos (PNG would bloat the PDF badly), a genuinely
  // different need from the shared file's PNG-only logo loader, and
  // this is the only page that embeds real photos into a PDF at all.
  function jsLoadImageAsDataURL(src, timeoutMs = 4000) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('Image load timed out')), timeoutMs);
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        clearTimeout(timer);
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => { clearTimeout(timer); reject(new Error('Image failed to load')); };
      img.src = src;
    });
  }

  async function generateJobSheet() {
    const btn = document.getElementById('generateJobSheetBtn');
    if (!btn || btn.disabled) return;
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Generating…';
    try {
      const bundle = (currentJobId && typeof thGetJobBundle === 'function') ? thGetJobBundle(currentJobId) : null;
      if (!bundle) { await showAlert('Could not load this job.'); return; }
      const j = bundle.job;

      if (!window.jspdf) { await showAlert('Still finishing loading -- give it a second and try again.'); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'letter' });
      const pageW = doc.internal.pageSize.getWidth();
      // 2026-09-24 redesign: the shared /js/pdf-layout.js document
      // system, same letterhead/footer as the invoice and contract.
      const completedDisplay = j.date
        ? new Date(j.date + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
        : '';
      let y = await drawPdfHeader(doc, pageW, 'JOB SHEET', null, {
        subtitle: j.title || '',
        meta: [{ label: 'Completed', value: completedDisplay }],
      });

      if (j.client || j.address) {
        const custLines = [];
        if (j.client) custLines.push({ text: j.client, bold: true });
        if (j.address) custLines.push(j.address);
        y = pdfDrawInfoColumns(doc, { y, columns: [{ label: 'Customer', lines: custLines }] });
      }

      if (j.notes) {
        y = pdfEnsureSpace(doc, y, 40);
        y = pdfSectionLabel(doc, 'What we did', y);
        y = pdfDrawParagraph(doc, { y, text: j.notes, size: 10, color: PDF_COLORS.INK }) + 12;
      }

      // Part(s) replaced -- linkedExpenses already carries the real part
      // number typed in at the time (see Finance/Job Tracker's expense
      // form), the same data this document promises rather than a new
      // field invented just for this PDF.
      const partRows = bundle.linkedExpenses.filter(e => e.partNumber && e.partNumber.trim());
      if (partRows.length) {
        y = drawPdfTable(doc, {
          y,
          columns: [
            { key: 'desc', label: 'Part' + (partRows.length > 1 ? 's' : '') + ' replaced', width: 0.66 },
            { key: 'part', label: 'Part #', width: 0.34, muted: true },
          ],
          rows: partRows.map(e => ({ desc: e.desc || 'Part', part: e.partNumber })),
        }) + 22;
      }

      // Before/after photos, two per row, newest-fetched order (the same
      // order Job Tracker's own Photos panel already uses).
      let photos = [];
      if (typeof fetchJobPhotos === 'function') {
        try {
          const photoResult = await fetchJobPhotos(currentJobId);
          if (photoResult.ok && photoResult.photos.length) {
            const signed = await getSignedJobPhotoUrls(photoResult.photos.map(p => p.storage_path));
            photos = photoResult.photos.map(p => ({ path: p.storage_path, type: p.photo_type, url: signed[p.storage_path] }));
          }
        } catch (e) { /* photos are optional -- the sheet still has real value without them */ }
      }
      if (photos.length) {
        const L = 48;
        const imgW = (pageW - L * 2 - 16) / 2;
        const imgH = imgW * 0.72;
        y = pdfEnsureSpace(doc, y, 20 + imgH + 16);
        y = pdfSectionLabel(doc, 'Photos', y, { after: 10 });
        let col = 0;
        for (const p of photos) {
          if (!p.url) continue;
          if (col === 0) y = pdfEnsureSpace(doc, y, imgH + 18);
          const x = L + col * (imgW + 16);
          try {
            const dataUrl = await jsLoadImageAsDataURL(p.url);
            doc.addImage(dataUrl, 'JPEG', x, y, imgW, imgH);
          } catch (e) { /* one failed photo doesn't block the rest of the sheet */ }
          if (p.type === 'before' || p.type === 'after') {
            pdfSetFont(doc, 'label', 7.5, PDF_COLORS.MUTED);
            doc.text(p.type.toUpperCase(), x, y + imgH + 11);
          }
          col++;
          if (col > 1) { col = 0; y += imgH + 22; }
        }
        if (col === 1) y += imgH + 22;
        y += 6;
      }

      // Warranty -- U17 (same finding): "state it plainly rather than
      // leave it in the contract nobody reads." Same 30-day-from-job.date
      // rule as warrantyBadgeHtml() above; the sheet states the actual
      // end date rather than a "days left" count, since that number goes
      // stale the moment this PDF is saved or printed.
      if (j.date) {
        const completionDate = new Date(j.date + 'T00:00:00');
        if (!isNaN(completionDate.getTime())) {
          const warrantyEnd = new Date(completionDate);
          warrantyEnd.setDate(warrantyEnd.getDate() + 30);
          const warrantyDisplay = warrantyEnd.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
          y = pdfDrawNoteBox(doc, { y, label: 'Warranty', tone: 'green', text: 'Covered by our 30-day labor warranty through ' + warrantyDisplay + '.' });
        }
      }

      pdfFinalize(doc, { message: 'Thank you for choosing Triple H Enterprises. If we did right by you, a quick Google review means a lot.' });

      const filename = 'TripleH_JobSheet_' + (j.title || 'Job').replace(/[^a-z0-9]/gi, '_') + '.pdf';
      if (typeof sharePdfOrDownload === 'function') {
        await sharePdfOrDownload(doc, filename, 'Job Sheet');
      } else {
        doc.save(filename);
      }
    } catch (e) {
      if (typeof logClientError === 'function') {
        logClientError('generateJobSheet() failed -- ' + (e.message || String(e)), 'job-detail.html', null, null, null);
      }
      await showAlert('Could not generate the job sheet: ' + (e.message || String(e)));
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  }
</script>

</body>
</html>
