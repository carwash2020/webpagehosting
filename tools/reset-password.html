<!DOCTYPE html>
<html lang="en" style="background:#0a0a0a;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Reset Password | Triple H Enterprises (Internal Tool)</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
<link rel="manifest" href="/tools/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triple H">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=202608201800">
<link rel="stylesheet" href="/tools/styles-tools.css?v=202608202300">
<script src="/tools/auth.js?v=202608162000"></script>
<script src="/tools/tools-effects.js?v=202608201400" defer></script>
<script src="/tools/tools-dialogs.js?v=202608201400" defer></script>
<script src="/tools/tools-media-sharing.js?v=202608201900" defer></script>
<script src="/tools/tools-nav-pwa.js?v=202608201400" defer></script>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-box { max-width: 380px; width: 100%; text-align: center; }
  .login-logo { width: 72px; height: auto; margin-bottom: 20px; }
  .login-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px; color: var(--white); margin-bottom: 6px; }
  .login-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }
  .login-field { margin-bottom: 16px; text-align: left; }
  .login-field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 5px; }
  .login-field input {
    width: 100%; padding: 11px 13px; background: var(--bg-panel-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--white); font-size: 15px; font-family: inherit; box-sizing: border-box;
  }
  .login-error { color: #e05252; font-size: 13.5px; margin: 4px 0 16px; min-height: 1px; }
  .login-btn { width: 100%; justify-content: center; }
</style>
</head>
<body>

<div class="login-box">
  <img src="/images/logo-signature-orange.webp?v=202608142300" alt="Triple H Enterprises" class="login-logo">
  <div class="login-title">Set a New Password</div>
  <div class="login-sub" id="resetSub">Checking your reset link...</div>

  <form id="resetForm" style="display:none;">
    <div class="login-field">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" autocomplete="new-password" required minlength="6">
    </div>
    <div class="login-field">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="6">
    </div>
    <div class="login-error" id="resetPwError"></div>
    <button type="submit" class="primary-btn login-btn" id="resetPwBtn">Set New Password</button>
  </form>

  <a id="backToLoginLink" href="/tools/login.html" class="secondary-btn" style="display:none; width:100%; justify-content:center; text-decoration:none; box-sizing:border-box;">Back to Sign In</a>
</div>

<script>
  // Supabase puts the recovery token in the URL FRAGMENT (#access_token=
  // ...&type=recovery), not a query string -- fragments never get sent
  // to the server, which is deliberate here since this token is
  // sensitive enough that it shouldn't ever show up in server logs.
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const recoveryToken = hashParams.get('access_token');
  const tokenType = hashParams.get('type');

  const subEl = document.getElementById('resetSub');
  const formEl = document.getElementById('resetForm');
  const backLinkEl = document.getElementById('backToLoginLink');

  if (!recoveryToken || tokenType !== 'recovery') {
    subEl.textContent = 'This reset link is invalid or has expired. Request a new one from the sign-in page.';
    backLinkEl.style.display = 'flex';
  } else {
    subEl.textContent = 'Choose a new password for your account.';
    formEl.style.display = '';

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('resetPwError');
      errorEl.textContent = '';
      const pw = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (pw !== confirm) { errorEl.textContent = "Passwords don't match."; return; }
      if (pw.length < 6) { errorEl.textContent = 'Password must be at least 6 characters.'; return; }

      const btn = document.getElementById('resetPwBtn');
      btn.disabled = true;
      btn.textContent = 'Updating...';
      const result = await updatePasswordWithRecoveryToken(recoveryToken, pw);
      btn.disabled = false;
      btn.textContent = 'Set New Password';

      if (!result.ok) { errorEl.textContent = result.error; return; }

      formEl.style.display = 'none';
      subEl.textContent = 'Password updated. You can sign in with it now.';
      backLinkEl.textContent = 'Go to Sign In';
      backLinkEl.style.display = 'flex';
    });
  }
</script>
</body>
</html>
