<!DOCTYPE html>
<!-- background-color, not the background shorthand (2026-09-06): the
     shorthand also resets background-image, which silently cancelled the
     ambient gradient tools/styles-tools.css defines on this element --
     rendered fine in isolation and never caught by any test, but never
     actually visible on a real tool page. Fixed here rather than dropping
     the inline value: it still paints dark before CSS parses, which is
     the whole reason it exists (see color-scheme below on pages that have
     it) -- it just no longer overrides a property it never meant to touch.
     Portal pages carry the identical inline value for the same FOUC
     reason, but their own ambient gradient lives on body.portal-page, not
     html, so it was never at risk from this -- fixed for consistency and
     to remove the same latent hazard before anything ever puts a
     background-image on html here too. -->
<html lang="en" style="background-color:#0a0a0a;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Reset Password | Triple H Enterprises (Internal Tool)</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
<link rel="manifest" href="/tools/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triple H">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<script>
  (function () {
    // Tools app light/dark theme (2026-08-20), tucked into Settings.
    // A separate preference from the public site's own theme toggle --
    // different audience, different devices. Defaults to dark,
    // matching the tools app's original look; applied here, before any
    // stylesheet loads, to avoid a flash of the wrong theme on load.
    var saved = localStorage.getItem('th_tools_theme');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<link rel="stylesheet" href="/styles.css?v=d9dfbf37af">
<link rel="stylesheet" href="/tools/styles-tools.css?v=802b87086c">
<script src="/tools/auth.js?v=0049ad84fb"></script>
<script src="/tools/tools-effects.js?v=4cff99aa4a" defer></script>
<script src="/tools/tools-dialogs.js?v=e1dfaa11a1" defer></script>
<script src="/tools/tools-media-sharing.js?v=0c229c9353" defer></script>
<script src="/tools/tools-nav-pwa.js?v=9b16eefb86" defer></script>
<style>
  /* iOS Safari zoom-on-focus fix (2026-09-05), same root cause and
     fix already applied to invoice-generator.html: a tapped
     input/select/textarea with a font-size under 16px triggers the
     browser's own auto-zoom. This generic rule covers every field on
     this page, including any with no explicit font-size at all
     (falling back to the browser's own sub-16px default) -- any
     more specific selector below still needs its own individual
     bump too, since a more specific selector always wins regardless
     of where either rule sits in the file. */
  input, select, textarea { font-size: 16px; }

  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-box { max-width: 380px; width: 100%; text-align: center; }
  .login-logo { width: 72px; height: auto; margin-bottom: 20px; }
  .login-title { font-family:var(--font-ui); font-weight: 700; font-size: 22px; color: var(--white); margin-bottom: 6px; }
  .login-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }
  .login-field { margin-bottom: 16px; text-align: left; }
  .login-field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 5px; }
  .login-field input {
    width: 100%; padding: 11px 13px; background: var(--bg-panel-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--white); font-size: 16px; font-family: inherit; box-sizing: border-box;
  }
  .login-error { color: #e05252; font-size: 13.5px; margin: 4px 0 16px; min-height: 1px; }
  .login-btn { width: 100%; justify-content: center; }
</style>
</head>
<body>

<div class="login-box">
  <img src="/images/logo-signature-orange.webp?v=202608142300" alt="Triple H Enterprises" class="login-logo">
  <div class="login-title">Set a New Password</div>
  <div class="login-sub" id="resetSub">Checking your reset link...</div>

  <form id="resetForm" style="display:none;">
    <div class="login-field">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" autocomplete="new-password" required minlength="6">
    </div>
    <div class="login-field">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="6">
    </div>
    <div class="login-error" id="resetPwError"></div>
    <button type="submit" class="primary-btn login-btn" id="resetPwBtn">Set New Password</button>
  </form>

  <a id="backToLoginLink" href="/tools/login.html" class="secondary-btn" style="display:none; width:100%; justify-content:center; text-decoration:none; box-sizing:border-box;">Back to Sign In</a>
</div>

<script>
  // Supabase puts the recovery token in the URL FRAGMENT (#access_token=
  // ...&type=recovery), not a query string -- fragments never get sent
  // to the server, which is deliberate here since this token is
  // sensitive enough that it shouldn't ever show up in server logs.
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const recoveryToken = hashParams.get('access_token');
  const tokenType = hashParams.get('type');

  const subEl = document.getElementById('resetSub');
  const formEl = document.getElementById('resetForm');
  const backLinkEl = document.getElementById('backToLoginLink');

  if (!recoveryToken || tokenType !== 'recovery') {
    subEl.textContent = 'This reset link is invalid or has expired. Request a new one from the sign-in page.';
    backLinkEl.style.display = 'flex';
  } else {
    subEl.textContent = 'Choose a new password for your account.';
    formEl.style.display = '';

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('resetPwError');
      errorEl.textContent = '';
      const pw = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (pw !== confirm) { errorEl.textContent = "Passwords don't match."; return; }
      if (pw.length < 6) { errorEl.textContent = 'Password must be at least 6 characters.'; return; }

      const btn = document.getElementById('resetPwBtn');
      btn.disabled = true;
      btn.textContent = 'Updating...';
      const result = await updatePasswordWithRecoveryToken(recoveryToken, pw);
      btn.disabled = false;
      btn.textContent = 'Set New Password';

      if (!result.ok) { errorEl.textContent = result.error; return; }

      formEl.style.display = 'none';
      subEl.textContent = 'Password updated. You can sign in with it now.';
      backLinkEl.textContent = 'Go to Sign In';
      backLinkEl.style.display = 'flex';
    });
  }
</script>
</body>
</html>
