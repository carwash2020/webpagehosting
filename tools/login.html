<!DOCTYPE html>
<!-- background-color, not the background shorthand (2026-09-06): the
     shorthand also resets background-image, which silently cancelled the
     ambient gradient tools/styles-tools.css defines on this element --
     rendered fine in isolation and never caught by any test, but never
     actually visible on a real tool page. Fixed here rather than dropping
     the inline value: it still paints dark before CSS parses, which is
     the whole reason it exists (see color-scheme below on pages that have
     it) -- it just no longer overrides a property it never meant to touch.
     Portal pages carry the identical inline value for the same FOUC
     reason, but their own ambient gradient lives on body.portal-page, not
     html, so it was never at risk from this -- fixed for consistency and
     to remove the same latent hazard before anything ever puts a
     background-image on html here too. -->
<html lang="en" style="background-color:#0a0a0a;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sign In | Triple H Enterprises (Internal Tool)</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
<link rel="manifest" href="/tools/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triple H">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<script>
  (function () {
    // Tools app light/dark theme (2026-08-20), tucked into Settings.
    // A separate preference from the public site's own theme toggle --
    // different audience, different devices. Defaults to dark,
    // matching the tools app's original look; applied here, before any
    // stylesheet loads, to avoid a flash of the wrong theme on load.
    var saved = localStorage.getItem('th_tools_theme');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<link rel="stylesheet" href="/styles.css?v=202609071230">
<link rel="stylesheet" href="/tools/styles-tools.css?v=8c09f591d2">
<script src="/tools/auth.js?v=7b87c4fdc1"></script>
<script src="/tools/tools-effects.js?v=4cff99aa4a" defer></script>
<script src="/tools/tools-dialogs.js?v=e1dfaa11a1" defer></script>
<script src="/tools/tools-media-sharing.js?v=269452a6d3" defer></script>
<script src="/tools/tools-nav-pwa.js?v=9b16eefb86" defer></script>
<style>
  /* iOS Safari zoom-on-focus fix (2026-09-05), same root cause and
     fix already applied to invoice-generator.html: a tapped
     input/select/textarea with a font-size under 16px triggers the
     browser's own auto-zoom. This generic rule covers every field on
     this page, including any with no explicit font-size at all
     (falling back to the browser's own sub-16px default) -- any
     more specific selector below still needs its own individual
     bump too, since a more specific selector always wins regardless
     of where either rule sits in the file. */
  input, select, textarea { font-size: 16px; }

  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-box { max-width: 380px; width: 100%; text-align: center; }
  .login-logo { width: 72px; height: auto; margin-bottom: 20px; }
  .login-title { font-family:var(--font-ui); font-weight: 700; font-size: 22px; color: var(--white); margin-bottom: 6px; }
  .login-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }
  .login-field { margin-bottom: 16px; text-align: left; }
  .login-field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 5px; }
  .login-field input {
    width: 100%; padding: 11px 13px; background: var(--bg-panel-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--white); font-size: 16px; font-family: inherit; box-sizing: border-box;
  }
  .login-error { color: #e05252; font-size: 13.5px; margin: 4px 0 16px; min-height: 1px; }
  .login-btn { width: 100%; justify-content: center; }
</style>
</head>
<body>

<div class="login-box">
  <img src="/images/logo-signature-orange.webp?v=202608142300" alt="Triple H Enterprises" class="login-logo">
  <div class="login-title">Triple H Workspace</div>
  <div class="login-sub">Sign in to continue.</div>

  <form id="loginForm">
    <div class="login-field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
    </div>
    <div class="login-field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="checkbox-row" style="margin-bottom: 18px;">
      <input type="checkbox" id="rememberMe" checked>
      <label for="rememberMe">Remember me for 30 days</label>
    </div>
    <button type="submit" class="primary-btn login-btn" id="loginBtn">Sign In</button>
    <button type="button" id="forgotPasswordLink" style="background:none; border:none; color:var(--text-dim); font-size:13px; margin-top:14px; cursor:pointer; text-decoration:underline;">Forgot password?</button>
  </form>

  <div id="forgotPasswordPanel" style="display:none; margin-top:18px; text-align:left;">
    <p style="color:var(--text-dim); font-size:13.5px; margin-bottom:12px;">Enter your email and we'll send a link to reset your password.</p>
    <div class="login-field">
      <label for="resetEmail">Email</label>
      <input type="email" id="resetEmail" autocomplete="username">
    </div>
    <div class="login-error" id="resetError"></div>
    <div id="resetSuccess" style="display:none; color:#6fcf97; font-size:13.5px; margin:4px 0 16px;">Check your email for a reset link.</div>
    <button type="button" class="secondary-btn" id="sendResetBtn" style="width:100%; justify-content:center;">Send reset link</button>
    <button type="button" id="cancelResetLink" style="background:none; border:none; color:var(--text-dim); font-size:13px; margin-top:14px; cursor:pointer; text-decoration:underline; width:100%;">Back to sign in</button>
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing In...';

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const rememberMe = document.getElementById('rememberMe').checked;
    const result = await signIn(email, password, rememberMe);

    if (!result.ok) {
      errorEl.textContent = result.error;
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }

    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get('return');
    // Only ever redirect to a known internal tool page -- never follow
    // an arbitrary external "return" value, which would make this an
    // open redirect. An earlier version tried to validate an arbitrary
    // path was "safe" (same-origin, not protocol-relative) rather than
    // checking against a known set -- that version was verified
    // correct against real adversarial cases (including the classic
    // '//evil.com' protocol-relative bypass), but a hand-written
    // validator function isn't something static analysis tools
    // reliably recognize as an effective sanitizer. An explicit
    // allowlist is both easier to verify at a glance and matches
    // reality exactly: requireAuth() in auth.js always builds this
    // parameter from window.location.pathname on this same site, so
    // it can only ever legitimately be one of these real pages.
    const ALLOWED_RETURN_PATHS = new Set([
      '/tools/calendar.html', '/tools/client-detail.html', '/tools/contact-card.html',
      '/tools/contract-generator.html', '/tools/dev-tools.html', '/tools/expense-logger.html',
      '/tools/finance.html', '/tools/invoice-generator.html', '/tools/job-cost-lookup.html',
      '/tools/job-detail.html', '/tools/job-tracker.html', '/tools/parts-reference.html',
      '/tools/review-request.html', '/tools/route-planner.html', '/tools/runway-dashboard.html',
      '/tools/settings.html', '/tools/site-content.html', '/tools/workspace.html',
    ]);
    window.location.href = ALLOWED_RETURN_PATHS.has(returnTo) ? returnTo : '/tools/workspace.html';
  });

  document.getElementById('forgotPasswordLink').addEventListener('click', () => {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('forgotPasswordPanel').style.display = '';
    document.getElementById('resetEmail').value = document.getElementById('loginEmail').value;
    document.getElementById('resetError').textContent = '';
    document.getElementById('resetSuccess').style.display = 'none';
  });

  document.getElementById('cancelResetLink').addEventListener('click', () => {
    document.getElementById('forgotPasswordPanel').style.display = 'none';
    document.getElementById('loginForm').style.display = '';
  });

  document.getElementById('sendResetBtn').addEventListener('click', async () => {
    const email = document.getElementById('resetEmail').value.trim();
    const errorEl = document.getElementById('resetError');
    const successEl = document.getElementById('resetSuccess');
    errorEl.textContent = '';
    successEl.style.display = 'none';
    if (!email) { errorEl.textContent = 'Enter your email first.'; return; }

    const btn = document.getElementById('sendResetBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    const result = await requestPasswordReset(email);
    btn.disabled = false;
    btn.textContent = 'Send reset link';

    if (!result.ok) { errorEl.textContent = result.error; return; }
    successEl.style.display = '';
  });

  // Already logged in? Skip the form entirely.
  (async () => {
    if (hasValidSession()) {
      window.location.href = '/tools/workspace.html';
    }
  })();
</script>
</body>
</html>
