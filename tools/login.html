<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign In | Triple H Enterprises (Internal Tool)</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
<link rel="manifest" href="/tools/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triple H">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=202608112330">
<script src="/tools/auth.js?v=202608142300"></script>
<script src="/tools/tools-common.js?v=202608142300" defer></script>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-box { max-width: 380px; width: 100%; text-align: center; }
  .login-logo { width: 72px; height: auto; margin-bottom: 20px; }
  .login-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px; color: var(--white); margin-bottom: 6px; }
  .login-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }
  .login-field { margin-bottom: 16px; text-align: left; }
  .login-field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 5px; }
  .login-field input {
    width: 100%; padding: 11px 13px; background: var(--bg-panel-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--white); font-size: 15px; font-family: inherit; box-sizing: border-box;
  }
  .login-error { color: #e05252; font-size: 13.5px; margin: 4px 0 16px; min-height: 1px; }
  .login-btn { width: 100%; justify-content: center; }
</style>
</head>
<body>

<div class="login-box">
  <img src="/images/logo-signature-orange.webp?v=202608142300" alt="Triple H Enterprises" class="login-logo">
  <div class="login-title">Triple H Workspace</div>
  <div class="login-sub">Sign in to continue.</div>

  <form id="loginForm">
    <div class="login-field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="username" required>
    </div>
    <div class="login-field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="checkbox-row" style="margin-bottom: 18px;">
      <input type="checkbox" id="rememberMe" checked>
      <label for="rememberMe">Remember me for 30 days</label>
    </div>
    <button type="submit" class="primary-btn login-btn" id="loginBtn">Sign In</button>
  </form>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing In...';

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const rememberMe = document.getElementById('rememberMe').checked;
    const result = await signIn(email, password, rememberMe);

    if (!result.ok) {
      errorEl.textContent = result.error;
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }

    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get('return');
    // Only ever redirect to a same-site path -- never follow an
    // external "return" value, which would make this an open redirect.
    window.location.href = (returnTo && returnTo.startsWith('/')) ? returnTo : '/tools/workspace.html';
  });

  // Already logged in? Skip the form entirely.
  (async () => {
    if (hasValidSession()) {
      window.location.href = '/tools/workspace.html';
    }
  })();
</script>
</body>
</html>
