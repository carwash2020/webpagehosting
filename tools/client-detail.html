<!DOCTYPE html>
<!-- background-color, not the background shorthand (2026-09-06): the
     shorthand also resets background-image, which silently cancelled the
     ambient gradient tools/styles-tools.css defines on this element --
     rendered fine in isolation and never caught by any test, but never
     actually visible on a real tool page. Fixed here rather than dropping
     the inline value: it still paints dark before CSS parses, which is
     the whole reason it exists (see color-scheme below on pages that have
     it) -- it just no longer overrides a property it never meant to touch.
     Portal pages carry the identical inline value for the same FOUC
     reason, but their own ambient gradient lives on body.portal-page, not
     html, so it was never at risk from this -- fixed for consistency and
     to remove the same latent hazard before anything ever puts a
     background-image on html here too. -->

<script>
  (function () {
    // Tools app light/dark theme (2026-08-20), tucked into Settings.
    // A separate preference from the public site's own theme toggle --
    // different audience, different devices. Defaults to dark,
    // matching the tools app's original look; applied here, before any
    // stylesheet loads, to avoid a flash of the wrong theme on load.
    var saved = localStorage.getItem('th_tools_theme');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.style.colorScheme = saved === 'light' ? 'light' : 'dark';
  })();
</script>

<style>
  /* Cross-document view transitions (2026-09-21) -- same pattern
     already proven in portal/*.html: keeps the old page's visual
     snapshot on screen while the next page loads instead of a
     blank flash, and (since tools-nav-pwa.js's sidebar/bottom-nav
     markup is byte-identical across every tools/ page and carries
     a matching view-transition-name in styles-tools.css) the shell
     itself reads as staying in place rather than crossfading.
     Supported in Chrome/Edge 126+ and Safari 18.2+; unsupported
     browsers just navigate exactly as before -- pure progressive
     enhancement. Both the origin and destination page must opt in
     for a transition to happen, so this needs adding to every
     tools/ page, not just one. */
  @view-transition {
    navigation: auto;
  }
  body { max-width: 720px; margin: 0 auto; }
  .realtime-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-dim); }

  .hub-sub { margin: 4px 0 0; }
  /* Desktop layout (2026-08-20), requested directly: efficient on
     phone stays exactly as it was (nothing below 1024px changes at
     all) -- this only widens the container on a real desktop-size
     screen. */
  @media (min-width: 1024px) { body { max-width: var(--tool-maxw-narrow); margin-left: calc(240px + max(0px, (100vw - 240px - var(--tool-maxw-narrow)) / 2)); padding-top: 75px; } }

  }
  body.th-tool-page[data-th-page="client-detail"] #clientDeletedState .secondary-btn,
  body.th-tool-page[data-th-page="client-detail"] #clientDeletedState .primary-btn { min-height: 46px; border-radius: 14px; }

  @media (min-width: 1100px) {
    /* row-gap 0: W4 spans the hero over 12 rows, and gaps between empty
       rows would pad the bottom; the right column spaces itself instead. */
    body.th-tool-page[data-th-page="client-detail"] #clientContent { display: grid; column-gap: 16px; row-gap: 0; grid-template-columns: minmax(360px, 1fr) minmax(0, 1.2fr); }
    body.th-tool-page[data-th-page="client-detail"] #clientContent > :not(.client-hero) { margin-bottom: 16px; }
  }
</style>
</head>
<body data-th-page="client-detail">

<!-- Bug fix (2026-09-22): same fix as job-detail.html -- see its comment
     for the full reasoning. A standalone loading state, visible from
     first paint, covers the gap before the async lookup below decides
     whether clientDetailView or clientNotFound should show; it does not
     change that toggle itself. -->
<div id="clientLoadingState" style="text-align:center; padding:60px 20px; color:var(--text-dim); font-size:14px;">Loading client&hellip;</div>

<div id="clientDetailView" style="display:none;">
  <div class="hub-header">
    <div class="hub-header-left">
      <img src="/images/logo-signature-orange.webp?v=202608142300" alt="Triple H Enterprises">
      <span class="hub-title">Client</span>
    </div>
    <div class="hub-header-right">
      <a href="/tools/clients.html" class="help-btn" aria-label="Back to Clients" title="Back to Clients" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">&#8617;</a>
      <a href="/tools/workspace.html" class="help-btn" aria-label="Back to Dashboard" title="Back to Dashboard" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">&#8617;</a>
    </div>
  </div>
  <p class="hub-sub"><span class="realtime-badge" id="realtimeBadge" onclick="retryLiveSync()" title="Live sync" style="margin-left:0;"><span class="realtime-dot" id="realtimeDot"></span><span id="realtimeText">Live sync: connecting...</span></span></p>

  <div id="clientContent"></div>
</div>

<div id="clientNotFound" style="display:none; text-align:center; padding:60px 20px;">
  <div style="color:var(--text-dim); font-size:14px; margin-bottom:16px;">Client not found. It may have been removed, or the link is out of date.</div>
  <a href="/tools/clients.html" class="secondary-btn" style="text-decoration:none;">Back to Clients</a>
</div>

<!-- Shown right after this page deletes the client (2026-09-24), instead
     of "not found": says what was kept and offers an immediate Undo. -->
<div id="clientDeletedState" style="display:none; text-align:center; padding:60px 20px;">
  <div id="clientDeletedText" style="color:var(--text-dim); font-size:14px; line-height:1.6; margin-bottom:16px;"></div>
  <div class="client-deleted-actions">
    <button type="button" class="secondary-btn" id="undoDeleteClientBtn" onclick="undoDeleteClient()">Undo</button>
    <a href="/tools/clients.html" class="primary-btn" style="text-decoration:none;">Back to Clients</a>
  </div>
</div>

<script>
  let currentClientId = null;
  // The client this page just deleted, kept for Undo (see deleteThisClient).
  let lastDeletedClient = null;

  document.addEventListener('DOMContentLoaded', async () => {
    if (typeof initSyncOnLoad === 'function') { try { await initSyncOnLoad(); } catch (e) { /* renders with whatever local data exists */ } }

    currentClientId = new URLSearchParams(window.location.search).get('id');
    const bundle = (currentClientId && typeof thGetClientBundle === 'function') ? thGetClientBundle(currentClientId) : null;
    document.getElementById('clientLoadingState').style.display = 'none';

    // Wired up BEFORE the not-found check below (2026-08-27, real gap
    // found and fixed) -- a user landing here for a record that just
    // hasn't synced to this device yet (new device, or the record was
    // created moments ago on another device) would otherwise never get
    // pull-to-refresh at all, right when they'd most want to retry.
    // onClientRealtimeChange already re-checks the bundle and switches
    // views correctly either way, so this is safe to call regardless.
    if (typeof setupPullToRefresh === 'function') setupPullToRefresh(onClientRealtimeChange);

    if (!bundle) {
      document.getElementById('clientNotFound').style.display = '';
      return;
    }
    document.getElementById('clientDetailView').style.display = '';
    renderClientDetail(bundle);

    if (typeof startRealtimeSync === 'function') {
      startRealtimeSync(onClientRealtimeChange, updateRealtimeBadge);
    }
  });

  function updateRealtimeBadge(status) {
    const dot = document.getElementById('realtimeDot');
    const text = document.getElementById('realtimeText');
    const badge = document.getElementById('realtimeBadge');
    if (!dot || !text) return;
    dot.className = 'realtime-dot';
    if (status === 'SUBSCRIBED') {
      dot.classList.add('is-live');
      text.textContent = 'Live sync active';
    } else if (status === 'unavailable') {
      dot.classList.add('is-error');
      text.textContent = 'Live sync unavailable';
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED' || status === 'timeout') {
      dot.classList.add('is-error');
      text.textContent = 'Live sync disconnected';
    } else {
      dot.classList.add('is-connecting');
      text.textContent = 'Live sync: connecting...';
    }
    if (badge) badge.classList.toggle('is-retryable', dot.classList.contains('is-error'));
  }

  // Same principle as job-detail.html's equivalent: re-checks this
  // specific client against the freshly-pulled data rather than
  // re-rendering blindly, since the client could genuinely have been
  // removed by someone else while this page was open.
  function onClientRealtimeChange() {
    const bundle = (currentClientId && typeof thGetClientBundle === 'function') ? thGetClientBundle(currentClientId) : null;
    if (!bundle) {
      // Deleted from this page: keep the "deleted -- Undo" state rather
      // than swapping it for "not found" when the sync echo arrives.
      if (lastDeletedClient) return;
      document.getElementById('clientDetailView').style.display = 'none';
      document.getElementById('clientNotFound').style.display = '';
      return;
    }
    renderClientDetail(bundle);
  }

  function clientInitials(name) {
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    return ((parts[0][0] || '') + (parts.length > 1 ? parts[parts.length - 1][0] : (parts[0][1] || ''))).toUpperCase();
  }
  function actionLink(href, icon, label, external) {
    const cls = 'client-action' + (href ? '' : ' is-disabled');
    return '<a class="' + cls + '"' + (href ? ' href="' + escapeAttr(href) + '"' : ' aria-disabled="true"') + (external ? ' target="_blank" rel="noopener"' : '') + '>' +
      '<svg class="th-icon" aria-hidden="true"><use href="#icon-' + icon + '" xlink:href="#icon-' + icon + '"></use></svg>' + label + '</a>';
  }

  function renderClientDetail(bundle) {
    const c = bundle.client;
    document.title = c.name + ' | Triple H Enterprises (Internal Tool)';

    const metaLines = [];
    if (c.phone) metaLines.push('<a href="tel:' + escapeAttr(c.phone) + '">' + escapeHtml(c.phone) + '</a>');
    if (c.email) metaLines.push('<a href="mailto:' + escapeAttr(c.email) + '">' + escapeHtml(c.email) + '</a>');
    if (c.address) metaLines.push(escapeHtml(c.address));

    const openJobs = bundle.jobs.filter(j => j.status !== 'done').length;
    // What they owe right now, with the same rules as the Clients list
    // and the Dashboard's Money Owed card (data-layer.js).
    const balanceOf = (i) => (typeof thInvoiceBalance === 'function' ? thInvoiceBalance(i) : (i.paid ? 0 : (Number(i.total) || 0)));
    const overdueOf = (i) => (typeof thInvoiceIsOverdue === 'function' && thInvoiceIsOverdue(i));
    const owed = bundle.invoices.reduce((sum, i) => sum + balanceOf(i), 0);
    const overdue = bundle.invoices.filter(overdueOf).reduce((sum, i) => sum + balanceOf(i), 0);
    const tel = c.phone ? 'tel:' + String(c.phone).replace(/[^\d+]/g, '') : '';
    const sms = c.phone ? 'sms:' + String(c.phone).replace(/[^\d+]/g, '') : '';
    const maps = c.address ? 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(c.address) : '';
    const nameParam = encodeURIComponent(c.name);
    // Next job if one is booked, otherwise the last one -- the bundle's
    // lastJobDate is simply the latest date on file, which reads wrong
    // ("Last job" in the future) the moment a job is scheduled ahead.
    const todayStr = typeof thLocalDateStr === 'function' ? thLocalDateStr(new Date()) : new Date().toISOString().slice(0, 10);
    const fmt = (d) => { const x = new Date(d + 'T00:00:00'); return isNaN(x.getTime()) ? d : x.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: x.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }); };
    const nextJob = bundle.jobs.filter(j => j.date && j.date >= todayStr && j.status !== 'done').map(j => j.date).sort()[0];
    const lastJob = bundle.jobs.filter(j => j.date && j.date <= todayStr).map(j => j.date).sort().pop();
    // (The Next Job / Last Job stat moved into the What's next card below,
    // v2 2026-09-29 -- same date, same label, now with the job it points at.)
    const canInvoice = typeof canManageInvoices !== 'function' || canManageInvoices() || !(typeof getCurrentUserRole === 'function' && getCurrentUserRole());

    // v2 (2026-09-29, App redesign v2 §8.9): the hero is a column of three
    // cards -- the person (64px hex avatar, Anton name, phone · city, the
    // "Owes" pill, a 4-up Call / Text / New job / Invoice), the stats grid,
    // and the referral link -- so on a computer it stays one left column
    // beside What's next, History and the records. .client-hero keeps its
    // place as the first child of #clientContent; every link, label and
    // number below is the same one this page showed before, plus Avg ticket
    // and Client since (both read from the same bundle).
    const city = c.address ? (String(c.address).split(',')[1] || '').trim() : '';
    const heroSub = [c.phone ? escapeHtml(c.phone) : '', city ? escapeHtml(city) : ''].filter(Boolean).join(' &middot; ');
    const plusIcon = (name) => '<svg class="th-icon" aria-hidden="true"><use href="#icon-' + name + '" xlink:href="#icon-' + name + '"></use></svg>';
    const avgTicket = bundle.invoices.length ? bundle.revenue / bundle.invoices.length : null;
    const firstSeen = [String(c.createdAt || '').slice(0, 10)]
      .concat(bundle.jobs.map(j => j.date), bundle.invoices.map(i => i.date), bundle.quotes.map(q => q.date))
      .filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d || '')).sort()[0];
    const sinceLabel = firstSeen ? new Date(firstSeen + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : '—';

    let html = '<div class="client-hero">' +
      '<div class="client-hero-card">' +
      '<div class="client-hero-top">' +
        '<span class="th-row-avatar' + (owed > 0 ? ' is-owed' : '') + '" aria-hidden="true">' + escapeHtml(clientInitials(c.name)) + '</span>' +
        '<div style="min-width:0;">' +
          '<div class="client-hero-name">' + escapeHtml(c.name) + '</div>' +
          (heroSub ? '<div class="client-hero-sub">' + heroSub + '</div>' : '') +
        '</div>' +
      '</div>' +
      (owed > 0 ? '<div class="client-owed-line th-v2-pill ' + (overdue > 0 ? 'is-danger is-red' : 'is-orange') + '">Owes ' + money(owed) + (overdue > 0 ? ' &middot; ' + money(overdue) + ' overdue' : '') + '</div>' : '') +
      (metaLines.length ? '<div class="client-hero-meta">' + metaLines.join(' &middot; ') + '</div>' : '') +
      '<div class="client-actions">' +
        actionLink(tel, 'phone', 'Call') +
        actionLink(sms, 'message', 'Text') +
        '<a class="client-action" href="/tools/job-tracker.html?client=' + nameParam + '#add-job">New job<svg class="th-icon" aria-hidden="true"><use href="#icon-wrench" xlink:href="#icon-wrench"></use></svg></a>' +
        (canInvoice
          ? '<a class="client-action" href="/tools/invoice-generator.html?client=' + nameParam + '#invoice">Invoice<svg class="th-icon" aria-hidden="true"><use href="#icon-receipt" xlink:href="#icon-receipt"></use></svg></a>'
          : actionLink(c.email ? 'mailto:' + c.email : '', 'inbox', 'Email')) +
      '</div>' +
      '<div class="client-next">' +
        (canInvoice ? actionLink(c.email ? 'mailto:' + c.email : '', 'inbox', 'Email') : '') +
        actionLink(maps, 'navigate', 'Directions', true) +
        (canInvoice ? '<a class="client-action" href="/tools/invoice-generator.html?client=' + nameParam + '#quote">' + plusIcon('note') + 'Quote</a>' : '') +
      '</div>' +
      '</div>' +
      '<div class="client-stat-row">' +
        '<div class="client-stat"><div class="client-stat-value">' + money(bundle.revenue) + '</div><div class="client-stat-label">Lifetime Revenue</div></div>' +
        '<div class="client-stat"><div class="client-stat-value">' + bundle.jobs.length + '</div><div class="client-stat-label">Jobs' + (openJobs ? ' (' + openJobs + ' open)' : '') + '</div></div>' +
        '<div class="client-stat"><div class="client-stat-value">' + (avgTicket === null ? '—' : money(avgTicket)) + '</div><div class="client-stat-label">Avg ticket</div></div>' +
        '<div class="client-stat"><div class="client-stat-value">' + escapeHtml(sinceLabel) + '</div><div class="client-stat-label">Client since</div></div>' +
      '</div>' +
      '<div class="client-referral-card th-v2-card">' +
        '<div class="th-v2-card-title">Referral link</div>' +
        '<div class="client-referral-note">$25 credit when someone they send has a job done and paid.</div>' +
        '<div id="referralLinkBlock"></div>' +
      '</div>' +
    '</div>';

    // What's next: the one thing to do for this client, from what is
    // already on the page -- the next booked job (the old Next Job /
    // Last Job stat), else an open balance, else booking the next visit.
    const nextJobRec = nextJob ? bundle.jobs.filter(j => j.date === nextJob && j.status !== 'done')[0] : null;
    let nextText, nextSub, nextHref, nextCta;
    if (nextJobRec) {
      nextText = escapeHtml(nextJobRec.title || 'Job') + ' &middot; ' + escapeHtml(nextJob === todayStr ? 'Today' : fmt(nextJob));
      nextSub = 'Next Job' + (nextJobRec.status === 'in-progress' ? ' &middot; in progress' : '');
      nextHref = '/tools/job-detail.html?id=' + encodeURIComponent(nextJobRec.id);
      nextCta = 'Open job';
    } else if (owed > 0 && canInvoice) {
      nextText = (overdue > 0 ? money(overdue) + ' is overdue' : money(owed) + ' is still open') + ' &mdash; send a reminder';
      nextSub = 'Last Job ' + (lastJob ? escapeHtml(fmt(lastJob)) : '—');
      nextHref = '/tools/invoice-generator.html?search=' + encodeURIComponent(c.name) + '#recent';
      nextCta = 'See invoices';
    } else {
      nextText = 'No job booked' + (lastJob ? ' &middot; last one ' + escapeHtml(fmt(lastJob)) : ' yet');
      nextSub = 'Last Job ' + (lastJob ? escapeHtml(fmt(lastJob)) : '—');
      nextHref = '/tools/job-tracker.html?client=' + nameParam + '#add-job';
      nextCta = 'Book a job';
    }
    html += '<div class="client-whats-next">' +
      '<div class="th-v2-kicker">What’s next</div>' +
      '<div class="client-whats-next-text">' + nextText + '</div>' +
      '<div class="client-whats-next-sub">' + nextSub + '</div>' +
      '<a class="th-v2-link client-whats-next-cta" href="' + nextHref + '">' + nextCta + plusIcon('chevron') + '</a>' +
    '</div>';

    // History: one timeline of everything on file, newest first. The full
    // per-type record lists (Jobs, Invoices, Quotes, Contracts) follow.
    const events = [];
    bundle.jobs.forEach(j => events.push({
      date: j.date || '', t: j.title || 'Job',
      m: (j.date ? fmt(j.date) : 'No date') + ' · ' + (j.status === 'done' ? 'Done' : j.status === 'in-progress' ? 'In progress' : 'Not started'),
      a: '', tone: j.status === 'done' ? 'green' : 'blue', href: '/tools/job-detail.html?id=' + encodeURIComponent(j.id),
    }));
    bundle.invoices.forEach(i => {
      const bal = balanceOf(i);
      events.push({
        date: i.date || '', t: 'Invoice ' + (i.invoiceNumber || ''),
        m: (i.date ? fmt(i.date) : '') + (bal <= 0 ? ' · Paid' : (overdueOf(i) ? ' · Overdue' : ' · Unpaid')),
        a: money(i.total || 0), tone: bal <= 0 ? 'green' : (overdueOf(i) ? 'red' : 'orange'),
        href: '/tools/invoice-generator.html?search=' + encodeURIComponent(c.name) + '#recent',
      });
    });
    bundle.quotes.forEach(q => events.push({
      date: q.date || '', t: 'Quote ' + (q.quoteNumber || ''), m: q.date ? fmt(q.date) : '', a: money(q.total || 0), tone: 'purple',
      href: '/tools/invoice-generator.html?search=' + encodeURIComponent(c.name) + '#recent',
    }));
    bundle.contracts.forEach(k => events.push({
      date: String(k.dateGeneratedISO || '').slice(0, 10), t: k.type || 'Contract', m: k.dateGenerated || '', a: '', tone: 'idle',
      href: '/tools/contract-generator.html?search=' + encodeURIComponent(c.name),
    }));
    // Every href here is a fixed path plus encodeURIComponent() values (no
    // quote or angle bracket survives it) -- the same way renderRecordSection
    // below writes its links.
    events.sort((a, b) => b.date.localeCompare(a.date));
    html += '<div class="client-history th-v2-card">' +
      '<div class="th-v2-card-head"><span class="th-v2-card-title">History</span>' +
        (events.length > 6 ? '<span class="th-v2-card-note client-history-more">Latest 6 of ' + events.length + '</span>' : '') + '</div>' +
      (events.length
        ? '<div class="client-timeline">' + events.slice(0, 6).map(e =>
            '<a class="client-timeline-item is-' + e.tone + '" href="' + e.href + '">' +
              '<span class="client-timeline-rail" aria-hidden="true"><span class="client-timeline-dot"></span></span>' +
              '<span class="client-timeline-main"><span class="client-timeline-title">' + escapeHtml(e.t) + '</span>' +
              '<span class="client-timeline-meta">' + escapeHtml(e.m) + '</span></span>' +
              (e.a ? '<span class="client-timeline-amount">' + e.a + '</span>' : '') +
            '</a>').join('') + '</div>'
        : '<div class="client-timeline-empty">Nothing on file yet &mdash; the first job, invoice or quote shows up here.</div>') +
    '</div>';

    // Where each job's money is (2026-09-22, Workspace rework part 5), the
    // same pill Job Tracker's cards wear -- To invoice is the one to act on.
    const handPaid = (typeof thRead === 'function') ? thRead(TH_KEYS.income, []).filter(e => e.origin !== 'invoice') : [];
    const JOB_STAGE_PILL = {
      'to-invoice': '<span class="th-pill">To invoice</span>', invoiced: '<span class="th-pill is-muted">Invoiced</span>',
      overdue: '<span class="th-pill is-danger">Overdue</span>', paid: '<span class="th-pill is-paid">Paid</span>',
      'no-charge': '<span class="th-pill is-muted">No charge</span>',
    };
    html += renderRecordSection('Jobs', bundle.jobs.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(j => {
      const stage = (typeof thJobMoneyStage === 'function') ? thJobMoneyStage(j, bundle.invoices, handPaid).stage : null;
      return {
        title: j.title,
        meta: (j.date || 'No date') + ' · ' + (j.status === 'done' ? 'Done' : j.status === 'in-progress' ? 'In progress' : 'Not started'),
        amount: JOB_STAGE_PILL[stage] || '',
        href: '/tools/job-detail.html?id=' + encodeURIComponent(j.id),
      };
    }), 'No jobs on file for this client yet.');

    html += renderRecordSection('Invoices', bundle.invoices.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(i => {
      const bal = balanceOf(i);
      return {
        title: 'Invoice ' + (i.invoiceNumber || ''),
        meta: (i.date || '') + (bal <= 0 ? ' · Paid' : (overdueOf(i) ? ' · Overdue' : ' · Unpaid')),
        amount: money(i.total || 0) + (bal > 0 && bal < (Number(i.total) || 0) ? ' <span class="th-pill">' + money(bal) + ' left</span>' : ''),
        href: '/tools/invoice-generator.html?search=' + encodeURIComponent(c.name) + '#recent',
      };
    }), 'No invoices sent to this client yet.');

    html += renderRecordSection('Quotes', bundle.quotes.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(q => ({
      title: 'Quote ' + (q.quoteNumber || ''),
      meta: q.date || '',
      amount: money(q.total || 0),
      href: '/tools/invoice-generator.html?search=' + encodeURIComponent(c.name) + '#recent',
    })), 'No quotes sent to this client yet.');

    html += renderRecordSection('Contracts', bundle.contracts.slice().sort((a, b) => (b.dateGeneratedISO || '').localeCompare(a.dateGeneratedISO || '')).map(k => ({
      title: (k.type || 'Contract'),
      meta: k.dateGenerated || '',
      amount: '',
      href: '/tools/contract-generator.html?search=' + encodeURIComponent(c.name),
    })), 'No contracts on file for this client yet.');

    html += '<div class="section-block client-delete-zone">' +
      '<div class="client-delete-row">' +
        '<div><div class="client-record-title">Delete client</div>' +
        '<div class="client-record-meta">Removes ' + escapeHtml(c.name) + ' from Clients. Their jobs, invoices, quotes, and contracts stay on file.</div></div>' +
        '<button type="button" class="small-btn danger" id="deleteClientBtn" onclick="deleteThisClient()">Delete</button>' +
      '</div>' +
    '</div>';

    document.getElementById('clientContent').innerHTML = html;
    loadReferralLink(c);
  }

  // Delete (2026-09-24), requested directly: there was no way to delete a
  // client outside Dev Tools' Client registry. thDeleteClient() is the
  // same call that one uses: it removes only the client record, records a
  // tombstone so neither a sync nor the rebuild-from-jobs brings the
  // client back, and keeps a copy in Dev Tools' Graveyard. The client's
  // jobs, invoices, quotes and contracts are real records of their own and
  // are left exactly as they are.
  function countPhrase(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  async function deleteThisClient() {
    const bundle = (currentClientId && typeof thGetClientBundle === 'function') ? thGetClientBundle(currentClientId) : null;
    if (!bundle || typeof thDeleteClient !== 'function') return;
    const c = bundle.client;
    const kept = [
      bundle.jobs.length ? countPhrase(bundle.jobs.length, 'job', 'jobs') : '',
      bundle.invoices.length ? countPhrase(bundle.invoices.length, 'invoice', 'invoices') : '',
      bundle.quotes.length ? countPhrase(bundle.quotes.length, 'quote', 'quotes') : '',
      bundle.contracts.length ? countPhrase(bundle.contracts.length, 'contract', 'contracts') : '',
    ].filter(Boolean);
    // "1 job stays" / "1 job and 1 invoice stay": one thing, or several.
    const keptList = kept.length > 1 ? kept.slice(0, -1).join(', ') + ' and ' + kept[kept.length - 1] : (kept[0] || '');
    const keptOne = kept.length === 1 && /^1 /.test(kept[0]);
    const keptText = kept.length
      ? 'Their ' + keptList + (keptOne ? ' stays' : ' stay') + ' on file. Only the client record is removed.'
      : 'Nothing else is on file for them.';
    const confirmed = await showConfirm('Delete ' + c.name + '? ' + keptText, { danger: true, confirmText: 'Delete client' });
    if (!confirmed) return;

    thDeleteClient(c.id);
    lastDeletedClient = c;
    document.getElementById('clientDetailView').style.display = 'none';
    document.getElementById('clientNotFound').style.display = 'none';
    document.getElementById('clientDeletedText').textContent = c.name + ' was deleted. ' +
      (kept.length ? 'Their ' + keptList + (keptOne ? ' is' : ' are') + ' still on file. ' : '') +
      'Undo puts them back; later, Dev Tools → Data → Graveyard can restore them.';
    document.getElementById('clientDeletedState').style.display = '';
    const undoBtn = document.getElementById('undoDeleteClientBtn');
    if (undoBtn) undoBtn.focus();
  }

  // Undo: the Graveyard's own restore for a client (dev-tools.html's
  // restoreFromGraveyard), so a deletion undone here behaves exactly like
  // one restored there -- same record and id back, its tombstone marked
  // restored (not deleted, or the server's copy would delete it again on
  // the next pull), and its Graveyard entry cleared.
  function undoDeleteClient() {
    const c = lastDeletedClient;
    if (!c) return;
    const list = thLoadClients();
    if (!list.some(x => x.id === c.id)) {
      list.push(c);
      thSaveClients(list);
    }
    thLiftTombstone(TH_CLIENT_TOMBSTONES_KEY, c.id);
    const entry = thLoadGraveyard().filter(g => g.recordType === 'client' && g.record && g.record.id === c.id).pop();
    if (entry) thRemoveFromGraveyard(entry.graveyardId);
    lastDeletedClient = null;

    document.getElementById('clientDeletedState').style.display = 'none';
    const bundle = thGetClientBundle(c.id);
    if (!bundle) {
      document.getElementById('clientNotFound').style.display = '';
      return;
    }
    document.getElementById('clientDetailView').style.display = '';
    renderClientDetail(bundle);
    if (typeof showToast === 'function') showToast(c.name + ' is back.');
  }

  // Account codes (direct request, 2026-09-20): "unique IDs connected
  // to accounts" for the referral promo, doubling as a general
  // account ID for tracking. A portal invite (send-invite edge
  // function) generates one automatically the moment an account is
  // actually created -- this is the manual path for a client who
  // isn't (yet, or ever) a portal user, so referrals from someone
  // without portal access still get a real, shareable link instead
  // of the old free-text "who referred you" field. Keyed by email
  // (see create_client_account_codes.sql), so a code generated here
  // still connects automatically if this same client later gets a
  // portal invite with the same email.
  const REFERRAL_CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // excludes 0/O/1/I/L -- easy to misread when read off a screen
  function generateReferralCode() {
    let code = '';
    for (let i = 0; i < 7; i++) code += REFERRAL_CODE_CHARS[Math.floor(Math.random() * REFERRAL_CODE_CHARS.length)];
    return code;
  }

  async function loadReferralLink(client) {
    const block = document.getElementById('referralLinkBlock');
    if (!block) return;
    if (!client.email) {
      block.innerHTML = '<div class="referral-link-hint">Add an email address for this client to generate a referral link.</div>';
      return;
    }
    block.innerHTML = '<div class="referral-link-hint">Loading referral link...</div>';
    try {
      const session = getStoredSession();
      const authHeader = 'Bearer ' + (session ? session.access_token : SUPABASE_ANON_KEY);
      const res = await fetch(SUPABASE_URL + '/rest/v1/client_account_codes?email=eq.' + encodeURIComponent(client.email.toLowerCase()) + '&select=code&limit=1', {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: authHeader },
      });
      const rows = res.ok ? await res.json() : [];
      const code = rows[0] ? rows[0].code : null;
      // Usage count (2026-09-21, "refine our code system"): staff
      // already has direct read access to th_leads/th_bookings (see
      // both tables' own account_roles-gated RLS policy), so this is
      // a plain count query -- no edge function needed here, unlike
      // the portal's own self-serve equivalent which has no such
      // access.
      let usageCount = 0;
      if (code) {
        const [leadsRes, bookingsRes] = await Promise.all([
          fetch(SUPABASE_URL + '/rest/v1/th_leads?referred_by_code=eq.' + encodeURIComponent(code) + '&select=id', { headers: { apikey: SUPABASE_ANON_KEY, Authorization: authHeader, Prefer: 'count=exact' } }),
          fetch(SUPABASE_URL + '/rest/v1/th_bookings?referred_by_code=eq.' + encodeURIComponent(code) + '&select=id', { headers: { apikey: SUPABASE_ANON_KEY, Authorization: authHeader, Prefer: 'count=exact' } }),
        ]);
        const leadsCount = parseInt((leadsRes.headers.get('content-range') || '').split('/')[1] || '0', 10) || 0;
        const bookingsCount = parseInt((bookingsRes.headers.get('content-range') || '').split('/')[1] || '0', 10) || 0;
        usageCount = leadsCount + bookingsCount;
      }
      renderReferralLinkBlock(client, code, usageCount);
    } catch (e) {
      block.innerHTML = '<div class="referral-link-hint">Could not load referral link: ' + escapeHtml(e.message || String(e)) + '</div>';
    }
  }

  function renderReferralLinkBlock(client, code, usageCount) {
    const block = document.getElementById('referralLinkBlock');
    if (!block) return;
    if (!code) {
      block.innerHTML = '<button class="secondary-btn" onclick="createReferralLink(\'' + escapeForInlineHandler(client.email) + '\', \'' + escapeForInlineHandler(client.name) + '\', \'' + escapeForInlineHandler(client.phone || '') + '\')">Get referral link</button>';
      return;
    }
    const link = 'https://www.triplehenterprisesllc.biz/booking.html?ref=' + encodeURIComponent(code);
    const smsBody = encodeURIComponent('Hi ' + client.name + ', here\'s your Triple H Enterprises referral link -- share it and get $25 once your friend\'s job is done and paid: ' + link);
    const smsTarget = client.phone ? client.phone.replace(/[^\d+]/g, '') : '';
    const usageLine = usageCount > 0
      ? '<div class="referral-link-hint">Used to book ' + usageCount + ' time' + (usageCount === 1 ? '' : 's') + ' so far.</div>'
      : '';
    block.innerHTML =
      '<div class="referral-link-row">' +
        '<div class="referral-link-code" id="referralLinkText">' + escapeHtml(link) + '</div>' +
        '<button class="secondary-btn" onclick="copyReferralLink()">Copy</button>' +
        '<button class="primary-btn referral-share-btn" onclick="shareReferralLink()">Share</button>' +
      '</div>' +
      (smsTarget ? '<a href="sms:' + escapeAttr(smsTarget) + '?body=' + smsBody + '" class="secondary-btn" style="display:inline-block; text-decoration:none; margin-top:8px;">Text to ' + escapeHtml(client.name) + '</a>' : '') +
      '<div class="referral-link-hint">Send this to ' + escapeHtml(client.name) + ' to text or share -- anyone who books through it gets automatically credited to them.</div>' +
      usageLine;
  }

  async function createReferralLink(email, name, phone) {
    const block = document.getElementById('referralLinkBlock');
    block.innerHTML = '<div class="referral-link-hint">Creating link...</div>';
    const session = getStoredSession();
    const authHeader = 'Bearer ' + (session ? session.access_token : SUPABASE_ANON_KEY);
    // Retries on a code collision (a real, if rare, possibility with a
    // 7-character code) rather than assuming the first attempt always
    // succeeds -- mirrors ensureAccountCode()'s same retry in
    // send-invite/index.ts.
    for (let attempt = 0; attempt < 5; attempt++) {
      const code = generateReferralCode();
      const res = await fetch(SUPABASE_URL + '/rest/v1/client_account_codes', {
        method: 'POST',
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: authHeader, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ email: email.toLowerCase(), code: code, display_name: name }),
      });
      if (res.ok) {
        renderReferralLinkBlock({ email: email, name: name, phone: phone }, code, 0);
        return;
      }
      const body = await res.text();
      if (!body.includes('23505')) {
        block.innerHTML = '<div class="referral-link-hint">Could not create referral link: ' + escapeHtml(body.slice(0, 200)) + '</div>';
        return;
      }
      // A collision on `code` is worth retrying; a collision on
      // `email` means one already exists (maybe created moments ago
      // in another tab) -- either way, re-loading picks up the real
      // current state instead of assuming.
      if (body.includes('client_account_codes_email_key')) {
        loadReferralLink({ email: email, name: name, phone: phone });
        return;
      }
    }
    block.innerHTML = '<div class="referral-link-hint">Could not generate a unique code after several tries. Please try again.</div>';
  }

  function copyReferralLink() {
    const el = document.getElementById('referralLinkText');
    if (!el) return;
    navigator.clipboard.writeText(el.textContent).then(() => {
      if (typeof showToast === 'function') showToast('Referral link copied');
    }).catch(() => {});
  }

  // Share (v2, 2026-09-29): the phone's own share sheet for the same link
  // Copy copies; where there is no share sheet (most desktops), it copies.
  function shareReferralLink() {
    const el = document.getElementById('referralLinkText');
    if (!el) return;
    const url = el.textContent;
    if (navigator.share) {
      navigator.share({ title: 'Triple H Enterprises referral link', url }).catch(() => { /* dismissed */ });
      return;
    }
    copyReferralLink();
  }

  function renderRecordSection(label, rows, emptyText) {
    let inner;
    if (rows.length === 0) {
      inner = '<div class="empty-state-small"><svg class="th-icon" aria-hidden="true"><use href="#icon-inbox" xlink:href="#icon-inbox"></use></svg>' + escapeHtml(emptyText) + '</div>';
    } else {
      inner = rows.map(r =>
        '<a class="client-record-row" href="' + r.href + '" style="text-decoration:none; color:inherit;">' +
          '<div><div class="client-record-title">' + escapeHtml(r.title) + '</div><div class="client-record-meta">' + escapeHtml(r.meta) + '</div></div>' +
          (r.amount ? '<div class="client-record-amount">' + r.amount + '</div>' : '') +
        '</a>'
      ).join('');
    }
    return '<div class="section-block"><div class="section-heading is-static"><span>' + label + ' (' + rows.length + ')</span></div>' + inner + '</div>';
  }
</script>

</body>
