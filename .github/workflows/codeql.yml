name: CodeQL

# Static analysis security scanning, covering both languages actually
# used in this repo (JavaScript for the public site and internal
# tools, Python for scripts/check-links.py). Free for public repos --
# this repo has been public since before this workflow was added, so
# there's no cost tradeoff to weigh here, just a real gap to close.
#
# Runs on push to main (catches something new immediately) and weekly
# (catches anything newly discovered in a dependency or pattern that
# wasn't flagged when the code was first written).

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 12 * * 1'  # ~06:00 Mountain Time, every Monday
  workflow_dispatch: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
