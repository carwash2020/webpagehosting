name: Tests and consistency check

# Runs on every push and pull request. This is dev-time verification only
# -- it has no effect on the actual GitHub Pages deployment, which still
# has no build step and deploys straight from the branch as always.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Check tool page consistency (auth gate, CSP, PWA block, cache-bust version)
        run: npm run check-consistency

      - name: Check for visual regressions against the committed baseline
        run: npm run check-visual-snapshot
