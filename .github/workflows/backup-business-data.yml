name: Backup business data (workspace_sync)

# Weekly backup of workspace_sync -- the table where every job, invoice,
# contract, quote, and Runway Dashboard number actually lives. Different
# from backup-cms-content.yml on purpose: that workflow reads 3 public
# tables using the anon key, which works because "Anyone can read site
# content/FAQ/terms" is a real, intentional policy. workspace_sync has
# no such policy -- it requires an authenticated session ("Require
# login", auth.role() = 'authenticated') -- so this workflow needs the
# service_role key instead, via a real GitHub secret. The service_role
# key is NEVER written into this file; it's referenced by name only and
# lives solely in this repo's own encrypted secrets.
#
# ONE-TIME SETUP (not done by this file, has to be done by hand in the
# GitHub UI): Settings -> Secrets and variables -> Actions -> New
# repository secret, name it exactly SUPABASE_SERVICE_ROLE_KEY, value
# from the Supabase dashboard (Project Settings -> API -> service_role
# secret). GitHub encrypts it and masks it from all logs automatically.

on:
  schedule:
    - cron: '41 9 * * 1'  # ~03:41 Mountain Time, Monday -- low-traffic, once a week is enough for this table
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch workspace_sync from Supabase
        shell: bash
        env:
          SUPABASE_URL: https://csvfqdjuobylgafgolho.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY repo secret is not set -- see the comment at the top of this workflow file for setup steps."
            exit 1
          fi
          mkdir -p backups
          curl -s -f \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/workspace_sync?select=code,data,updated_at&order=code" \
            -o "backups/workspace_sync.json.tmp" || {
              echo "::error::Failed to fetch workspace_sync from Supabase"; exit 1;
            }
          python3 -m json.tool "backups/workspace_sync.json.tmp" > "backups/workspace_sync.json"
          rm "backups/workspace_sync.json.tmp"

      - name: Commit if content actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/workspace_sync.json
          if git diff --cached --quiet; then
            echo "No content changes since last backup -- nothing to commit."
          else
            git commit -m "Automated business data backup ($(date -u +%Y-%m-%d))"
            git push
          fi
