name: Backup sensitive data (Client Portal, workspace_sync, leads, bookings, Storage files) to private repo

# Everything backed up here contains either real customer PII (a
# client's name/phone/address/email, a lead's contact info, a
# confirmed booking's details, a Client Portal work order/quote/
# invoice/message) or real files (job-site photos, receipts, secure
# documents, invoice PDFs, work-order photos) -- moved OUT of this
# repo's own backup workflow (backup-business-data.yml, now retired)
# after finding, while building this, that ALL THREE of
# workspace_sync/th_leads/th_bookings were being committed here even
# though THIS repo is public. workspace_sync specifically was checked
# directly and confirmed to already contain real, exposed client
# records (name, phone, address, email) and job records (client,
# phone, address) -- this had already happened, not just a latent risk
# like th_leads/th_bookings (both still empty at the time this was
# found). Storage files (job-photos, receipts, secure-documents) had
# no backup coverage anywhere at all until this workflow -- confirmed
# directly: neither this repo's old backup workflow nor Supabase's own
# Pro-tier daily backups cover Storage files, only database tables.
#
# Expanded 2026-09-07 to cover the Client Portal system and everything
# else added to the schema since this workflow was first written on
# 2026-08-27 -- checked directly against the live Supabase project
# (`list_tables`/`storage.buckets`) rather than assumed from memory,
# since RESTORE.md itself warned this exact drift ("any table/bucket
# added after 2026-08-27 that isn't already added to this workflow" is
# explicitly called out there as NOT covered). Found and added: 20
# tables (client_portal_invoices/quotes/jobs/checkups/work_orders/
# work_order_messages, quote_questions, portal_bug_reports,
# portal_client_errors, stripe_customers, card_authorizations,
# client_profiles, client_notification_preferences,
# notification_recipients, role_definitions, account_roles,
# push_subscriptions, notification_log, th_job_photos,
# workspace_sync_wiki) plus the 3 site_content/site_faq/site_terms
# `_history` audit tables (the live tables are already backed up
# separately, publicly, by backup-cms-content.yml since they're
# anon-readable by design -- but the `_history` tables aren't public
# and record `changed_by` email addresses, so they belong here, not
# there) and 2 Storage buckets (invoice-pdfs, work-order-photos).
# Deliberately NOT added: th_uptime_checks -- pure monitoring
# telemetry (no PII), grows without bound, and is trivially
# regenerated by the uptime checker itself if ever lost, so it doesn't
# meet this repo's own bar ("real customer PII or a real file that
# can't be regenerated").
#
# card_authorizations was checked directly (not assumed) for actual
# PCI-scope data before deciding to include it: `authorization_text`
# is a stored consent/disclosure statement, not a card number --
# Stripe holds the real card data and this table only ever stores a
# `stripe_customer_id` reference plus who authorized what. Still real
# client PII (email, signer name, amount, description) worth backing
# up, just not a PCI concern.
#
# Runs daily -- workspace_sync already lives safely in Supabase with
# its own real-time sync and (now, on Pro) daily platform backups, so
# this GitHub copy is a secondary, belt-and-suspenders backup, same as
# it always was. Storage files have no other backup at all until they
# land here, so a wide gap is a real, avoidable risk for something
# irreplaceable (a job-site photo can't be "re-taken" after the fact).
#
# ONE-TIME SETUP (has to be done by hand, cannot be done by this file):
# 1. Create a new fine-grained GitHub PAT scoped ONLY to the
#    tripleh-private-backups repo, with Contents: Read and write
#    permission. Settings -> Developer settings -> Personal access
#    tokens -> Fine-grained tokens -> Generate new token.
# 2. In THIS repo (webpagehosting): Settings -> Secrets and variables
#    -> Actions -> New repository secret, name it exactly
#    PRIVATE_BACKUP_REPO_TOKEN, paste the token from step 1.
# This workflow will fail loudly (not silently) until that secret
# exists -- see the check at the start of the first real step below.

on:
  schedule:
    - cron: '15 9 * * *'  # ~03:15 Mountain Time, daily
  workflow_dispatch: {}

permissions:
  contents: read  # this workflow never writes to THIS repo -- it only clones and pushes to the separate private repo via PRIVATE_BACKUP_REPO_TOKEN

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Needed for this repo's own scripts/backup-storage-bucket.py --
        # this workflow does NOT write anything back to this repo
        # (permissions: contents: read above is correct and sufficient).

      - name: Check required secrets are set
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRIVATE_BACKUP_REPO_TOKEN: ${{ secrets.PRIVATE_BACKUP_REPO_TOKEN }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY repo secret is not set."
            exit 1
          fi
          if [ -z "$PRIVATE_BACKUP_REPO_TOKEN" ]; then
            echo "::error::PRIVATE_BACKUP_REPO_TOKEN repo secret is not set -- see the comment at the top of this workflow file for setup steps. This backup cannot run without it."
            exit 1
          fi

      - name: Clone the private backup repo
        shell: bash
        env:
          PRIVATE_BACKUP_REPO_TOKEN: ${{ secrets.PRIVATE_BACKUP_REPO_TOKEN }}
        run: |
          git clone --quiet "https://x-access-token:${PRIVATE_BACKUP_REPO_TOKEN}@github.com/carwash2020/tripleh-private-backups.git" private-backups
          mkdir -p private-backups/database
          for bucket in secure-documents job-photos receipts invoice-pdfs work-order-photos; do
            mkdir -p "private-backups/storage/$bucket"
          done

      - name: Fetch all sensitive tables from Supabase
        shell: bash
        env:
          SUPABASE_URL: https://csvfqdjuobylgafgolho.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          declare -A QUERY=(
            [workspace_sync]="select=code,data,updated_at&order=code"
            [workspace_sync_wiki]="select=code,data,updated_at&order=code"
            [th_leads]="select=*&order=created_at"
            [th_bookings]="select=*&order=start_at"
            [th_job_photos]="select=*&order=id"
            [push_subscriptions]="select=*&order=id"
            [notification_log]="select=*&order=sent_at"
            [notification_recipients]="select=*&order=id"
            [site_content_history]="select=*&order=id"
            [site_faq_history]="select=*&order=id"
            [site_terms_history]="select=*&order=id"
            [role_definitions]="select=*&order=name"
            [account_roles]="select=*&order=email"
            [client_profiles]="select=*&order=client_email"
            [client_notification_preferences]="select=*&order=client_email"
            [stripe_customers]="select=*&order=id"
            [card_authorizations]="select=*&order=id"
            [client_portal_invoices]="select=*&order=id"
            [client_portal_quotes]="select=*&order=id"
            [client_portal_jobs]="select=*&order=id"
            [client_portal_checkups]="select=*&order=id"
            [client_portal_work_orders]="select=*&order=id"
            [client_portal_work_order_messages]="select=*&order=id"
            [quote_questions]="select=*&order=id"
            [portal_bug_reports]="select=*&order=id"
            [portal_client_errors]="select=*&order=id"
          )
          for table in "${!QUERY[@]}"; do
            curl -s -f \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/rest/v1/$table?${QUERY[$table]}" \
              -o "private-backups/database/${table}.json.tmp" || {
                echo "::error::Failed to fetch $table from Supabase"; exit 1;
              }
            python3 -m json.tool "private-backups/database/${table}.json.tmp" > "private-backups/database/${table}.json"
            rm "private-backups/database/${table}.json.tmp"
          done

      - name: Fetch every file from the 5 Storage buckets
        shell: bash
        env:
          SUPABASE_URL: https://csvfqdjuobylgafgolho.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for bucket in secure-documents job-photos receipts invoice-pdfs work-order-photos; do
            python3 scripts/backup-storage-bucket.py "$bucket" "private-backups/storage/$bucket"
          done

      - name: Commit and push to the private repo if content actually changed
        shell: bash
        run: |
          cd private-backups
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes since last backup -- nothing to commit."
          else
            git commit -m "Automated sensitive-data backup ($(date -u +%Y-%m-%d))"
            git push
          fi
