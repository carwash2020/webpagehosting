<!DOCTYPE html>
<html lang="en">
<head>
<script src="/auth.js"></script>
<script>
  requireAuth();
</script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triple H">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Review QR Code | Triple H Enterprises (Internal Tool)</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="/tools-common.js" defer></script>
<script src="/qrcode-lib.js" defer></script>
<style>
  body { padding: 90px 20px 60px; max-width: 520px; margin: 0 auto; text-align: center; }
  .qr-logo { width: 96px; height: auto; margin: 0 auto 14px; display: block; }
  .qr-business-name { font-family:'Oswald',sans-serif; font-weight: 700; font-size: 22px; color: var(--white); margin-bottom: 4px; }
  .qr-tagline { color: var(--text-dim); font-size: 14px; margin-bottom: 30px; }
  .qr-card {
    background: #ffffff; border-radius: var(--radius); padding: 28px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    margin-bottom: 24px;
  }
  .qr-card svg { width: 100%; height: auto; display: block; }
  .qr-instruction { font-family:'Oswald',sans-serif; font-weight: 600; font-size: 18px; color: var(--white); margin-bottom: 8px; }
  .qr-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 30px; }
  .qr-back-link { color: var(--blue-light); font-size: 14px; text-decoration: none; }
  .qr-loading { color: var(--text-dim); padding: 60px 0; }
</style>
</head>
<body>

<img class="qr-logo" src="/images/logo-signature-orange.png" alt="Triple H Enterprises">
<div class="qr-business-name">Triple H Enterprises</div>
<div class="qr-tagline">Handyman &amp; Appliance Repair</div>

<div class="qr-card" id="qrCard">
  <div class="qr-loading">Loading QR code&hellip;</div>
</div>

<div class="qr-instruction">Scan to leave us a review</div>
<div class="qr-sub">Takes about a minute &mdash; it means a lot to a small business like ours.</div>

<a class="qr-back-link" href="/review-request.html">&larr; Back to Review Request Sender</a>

<script>
  // Keep this in sync with GOOGLE_REVIEW_LINK in review-request.html --
  // duplicated rather than shared, since these are static files with no
  // build step to import a single shared constant from.
  const GOOGLE_REVIEW_LINK = 'https://g.page/r/CVJ0Qr-SsDkgEAI/review';

  // Rendered as inline SVG rather than a raster image so it stays crisp
  // at any display size, including shown very large on a phone screen
  // held up to a customer. 'H' (high) error correction trades a denser
  // code for real tolerance of a smudged screen, glare, or a slightly
  // off camera angle -- the actual conditions this gets scanned under,
  // standing at a job site, not a controlled studio shot.
  function qrToSvg(qr, moduleSize, margin) {
    const count = qr.getModuleCount();
    const size = count * moduleSize + margin * 2;
    let rects = '';
    for (let row = 0; row < count; row++) {
      for (let col = 0; col < count; col++) {
        if (qr.isDark(row, col)) {
          rects += `<rect x="${margin + col * moduleSize}" y="${margin + row * moduleSize}" width="${moduleSize}" height="${moduleSize}" fill="#0a0a0a"/>`;
        }
      }
    }
    return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR code linking to our Google review page">
      <rect width="${size}" height="${size}" fill="#ffffff"/>
      ${rects}
    </svg>`;
  }

  function renderQR() {
    if (typeof qrcode !== 'function') {
      document.getElementById('qrCard').innerHTML = '<div class="qr-loading">Couldn\u2019t load the QR code library. Try reloading the page.</div>';
      return;
    }
    const qr = qrcode(0, 'H');
    qr.addData(GOOGLE_REVIEW_LINK);
    qr.make();
    document.getElementById('qrCard').innerHTML = qrToSvg(qr, 8, 16);
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderQR();
    if (typeof setupSwipeBackToWorkspace === 'function') setupSwipeBackToWorkspace();
  });
</script>
</body>
</html>
