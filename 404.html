<style>
  /* This page is intentionally standalone -- it must render even if
     /styles.css itself is what failed to load -- so it carries its own
     copy of the type tokens. Keep in step with the :root block there. */
  :root{
    --font-display:'Anton', sans-serif;
    --font-body:'Newsreader', Georgia, 'Times New Roman', serif;
    --font-ui:'Oswald', sans-serif;
    --font-app:'Archivo', -apple-system, 'Segoe UI', sans-serif;
  }
  /* This page does not load /styles.css, so it repeats that file's
     rule that form controls take the app face rather than
     inheriting the body serif. */
  button,input,select,textarea,label{font-family:var(--font-app);}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#0a0a0a;
    color:#e8e8e8;
    font-family:var(--font-ui);
    text-align:center;
    padding:24px;
  }
  /* <main> (2026-09-23) gives screen readers a landmark to jump to. It
     repeats body's centred column, so the layout is unchanged. */
  main{display:flex; flex-direction:column; align-items:center;}
  img{width:100px; height:auto; margin-bottom:28px;}
  h1{
    font-family:var(--font-display);
    /* Anton ships a single 400 weight; the browser-default bold on h1
       made Chrome smear a synthetic bold over it. */
    font-weight:400;
    font-size:clamp(48px,10vw,90px);
    color:#ff8000;
    margin:0;
    line-height:1;
  }
  p{color:#9a9a9a; font-size:16px; max-width:420px; margin:16px 0 32px;}
  .btn-row{display:flex; flex-wrap:wrap; gap:14px; justify-content:center;}
  /* Buttons (2026-09-23): the site's current button language, copied
     from styles.css's .btn / .btn.orange / .btn.outline because this page
     doesn't load it. These were still the pre-U01 glossy gradients (two
     equal-weight filled buttons, blue and orange); U01 (2026-09-07)
     retired that look site-wide for one flat primary with a solid offset
     shadow and a quieter outline partner. Call keeps the orange, as it
     had here before. Keep in step with styles.css. */
  a.btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:15px 26px;
    border-radius:6px;
    border:2px solid transparent;
    font-weight:600;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:14px;
    text-decoration:none;
    white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
  }
  a.btn:hover{transform:translateY(-2px);}
  a.btn:active{transform:translateY(0) scale(.97);}
  a.btn:focus-visible{outline:2px solid #7ec4ff; outline-offset:2px; box-shadow:0 0 0 5px rgba(58,160,255,.16);}
  a.btn.orange{background:#ff8000; color:#161005; box-shadow:4px 4px 0 0 #c96400;}
  a.btn.orange:hover{box-shadow:6px 6px 0 0 #c96400;}
  a.btn.orange:active{box-shadow:2px 2px 0 0 #c96400;}
  a.btn.outline{background:transparent; color:#ff8000; border:1.5px solid rgba(255,128,0,.3);}
  a.btn.outline:hover{background:rgba(255,128,0,.08); border-color:#ff8000;}
  @media (prefers-reduced-motion:reduce){
    a.btn{transition:none;}
    a.btn:hover, a.btn:active{transform:none;}
  }
</style>
</head>
<body>
<main>
  <img src="/images/logo-signature-288.webp?v=202609251200" srcset="/images/logo-signature-176.webp?v=202609251200 176w, /images/logo-signature-288.webp?v=202609251200 288w, /images/logo-signature.webp?v=202608010300 550w" sizes="100px" alt="Triple H Enterprises logo" width="288" height="265">
  <h1>404</h1>
  <p>This page took a wrong turn. The page you're looking for doesn't exist or may have moved. If you were trying to reach us, we're still just a call or text away.</p>
  <div class="btn-row">
    <a class="btn outline" href="/">Back to Home</a>
    <a class="btn orange js-phone-link js-phone-text" href="tel:+14354141667">Call (435) 414-1667</a>
  </div>
</main>
<script>
  // Phone + email, read live from site_content (edited in
  // tools/site-content.html). This page had no site_content fetch before
  // 2026-09-23, so it carries its own, the same fail-silent way every
  // other public page does: if this doesn't succeed, the built-in number
  // already in the HTML stays exactly as it is.
  (function () {
    const SITE_CONTENT_SUPABASE_URL = 'https://csvfqdjuobylgafgolho.supabase.co';
    const SITE_CONTENT_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs';
    // The hooks sit on elements that can hold more than the number (the
    // header link's icon, a "Call" button's own word, a whole FAQ answer),
    // so this rewrites only the number or address itself, inside each
    // element's own text nodes (as js/review-stats.js does). Nothing is
    // added, removed or re-created (a new wrapper <span> once shifted
    // booking.html's text by a sub-pixel), and nothing is touched at all
    // when the saved value is the built-in one. Every public page that
    // reads phone/email this way carries this same function;
    // contact-hooks-public.test.js keeps the copies identical.
    function applySiteContact(map) {
      function swapText(selector, from, to) {
        if (to === from) return;
        document.querySelectorAll(selector).forEach(el => {
          for (let n = el.firstChild; n; n = n.nextSibling) {
            if (n.nodeType === 3 && n.nodeValue.indexOf(from) !== -1) n.nodeValue = n.nodeValue.split(from).join(to);
          }
        });
      }
      // Points each link at `to` and keeps whatever follows a "?" (a text
      // link's pre-filled ?body=, an email link's ?subject=). A link that
      // already goes there is left exactly as written.
      function swapHref(selector, to, alreadyThere) {
        document.querySelectorAll(selector).forEach(el => {
          const href = el.getAttribute('href') || '';
          const q = href.indexOf('?');
          if (!alreadyThere(q === -1 ? href : href.slice(0, q))) el.setAttribute('href', to + (q === -1 ? '' : href.slice(q)));
        });
      }
      // FAQPage search data repeats some answers word for word (the
      // St. George repair pages), so it follows the visible answer, the
      // way review-stats keeps aggregateRating in step with the page.
      function swapFaqSchema(from, to) {
        if (to === from) return;
        document.querySelectorAll('script[type="application/ld+json"]').forEach(s => {
          let data = null;
          try { data = JSON.parse(s.textContent); } catch (e) { return; }
          if (data && data['@type'] === 'FAQPage' && s.textContent.indexOf(from) !== -1) {
            s.textContent = s.textContent.split(from).join(JSON.stringify(to).slice(1, -1));
          }
        });
      }
      if (map.phone) {
        const digits = map.phone.replace(/\D/g, '');
        // A link written with or without the +1 rings the same phone.
        const dials = href => href.replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '') === digits;
        swapText('.js-phone-text', '(435) 414-1667', map.phone);
        swapFaqSchema('(435) 414-1667', map.phone);
        swapHref('.js-phone-link', 'tel:+1' + digits, dials);
        swapHref('.js-sms-link', 'sms:+1' + digits, dials);
        // Read by the messages this page builds later (errors, "Nothing
        // open online"), which fall back to the built-in number.
        window.__siteOverridePhone = map.phone;
      }
      if (map.email) {
        swapText('.js-email-text', 'steve@triplehenterprisesllc.biz', map.email);
        swapHref('.js-email-link', 'mailto:' + map.email, href => href === 'mailto:' + map.email);
        window.__siteOverrideEmail = map.email;
      }
    }

    fetch(SITE_CONTENT_SUPABASE_URL + '/rest/v1/site_content?select=key,value&key=in.(phone,email)', {
      headers: { 'apikey': SITE_CONTENT_SUPABASE_ANON_KEY },
    })
      .then(res => res.ok ? res.json() : [])
      .then(rows => {
        const map = {};
        (Array.isArray(rows) ? rows : []).forEach(r => { if (r.value) map[r.key] = r.value; });
        applySiteContact(map);
      })
      .catch(() => { /* static fallback content already shown is correct */ });
  })();
</script>
</body>
</html>
