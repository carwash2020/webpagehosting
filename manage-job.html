<style>
  :root{
    /* This page does not load /styles.css, so it carries its own copy
       of the type tokens. Keep in step with the :root block there
       (same as manage-booking.html). */
    --font-display:'Anton', sans-serif;
    --font-body:'Newsreader', Georgia, 'Times New Roman', serif;
    --font-ui:'Oswald', sans-serif;
    --font-app:'Archivo', -apple-system, 'Segoe UI', sans-serif;
    --bg:#0a0a0a;
    --bg-panel:#141414;
    --bg-panel-2:#1a1a1a;
    --border:#2a2a2a;
    --text:#e8e8e8;
    --text-dim:#9a9a9a;
    --orange:#ff8000;
    --orange-dark:#c96400;
    --orange-light:#ffb347;
    --orange-tint-soft: rgba(255,128,0,0.08);
    --orange-tint-border: rgba(255,128,0,0.32);
    --radius:12px;
    --success-text:#3ad66b;
    --hex: polygon(25% 6%, 75% 6%, 97% 50%, 75% 94%, 25% 94%, 3% 50%);
  }
  button,input,select,textarea,label{font-family:var(--font-app);}

  *{box-sizing:border-box;}
  body{
    margin:0; background:transparent; color:var(--text);
    font-family:var(--font-body); line-height:1.5;
    padding-bottom:80px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  .wrap{max-width:600px; margin:0 auto; padding:0 20px;}
  header.site-header{ padding:22px 0; border-bottom:1px solid var(--border); margin-bottom:40px; }
  header.site-header .wrap{display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--text);}
  .brand img{width:38px; height:auto;}
  .brand-name{font-family:var(--font-ui); font-weight:700; letter-spacing:1.5px; font-size:14px;}
  .phone-link{font-family:var(--font-ui); display:flex; align-items:center; gap:8px; color:var(--orange-light); text-decoration:none; font-weight:600; font-size:14.5px; white-space:nowrap; min-height:44px; padding:8px 10px; border-radius:8px; transition:background .15s ease;}
  @media (hover:hover){.phone-link:hover{background:var(--orange-tint-soft);}}
  .phone-link:focus-visible, a:focus-visible, button:focus-visible{outline:2px solid var(--orange-light); outline-offset:2px;}
  .phone-link svg{width:16px; height:16px; flex-shrink:0;}

  h1{font-family:var(--font-ui); font-size:28px; letter-spacing:0.3px; margin:0 0 24px; font-weight:700;}

  .hex-icon{
    width:44px; height:44px; flex-shrink:0; position:relative;
    background:var(--orange-tint-soft); border:1px solid var(--orange-tint-border);
    clip-path:var(--hex); display:flex; align-items:center; justify-content:center;
  }
  .hex-icon svg{width:20px; height:20px; color:var(--orange-light); stroke-width:2;}
  .hex-icon.is-muted{background:var(--bg-panel-2); border-color:var(--border);}
  .hex-icon.is-muted svg{color:var(--text-dim);}

  .job-card{
    background:var(--bg-panel-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; margin-bottom:22px; display:flex; gap:16px; align-items:flex-start;
  }
  .job-card .job-title{font-weight:700; font-size:16.5px; margin-bottom:4px;}
  .job-card .when{color:var(--text-dim); font-size:14.5px;}

  .state-msg{text-align:center; padding:36px 20px 8px; color:var(--text-dim);}
  .state-msg.is-error{color:#ff8a80;}
  /* Success states (2026-09-25 booking audit): the same green drawn check
     booking.html and manage-booking.html use, replacing the orange hex +
     unicode glyph those two retired on 2026-09-19/22. */
  .state-msg .checkmark.is-success{
    width:72px; height:72px; border-radius:50%; background:var(--success-text);
    display:flex; align-items:center; justify-content:center; margin:0 auto 18px; position:relative;
    animation:popIn .4s cubic-bezier(.2,1.4,.4,1) both;
  }
  .state-msg .checkmark.is-success svg{width:38px; height:38px;}
  .state-msg .checkmark.is-success svg path{
    fill:none; stroke:#0a0a0a; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:28; stroke-dashoffset:28; animation:drawCheck .35s ease-out .35s both;
  }
  .state-msg .checkmark.is-success::after{
    content:''; position:absolute; inset:0; border-radius:50%; border:3px solid var(--success-text); opacity:0;
    animation:ringPulse .9s ease-out .55s both;
  }
  @keyframes popIn{from{opacity:0; transform:scale(.5);} to{opacity:1; transform:scale(1);}}
  @keyframes drawCheck{to{stroke-dashoffset:0;}}
  @keyframes ringPulse{0%{opacity:.7; transform:scale(1);} 100%{opacity:0; transform:scale(1.9);}}
  .state-msg .success-title{font-family:var(--font-ui); font-size:22px; color:var(--text); margin:0 0 6px; font-weight:700;}
  @media (prefers-reduced-motion: reduce){
    .state-msg .checkmark.is-success *, .state-msg .checkmark.is-success::after{animation-delay:0s !important;}
  }
  .inline-error{color:#ff8a80; font-size:13.5px; margin:10px 0 0; text-align:center;}
  /* Errors slide in like the steps do, so a retry that fails again still
     reads as new. */
  .inline-error:not([hidden]){animation:stepIn .25s ease backwards;}
  .state-msg .hex-icon{margin:0 auto 18px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:15px 24px; border-radius:10px; font-family:var(--font-ui); font-weight:600;
    letter-spacing:1px; text-transform:uppercase; font-size:13.5px; border:2px solid transparent;
    cursor:pointer; width:100%; margin-top:16px; text-decoration:none;
    transition:background .15s ease, border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .btn.danger{background:transparent; border-color:#e05252; color:#e05252;}
  @media (hover:hover){.btn.danger:hover{background:rgba(224,82,82,0.1);}}
  .btn.danger:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  .btn.orange{background:var(--orange); color:#1a1a1a; box-shadow:0 6px 18px -8px rgba(255,128,0,.55);}
  @media (hover:hover){.btn.orange:hover{background:var(--orange-dark); transform:translateY(-1px);}}
  .btn.orange:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  .btn.ghost{background:transparent; border-color:var(--border); color:var(--text-dim);}
  @media (hover:hover){.btn.ghost:hover{border-color:var(--orange-tint-border); color:var(--text);}}

  #rescheduleStep{display:none;}
  #rescheduleStep.is-active{display:block; animation:stepIn .25s ease both;}
  #confirmStep{display:none;}
  #confirmStep.is-active{display:block; animation:stepIn .25s ease both;}
  @keyframes stepIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .date-field{
    width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg-panel-2); color:var(--text); font-family:var(--font-app); font-size:16px; min-height:48px;
    margin:18px 0 4px;
  }
  /* 16px, not 15 (2026-09-25): under 16px iOS Safari zooms the page on
     focus, the same fix booking.html's fields got on 2026-09-05. */
  .date-field:focus-visible{outline:2px solid var(--orange-light); outline-offset:2px;}
  .field-note{color:var(--text-dim); font-size:13px; margin:0 0 16px;}

  @media (max-width: 480px){
    .brand-name{display:none;}
    h1{font-size:24px;}
  }

  /* Blueprint backdrop (2026-09-25): the public site's drafting-paper
     linework (styles.css .bg-blueprint, dark values), copied because this
     page doesn't load styles.css. Without it, booking read as a
     different, flat-black site next to the page the visitor came from. */
  html{background:var(--bg);}
  .bg-blueprint{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-color:var(--bg);
    background-image:
      radial-gradient(ellipse 62% 46% at 86% 4%, rgba(255,128,0,.085), transparent 62%),
      radial-gradient(ellipse 58% 42% at 6% 72%, rgba(58,160,255,.070), transparent 62%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.026) 0 1px, transparent 1px 96px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.026) 0 1px, transparent 1px 96px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.011) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.011) 0 1px, transparent 1px 24px);
  }
  /* Loading skeleton (2026-09-25), same shape as the job card. */
  .job-card.is-skeleton .hex-icon{background:var(--bg-panel); border-color:var(--border);}
  .skel-line{height:12px; border-radius:6px; background:var(--border); animation:skelPulse 1.1s ease-in-out infinite;}
  .skel-line + .skel-line{margin-top:10px;}
  .skel-line.w-60{width:60%;} .skel-line.w-40{width:40%;}
  @keyframes skelPulse{0%,100%{opacity:.45;} 50%{opacity:1;}}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/" class="brand">
      <img src="/images/logo-signature-176.webp?v=202609251200" alt="Triple H Enterprises logo" width="176" height="162">
      <span class="brand-name">TRIPLE H ENTERPRISES</span>
    </a>
    <a href="tel:+14354141667" class="phone-link js-phone-link js-phone-text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

<main class="wrap">
  <h1>Manage Your Appointment</h1>
  <div id="content">
    <div class="job-card is-skeleton" aria-busy="true"><div class="hex-icon"></div><div style="flex:1;"><div class="skel-line w-60"></div><div class="skel-line w-40"></div></div></div>
    <p class="sr-only" role="status">Loading your appointment...</p>
  </div>
</main>

<script>
(function () {
  const SUPABASE_URL = 'https://csvfqdjuobylgafgolho.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs';

  function svgIcon(pathContent) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + pathContent + '</svg>';
  }

  function escapeHtml(value) {
    const s = value === null || value === undefined ? '' : String(value);
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function getTokenFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('token');
  }

  async function callRpc(fnName, args) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fnName, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
      },
      body: JSON.stringify(args),
    });
    if (!res.ok) return null;
    return res.json();
  }

  function renderState(html) {
    document.getElementById('content').innerHTML = html;
  }

  function renderNoToken() {
    renderState(
      '<div class="state-msg is-error">' +
      '<div class="hex-icon is-muted">' + svgIcon('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>') + '</div>' +
      '<p>This link is missing some information. If you followed a link from your confirmation email, try copying the full link into your browser, or call us and we\'ll take care of it.</p></div>'
    );
  }

  function renderNotFound() {
    renderState(
      '<div class="state-msg is-error">' +
      '<div class="hex-icon is-muted">' + svgIcon('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>') + '</div>' +
      '<p>We couldn\'t find an appointment for this link. If you think this is a mistake, give us a call and we\'ll sort it out.</p></div>'
    );
  }

  function formatJobDate(jobDate) {
    try {
      // job_date is a plain calendar date (no time component) that
      // already represents the business's own date -- it needs no
      // timezone conversion, just needs to never be reinterpreted
      // through one. Parsing as UTC and formatting as UTC keeps every
      // component (year/month/day) exactly as stored, regardless of
      // what timezone the browser or test runner happens to be in.
      // (Parsing as local time then formatting with timeZone:
      // 'America/Denver' -- the first attempt at fixing this -- was
      // itself a bug: it double-converts, shifting the displayed date
      // back a full day whenever the runtime's local zone is UTC.)
      return new Date(jobDate + 'T00:00:00Z').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    } catch (e) {
      return jobDate;
    }
  }

  function todayDateStrBusinessTz() {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit',
    }).formatToParts(new Date());
    const map = {};
    parts.forEach(p => { map[p.type] = p.value; });
    return map.year + '-' + map.month + '-' + map.day;
  }

  const CHECK_SVG = '<svg viewBox="0 0 24 24"><path d="M5 13l5 5L19 7"/></svg>';
  function successMsg(title, sub) {
    return '<div class="state-msg"><div class="checkmark is-success" aria-hidden="true">' + CHECK_SVG + '</div>' +
      '<p class="success-title" role="status">' + title + '</p>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>';
  }
  function showInlineError(id, text) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text;
    el.hidden = !text;
  }

  function renderJob(job, token) {
    if (job.cancelled_at) {
      renderState(
        '<div class="job-card">' + '<div class="hex-icon">' + svgIcon('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>') + '</div>' +
        '<div><div class="job-title">' + escapeHtml(job.title) + '</div>' +
        '<div class="when">' + escapeHtml(formatJobDate(job.job_date)) + '</div></div></div>' +
        '<div class="state-msg"><div class="hex-icon is-muted">' + svgIcon('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>') + '</div><p>This appointment has already been cancelled.</p></div>' +
        '<a href="/booking.html" class="btn orange">Book a new appointment</a>'
      );
      return;
    }

    const alreadyRequestedNote = job.reschedule_requested_date
      ? '<p class="field-note">You already requested ' + escapeHtml(formatJobDate(job.reschedule_requested_date)) + '. We\'ll follow up once it\'s confirmed -- feel free to request a different date instead.</p>'
      : '';

    renderState(
      '<div class="job-card">' + '<div class="hex-icon">' + svgIcon('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>') + '</div>' +
      '<div><div class="job-title">' + escapeHtml(job.title) + '</div>' +
      '<div class="when" id="currentWhen">' + escapeHtml(formatJobDate(job.job_date)) + '</div></div></div>' +
      alreadyRequestedNote +
      '<button type="button" class="btn orange" id="startRescheduleBtn">Request a different date</button>' +
      '<button type="button" class="btn danger" id="startCancelBtn">Cancel this appointment</button>' +
      '<div id="rescheduleStep">' +
      '  <label for="newDateInput" style="display:block; font-size:13px; color:var(--text-dim); margin:20px 0 0;">Preferred new date</label>' +
      '  <input type="date" class="date-field" id="newDateInput">' +
      '  <p class="field-note">This is a request, not an instant change -- we\'ll call or email to confirm the new date works.</p>' +
      '  <button type="button" class="btn orange" id="submitRescheduleBtn">Send request</button>' +
      '  <p class="inline-error" id="rescheduleError" role="alert" hidden></p>' +
      '  <button type="button" class="btn ghost" id="cancelRescheduleBtn">Never mind</button>' +
      '</div>' +
      '<div id="confirmStep">' +
      '  <p style="text-align:center; color:var(--text-dim); font-size:14.5px; margin-top:20px;">Are you sure? This can\'t be undone. You\'ll need to book or call us again if you change your mind.</p>' +
      '  <button type="button" class="btn danger" id="confirmCancelBtn">Yes, cancel it</button>' +
      '  <p class="inline-error" id="cancelError" role="alert" hidden></p>' +
      '  <button type="button" class="btn ghost" id="backOutBtn">Never mind, keep it</button>' +
      '</div>'
    );

    document.getElementById('startRescheduleBtn').addEventListener('click', function () {
      document.getElementById('startRescheduleBtn').style.display = 'none';
      document.getElementById('startCancelBtn').style.display = 'none';
      document.getElementById('rescheduleStep').classList.add('is-active');
      document.getElementById('newDateInput').min = todayDateStrBusinessTz();
    });
    document.getElementById('cancelRescheduleBtn').addEventListener('click', function () {
      document.getElementById('rescheduleStep').classList.remove('is-active');
      document.getElementById('startRescheduleBtn').style.display = '';
      document.getElementById('startCancelBtn').style.display = '';
    });
    document.getElementById('submitRescheduleBtn').addEventListener('click', async function () {
      const input = document.getElementById('newDateInput');
      if (!input.value) { showInlineError('rescheduleError', 'Choose a date first.'); input.focus(); return; }
      showInlineError('rescheduleError', '');
      const btn = document.getElementById('submitRescheduleBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      const result = await callRpc('request_job_reschedule_by_token', { p_token: token, p_new_date: input.value });
      const row = result && result[0];
      if (row && row.ok) {
        renderState(
          successMsg('Request sent', 'Got it -- we\'ll reach out to confirm ' + escapeHtml(formatJobDate(input.value)) + '. Until then your appointment stays on ' + escapeHtml(formatJobDate(job.job_date)) + '.')
        );
      } else if (row && row.message === 'already-cancelled') {
        renderState('<div class="state-msg"><p>This appointment was already cancelled.</p></div><a href="/booking.html" class="btn orange">Book a new appointment</a>');
      } else {
        // Stay on the form (2026-09-25): this used to replace the whole page
        // with the error, so the button reset above it never showed and the
        // only way to retry was reloading the link.
        btn.disabled = false;
        btn.textContent = 'Send request';
        showInlineError('rescheduleError', 'Something went wrong sending that request. Try again, or call us at ' + (window.__siteOverridePhone || '(435) 414-1667') + '.');
      }
    });

    document.getElementById('startCancelBtn').addEventListener('click', function () {
      document.getElementById('startCancelBtn').style.display = 'none';
      document.getElementById('startRescheduleBtn').style.display = 'none';
      document.getElementById('confirmStep').classList.add('is-active');
    });
    document.getElementById('backOutBtn').addEventListener('click', function () {
      document.getElementById('confirmStep').classList.remove('is-active');
      document.getElementById('startCancelBtn').style.display = '';
      document.getElementById('startRescheduleBtn').style.display = '';
    });
    document.getElementById('confirmCancelBtn').addEventListener('click', async function () {
      const btn = document.getElementById('confirmCancelBtn');
      btn.disabled = true;
      btn.textContent = 'Cancelling...';
      const result = await callRpc('cancel_job_by_token', { p_token: token });
      const row = result && result[0];
      if (row && row.ok) {
        renderState(
          successMsg('Your appointment has been cancelled.', '') +
          '<a href="/booking.html" class="btn orange">Book a new appointment</a>'
        );
      } else if (row && row.message === 'already-cancelled') {
        renderState('<div class="state-msg"><p>This appointment was already cancelled.</p></div><a href="/booking.html" class="btn orange">Book a new appointment</a>');
      } else {
        btn.disabled = false;
        btn.textContent = 'Yes, cancel it';
        showInlineError('cancelError', 'Something went wrong cancelling this appointment. Try again, or call us at ' + (window.__siteOverridePhone || '(435) 414-1667') + '.');
      }
    });
  }

  async function init() {
    const token = getTokenFromUrl();
    if (!token) { renderNoToken(); return; }

    const result = await callRpc('get_job_by_cancel_token', { p_token: token });
    if (!result || !result.length) { renderNotFound(); return; }
    renderJob(result[0], token);
  }

  init();
})();
</script>

<script>
  // Phone + email, read live from site_content (edited in
  // tools/site-content.html). This page had no site_content fetch before
  // 2026-09-23, so it carries its own, the same fail-silent way every
  // other public page does: if this doesn't succeed, the built-in number
  // already in the HTML stays exactly as it is.
  (function () {
    const SITE_CONTENT_SUPABASE_URL = 'https://csvfqdjuobylgafgolho.supabase.co';
    const SITE_CONTENT_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzdmZxZGp1b2J5bGdhZmdvbGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ3MjcsImV4cCI6MjEwMDkzMDcyN30.6GlvK-DfXf2lppS1kciZtsl4wHOpZz_yKtwsS1lyjrs';
    // The hooks sit on elements that can hold more than the number (the
    // header link's icon, a "Call" button's own word, a whole FAQ answer),
    // so this rewrites only the number or address itself, inside each
    // element's own text nodes (as js/review-stats.js does). Nothing is
    // added, removed or re-created (a new wrapper <span> once shifted
    // booking.html's text by a sub-pixel), and nothing is touched at all
    // when the saved value is the built-in one. Every public page that
    // reads phone/email this way carries this same function;
    // contact-hooks-public.test.js keeps the copies identical.
    function applySiteContact(map) {
      function swapText(selector, from, to) {
        if (to === from) return;
        document.querySelectorAll(selector).forEach(el => {
          for (let n = el.firstChild; n; n = n.nextSibling) {
            if (n.nodeType === 3 && n.nodeValue.indexOf(from) !== -1) n.nodeValue = n.nodeValue.split(from).join(to);
          }
        });
      }
      // Points each link at `to` and keeps whatever follows a "?" (a text
      // link's pre-filled ?body=, an email link's ?subject=). A link that
      // already goes there is left exactly as written.
      function swapHref(selector, to, alreadyThere) {
        document.querySelectorAll(selector).forEach(el => {
          const href = el.getAttribute('href') || '';
          const q = href.indexOf('?');
          if (!alreadyThere(q === -1 ? href : href.slice(0, q))) el.setAttribute('href', to + (q === -1 ? '' : href.slice(q)));
        });
      }
      // FAQPage search data repeats some answers word for word (the
      // St. George repair pages), so it follows the visible answer, the
      // way review-stats keeps aggregateRating in step with the page.
      function swapFaqSchema(from, to) {
        if (to === from) return;
        document.querySelectorAll('script[type="application/ld+json"]').forEach(s => {
          let data = null;
          try { data = JSON.parse(s.textContent); } catch (e) { return; }
          if (data && data['@type'] === 'FAQPage' && s.textContent.indexOf(from) !== -1) {
            s.textContent = s.textContent.split(from).join(JSON.stringify(to).slice(1, -1));
          }
        });
      }
      if (map.phone) {
        const digits = map.phone.replace(/\D/g, '');
        // A link written with or without the +1 rings the same phone.
        const dials = href => href.replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '') === digits;
        swapText('.js-phone-text', '(435) 414-1667', map.phone);
        swapFaqSchema('(435) 414-1667', map.phone);
        swapHref('.js-phone-link', 'tel:+1' + digits, dials);
        swapHref('.js-sms-link', 'sms:+1' + digits, dials);
        // Read by the messages this page builds later (errors, "Nothing
        // open online"), which fall back to the built-in number.
        window.__siteOverridePhone = map.phone;
      }
      if (map.email) {
        swapText('.js-email-text', 'steve@triplehenterprisesllc.biz', map.email);
        swapHref('.js-email-link', 'mailto:' + map.email, href => href === 'mailto:' + map.email);
        window.__siteOverrideEmail = map.email;
      }
    }

    fetch(SITE_CONTENT_SUPABASE_URL + '/rest/v1/site_content?select=key,value&key=in.(phone,email)', {
      headers: { 'apikey': SITE_CONTENT_SUPABASE_ANON_KEY },
    })
      .then(res => res.ok ? res.json() : [])
      .then(rows => {
        const map = {};
        (Array.isArray(rows) ? rows : []).forEach(r => { if (r.value) map[r.key] = r.value; });
        applySiteContact(map);
      })
      .catch(() => { /* static fallback content already shown is correct */ });
  })();
</script>

</body>
</html>
